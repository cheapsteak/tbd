# Lint scope. These keys take GLOB syntax.
included:
  - Sources
  # The two test targets guarded by the no_setenv_tbdhome_wrong_target custom rule.
  # A custom rule only runs on files already inside the global lint scope, so these
  # dirs must be listed here for that rule to fire in CI (`swiftlint --strict`).
  # TBDDaemonTests is intentionally left out — setenv("TBD_HOME") is legitimate there.
  - Tests/TBDSharedTests
  - Tests/TBDAppTests

excluded:
  - .build
  - Sources/TBDCLI   # CLI tool: print() to stdout is intentional user output

# Default rules disabled for PR1 minimum-scope adoption. Each rule fired on
# existing code; rather than reformat now, we silence and revisit per-rule.
# Rules below the blank line are warning-severity defaults that surface only
# under `--strict` (used in CI and the pre-push hook).
disabled_rules:
  - cyclomatic_complexity            # large RPC routers exceed default 10
  - file_length                      # several legitimate >400-line files
  - for_where                        # stylistic; existing for/if pattern is fine
  - force_try                        # used in a few startup paths; revisit later
  - function_body_length             # SwiftUI view bodies and routers exceed
  - function_parameter_count         # several constructors take many args
  - identifier_name                  # short names like db, wt, fm are deliberate
  - implicit_optional_initialization # stylistic
  - large_tuple                      # used in a couple of return types
  - line_length                      # many legitimate long lines (URLs, etc.)
  - nesting                          # nested types used in a few places
  - trailing_comma                   # stylistic
  - type_body_length                 # several large type bodies
  - unneeded_synthesized_initializer # stylistic
  - unused_optional_binding          # stylistic
  - vertical_whitespace              # stylistic

  - todo                                    # we use TODO: deliberately (per CLAUDE.md)
  - multiple_closures_with_trailing_closure # SwiftUI APIs frequently take label+content closures
  - trailing_newline                        # several files missing newline; not worth reformatting now
  - non_optional_string_data_conversion     # one site uses Data(string.utf8); revisit
  - comma                                   # stylistic; revisit when touching the file
  - prefer_type_checking                    # one `as? X != nil` site; intentional readability
  - redundant_discardable_let               # several `let _ = foo()` sites; intentional discarding
  - opening_brace                           # one violation; intentional inline brace
  - orphaned_doc_comment                    # one file-level doc comment without an attached decl
  - unused_closure_parameter                # one site; intentional named param for documentation
  - duplicate_imports                       # false-positives on `import os` after `import Foundation` (Foundation transitively exports os) — fires only on CI, not local. Re-enable if SwiftLint fixes the false positive.

custom_rules:
  no_print_in_sources:
    name: "No print() in Sources/"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Sources/(TBDShared|TBDDaemon|TBDApp)/.*\\.swift"
    regex: '\b(?:Swift\.|Foundation\.)?print\s*\('
    match_kinds:
      - identifier
    message: "Use os.Logger instead of print() in Sources/. See CLAUDE.md."
    severity: error

  no_scrollview_in_transcript_cards:
    name: "No direct ScrollView in transcript row cards"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Sources/TBDApp/Panes/Transcript/.*\\.swift"
    excluded:
      # TranscriptOverlayView renders outside the LazyVStack — ScrollView is safe here (#129).
      - "Sources/TBDApp/Panes/Transcript/TranscriptOverlayView\\.swift"
      # OverlayFileView is the body of a file frame in the overlay — sibling of LazyVStack, real ScrollView is safe.
      - "Sources/TBDApp/Panes/Transcript/OverlayFileView\\.swift"
    regex: '\bScrollView\b'
    match_kinds:
      - identifier
    message: "Transcript row cards must not contain a direct ScrollView — see Sources/TBDApp/Panes/Transcript/CLAUDE.md and issue #129."
    severity: error

  migration_use_helpers:
    name: "Use idempotent migration helpers"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Sources/TBDDaemon/Database/Database\\.swift"
    regex: 'create\(table:|\.add\(column:|CREATE\s+(?:TABLE|INDEX)'
    match_kinds:
      - identifier
      - string
    message: "New migrations must use createTableIfNotExists / addIndexIfMissing / addColumnIfMissing from MigrationHelpers.swift, not raw DDL. See Sources/TBDDaemon/Database/CLAUDE.md."
    severity: error

  no_setenv_tbdhome_wrong_target:
    name: "No setenv(TBD_HOME) outside TBDDaemonTests"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Tests/(TBDSharedTests|TBDAppTests)/.*\\.swift"
    regex: 'setenv\(\s*"TBD_HOME"'
    match_kinds:
      - identifier
      - string
    message: "setenv(\"TBD_HOME\") is only allowed in TBDDaemonTests under TBDHomeSerialized — it races concurrent suites in other targets (see CLAUDE.md, ConstantsTests flake)."
    severity: error

  no_tui_scraping_literals:
    name: "No agent-TUI literals in Sources/"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Sources/.*\\.swift"
    excluded:
      # Sanctioned scrapers, exempt with refactor-later intent — see CLAUDE.md "No TUI screen-scraping".
      # Drives the interactive `claude /login` TUI; no machine interface exists pre-login.
      - "Sources/TBDDaemon/Claude/LoginSessionCoordinator\\.swift"
      # Typed-but-unsent-input hibernation safety rail; no machine signal for composer state.
      - "Sources/TBDDaemon/Lifecycle/HibernationSafetyChecks\\.swift"
      # Embedded Nightwatch Python: fleet babysitting via screen classification is its purpose;
      # belongs outside TBD once a plugin/extensibility surface exists.
      - "Sources/TBDShared/NightwatchSkillContent\\.swift"
    regex: '❯|\[Pasted text|esc to interrupt|Do you want to proceed|Enter to select|Tab/Arrow keys|Ready to submit|Select login method|Ask Claude|Type a message|context used|until auto-compact|bypass permissions'
    match_kinds:
      - string
    message: "Don't infer agent state from rendered screen text — use hooks, transcript JSONL, control mode, or exit codes. See CLAUDE.md 'No TUI screen-scraping'."
    severity: error

  capture_pane_allowlist:
    name: "capture-pane use outside allowlisted files"
    # included/excluded HERE take REGEX (not glob), matched against file path.
    included:
      - "Sources/.*\\.swift"
    excluded:
      # The allowlist. Capturing pane text is legitimate ONLY as verbatim pass-through
      # (display / transport / snapshot). Adding a file here draws High-severity review
      # scrutiny — see CLAUDE.md "No TUI screen-scraping".
      - "Sources/TBDDaemon/Tmux/TmuxManager\\.swift"                     # defines the capture API
      - "Sources/TBDDaemon/Server/RPCRouter\\+TerminalHandlers\\.swift"  # terminal.read returns text verbatim
      - "Sources/TBDDaemon/Lifecycle/HibernationCoordinator\\.swift"     # ANSI display snapshot + safety-rail feed
      # Capture-for-replay: rebuilds a pane's display state verbatim for control-mode
      # attach/repair (replay bytes); never parses captured content for agent state.
      - "Sources/TBDDaemon/Tmux/ControlMode/PaneCaptureReplay\\.swift"
      # Closed-terminal history: closeHookTerminal snapshots the dying pane's
      # scrollback verbatim into ~/tbd/terminal-history for later READ-ONLY
      # display (archival capture-for-display, the sanctioned use). The text is
      # never parsed, matched, or used to infer agent/TUI state — exactly NOT
      # the state-inference scraping the rule bans.
      - "Sources/TBDDaemon/Lifecycle/WorktreeLifecycle\\+PreSession\\.swift"
      # Same sanctioned archival-capture use: captureThenKillWindow snapshots a
      # live terminal's scrollback verbatim into terminal-history before the
      # archive/reconcile-auto-archive paths kill its window (the archived row +
      # history survive). Never parsed for agent/TUI state.
      - "Sources/TBDDaemon/Lifecycle/WorktreeLifecycle\\.swift"
      - "Sources/TBDShared/NightwatchSkillContent\\.swift"               # embedded Python babysitter (see rule above)
    regex: 'capturePane\w*\s*\(|capture-pane'
    match_kinds:
      - identifier
      - string
    message: "capture-pane text may only be passed through verbatim (display/transport/snapshot) from allowlisted files — never parsed for agent state. See CLAUDE.md 'No TUI screen-scraping'."
    severity: error
