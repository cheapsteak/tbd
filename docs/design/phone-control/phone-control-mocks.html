<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Reviewed mocks for the phone UI in docs/specs/2026-11-07-phone-control-design.md, section 8.
  One self-contained page: open it in any browser. On a phone it fills the screen, and the
  MOCK tab at the top opens the controls. On a wider screen the controls sit beside a phone frame.
  The first option in each "Design choices" row is the chosen design. All names are placeholders.
-->
<title>TBD Phone Control Mocks</title>
<meta name="color-scheme" content="light dark">
<style>
/* Layout: one phone frame beside a mock panel on wide screens; on a phone the frame fills the screen and the panel opens from a tab at the top. */
:root{
  /* review page around the frame */
  --page:#DADAD5; --page-fg:#1B1C1E; --page-muted:#5C5E63; --page-line:#BDBDB6; --frame:#1F2023;
  /* look B: laptop-sidebar surfaces */
  --side:#E8E8EB; --pane:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E73; --sep:#D3D3D8; --sel:#D2D2D8; --box:#F1F1F3;
  --accent:#2F6FE4; --on-accent:#FFFFFF; --scrim:rgba(18,18,22,.34); --shadow:rgba(0,0,0,.16);
  --cam:#0D0E10; --cam-fg:#EDEDED; --qr-bg:#FFFFFF; --qr-fg:#111111;
  /* status colours: from the laptop sidebar (amber hand, red octagon, orange triangle, dots, moon) */
  --wait-fg:#8F5300; --wait-bg:#FFEFD1; --wait:#E39514;
  --err-fg:#BE1A20; --err-bg:#FDE3E3; --err:#E0484D;
  --rate-fg:#A84508; --rate-bg:#FDE8D8; --rate:#EE6A12;
  --work-fg:#0A56C2; --work-bg:#E1ECFF; --work:#3B7EF0;
  --idle-fg:#55585E; --idle-bg:#EBECEE; --idle:#9A9DA3;
  --park-fg:#5E616A; --park-bg:#ECECF1; --park:#8E919A;
  --add:#1F8A3B; --del:#C92A2A;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  /* density (compact = look B as shown) */
  --row-h:30px; --fs:13px; --small:11px; --tool-h:24px; --tool-fs:12px; --ib:40px; --home:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#101112; --page-fg:#E8E8E5; --page-muted:#9A9CA1; --page-line:#34353A; --frame:#3A3B40;
    --side:#262628; --pane:#1C1C1E; --fg:#E8E8EA; --muted:#8F8F95; --sep:#3A3A3E; --sel:#3A3A40; --box:#2A2A2D;
    --accent:#4C8DFF; --on-accent:#FFFFFF; --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.5);
    --wait-fg:#FFC468; --wait-bg:#3A2A0D; --wait:#F2A93B;
    --err-fg:#FF8F8F; --err-bg:#3E1517; --err:#F0595E;
    --rate-fg:#FFA66E; --rate-bg:#3D2110; --rate:#F57D2E;
    --work-fg:#8DB9FF; --work-bg:#14294A; --work:#5B95F5;
    --idle-fg:#B7BAC1; --idle-bg:#2A2B2F; --idle:#7D8087;
    --park-fg:#9FA2AA; --park-bg:#27282C; --park:#80838B;
    --add:#4CC56B; --del:#FF6B6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --page:#101112; --page-fg:#E8E8E5; --page-muted:#9A9CA1; --page-line:#34353A; --frame:#3A3B40;
    --side:#262628; --pane:#1C1C1E; --fg:#E8E8EA; --muted:#8F8F95; --sep:#3A3A3E; --sel:#3A3A40; --box:#2A2A2D;
    --accent:#4C8DFF; --on-accent:#FFFFFF; --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.5);
    --wait-fg:#FFC468; --wait-bg:#3A2A0D; --wait:#F2A93B;
    --err-fg:#FF8F8F; --err-bg:#3E1517; --err:#F0595E;
    --rate-fg:#FFA66E; --rate-bg:#3D2110; --rate:#F57D2E;
    --work-fg:#8DB9FF; --work-bg:#14294A; --work:#5B95F5;
    --idle-fg:#B7BAC1; --idle-bg:#2A2B2F; --idle:#7D8087;
    --park-fg:#9FA2AA; --park-bg:#27282C; --park:#80838B;
    --add:#4CC56B; --del:#FF6B6B;
    color-scheme:dark;
}
body.d-comfy{--row-h:44px; --fs:15px; --small:12.5px; --tool-h:36px; --tool-fs:13.5px; --ib:44px}

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--page);color:var(--page-fg);font-family:var(--sys);font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dots{display:inline-flex;gap:2px;align-items:center;justify-content:center;width:14px;flex:none}
.dots b{width:3px;height:3px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite ease-in-out}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
.spin{width:18px;height:18px;flex:none;border:2px solid var(--sep);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.dots b,.spin,.tdot.st-work{animation:none}}
.plus{color:var(--add);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.95em}
.minus{color:var(--del);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.95em}

/* status classes set three colours each */
.st-wait{--sf:var(--wait-fg);--sb:var(--wait-bg);--sd:var(--wait)}
.st-err{--sf:var(--err-fg);--sb:var(--err-bg);--sd:var(--err)}
.st-rate{--sf:var(--rate-fg);--sb:var(--rate-bg);--sd:var(--rate)}
.st-work{--sf:var(--work-fg);--sb:var(--work-bg);--sd:var(--muted)}
.st-idle{--sf:var(--idle-fg);--sb:var(--idle-bg);--sd:var(--idle)}
.st-park{--sf:var(--park-fg);--sb:var(--park-bg);--sd:var(--park)}
.st-gone{--sf:var(--idle-fg);--sb:var(--idle-bg);--sd:var(--idle)}
.st-unk{--sf:var(--idle-fg);--sb:var(--idle-bg);--sd:var(--idle)}

/* ---------- page and frame ---------- */
#page{min-height:100%;display:flex;justify-content:center;align-items:flex-start;gap:32px;padding:24px 16px}
#frame{width:390px;height:844px;flex:none;border:7px solid var(--frame);border-radius:50px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--side);color:var(--fg);font-size:var(--fs);line-height:1.4}
#frame[data-screen="session"]{background:var(--pane)}
.sim-sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:15px;font-weight:600;background:var(--side)}
.sim-sb .bat{display:flex;gap:6px;align-items:center}
.sim-sb .bat i{display:block;width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.85;position:relative}
.sim-sb .bat i::after{content:"";position:absolute;inset:1.5px;right:6px;background:currentColor;border-radius:1.5px}
.sim-home{height:var(--home);flex:none;display:grid;place-items:center}
.sim-home::before{content:"";width:134px;height:5px;border-radius:3px;background:currentColor;opacity:.3}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.mocktab{display:none}

/* ---------- loader strip ---------- */
#strip{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--sep);background:var(--side)}
#strip b{color:var(--fg);font-weight:600}
#strip{position:relative;z-index:25}
#strip .re{display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding-right:8px;color:var(--wait-fg);font-weight:600}
#strip svg.i{font-size:13px}
.lapbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px 0 6px;margin-left:-6px;border-radius:6px;color:var(--muted)}
.lapbtn:active,.lapbtn[aria-expanded="true"]{background:var(--sel)}
.lapbtn b{color:var(--fg);font-weight:600}
.lapbtn svg.car{font-size:11px;transition:transform .15s}
.lapbtn[aria-expanded="true"] svg.car{transform:rotate(180deg)}
.lapdrop{position:absolute;top:calc(100% + 4px);left:8px;width:260px;max-width:calc(100% - 16px);background:var(--pane);border:1px solid var(--sep);border-radius:12px;box-shadow:0 8px 28px var(--shadow);padding:6px;display:flex;flex-direction:column;font-size:var(--fs);color:var(--fg)}
.ldi{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:8px;text-align:left;width:100%}
.ldi:active{background:var(--box)}
.ldi > svg.i{font-size:17px;color:var(--muted)}
.ldi span{flex:1;display:flex;flex-direction:column;min-width:0}
.ldi small{color:var(--muted);font-size:var(--small);display:flex;align-items:center;gap:5px}
.ldi .tick{color:var(--accent);font-size:16px}
.ldi.act{color:var(--accent);font-weight:600}
.ldi.act > svg.i{color:var(--accent)}
.ldsep{height:1px;background:var(--sep);margin:4px 6px}
.prof{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 4px 0 6px;border-radius:5px;background:var(--box);color:var(--fg);font-weight:500;font-size:var(--small);flex:none}
.prof svg.i{width:10px;height:10px;color:var(--muted)}
.prof[aria-expanded="true"]{background:var(--sel)}
.profdrop{top:52px;left:40px;z-index:22}
.modeldrop{top:52px;left:auto;right:8px;z-index:22}
.md-other{display:flex;gap:6px;padding:6px 6px 2px}
.md-other input{flex:1;min-width:0;min-height:40px;border:1px solid var(--sep);border-radius:8px;background:var(--side);padding:8px 10px;font-size:16px}
.pd-lbl{font-size:var(--small);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 10px 2px}
.pd-ask{display:flex;flex-direction:column;gap:6px;padding:6px 8px 4px;line-height:1.4}
.pd-ask span{color:var(--muted);font-size:var(--small)}
.pd-ask div{display:flex;flex-direction:column;gap:6px;margin-top:4px}

/* ---------- sessions list ---------- */
.l-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 14px;flex:none}
.l-head h1{margin:0;font-size:var(--fs);font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.newbtn{display:inline-flex;align-items:center;gap:4px;height:var(--ib);padding:0 10px;border-radius:8px;color:var(--accent);font-weight:600}
.list{flex:1;overflow-y:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.repo-row{display:flex;align-items:center;padding-right:6px}
.repo{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:30px;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted)}
.repo-add{width:40px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:15px;flex:none}
.repo-add:active{background:var(--sel)}
body.d-comfy .repo{height:44px;font-size:13px}
body.d-comfy .repo-add{width:44px;height:44px;font-size:17px}
.repo svg.i{width:12px;height:12px;transition:transform .15s}
.repo[aria-expanded="false"] svg.i{transform:rotate(-90deg)}
.rows{list-style:none;margin:0 0 6px;padding:0 6px}
.row{display:flex;align-items:center;gap:8px;width:100%;height:var(--row-h);padding:0 8px 0 24px;border-radius:6px;text-align:left}
.row:active,.row.sel{background:var(--sel)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{color:var(--muted);font-size:.92em}
.row .rb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--sep);border-radius:5px;padding:0 4px;height:16px;flex:none}
.row .rb svg.i{width:11px;height:11px}
.row .t{font-size:var(--small);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.row .g{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;min-width:16px;color:var(--sd);flex:none}
.row .g svg.i{width:14px;height:14px}
.row .g .w{display:none;font-size:var(--small);font-weight:600;color:var(--sf)}
body.w-words .row .g .w{display:inline}
body.w-words .row .g{min-width:72px}
.list-foot{padding:10px 14px;font-size:var(--small);color:var(--muted)}

/* ---------- session ---------- */
.s-head{display:flex;align-items:center;gap:2px;min-height:48px;padding:2px 4px;background:var(--side);border-bottom:1px solid var(--sep);flex:none}
.ib{width:var(--ib);height:var(--ib);display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:18px;flex:none}
.s-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:0 2px}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.t1 span{overflow:hidden;text-overflow:ellipsis}
.t2{font-size:var(--small);color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.t2 .w{color:var(--sf);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.t2 .w svg.i{color:var(--sd);width:12px;height:12px}
.rb2{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--sep);border-radius:5px;padding:0 4px;height:16px;flex:none}
.rb2 svg.i{width:11px;height:11px}
.tg{display:flex;align-items:center;gap:6px;font-size:var(--small);color:var(--muted);height:var(--ib);padding:0 4px;cursor:pointer;flex:none;position:relative}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg i{width:30px;height:18px;border-radius:9px;background:var(--sep);display:block;position:relative;transition:background .15s}
.tg i::after{content:"";position:absolute;width:14px;height:14px;top:2px;left:2px;border-radius:50%;background:var(--pane);box-shadow:0 1px 2px var(--shadow);transition:transform .15s}
.tg input:checked + i{background:var(--accent)}
.tg input:checked + i::after{transform:translateX(12px)}
.tg input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.banner{display:flex;gap:7px;align-items:flex-start;padding:7px 12px;font-size:var(--small);background:var(--sb);color:var(--sf);flex:none}
.banner svg.i{margin-top:1px;color:var(--sd)}
.tabs{display:flex;overflow-x:auto;background:var(--side);border-bottom:1px solid var(--sep);padding:0 6px;flex:none;scrollbar-width:none}
.tab{height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
body.tabs-pills .tabs{padding:6px 8px;gap:6px}
body.tabs-pills .tab{height:32px;border:1px solid transparent;border-radius:16px;padding:0 12px}
body.tabs-pills .tab[aria-selected="true"]{background:var(--pane);border-color:var(--sep);box-shadow:0 1px 2px var(--shadow)}
body.d-comfy .tab{height:44px}
body.d-comfy.tabs-pills .tab{height:36px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--sd);flex:none}
.tdot.st-work{background:var(--work);animation:pulse 1.4s infinite ease-in-out}
@keyframes pulse{50%{opacity:.35}}
.tx-wrap{flex:1;min-height:0;position:relative}
.tx{position:absolute;inset:0;overflow-y:auto;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--pane);-webkit-overflow-scrolling:touch}
.tx > :first-child{margin-top:auto}
.me{background:var(--box);border-radius:8px;padding:7px 10px;line-height:1.45;overflow-wrap:anywhere}
.who{display:block;font-size:var(--small);font-weight:700;color:var(--muted);margin-bottom:2px}
.say{line-height:1.5;overflow-wrap:anywhere}
.say p{margin:0 0 6px}.say p:last-child{margin-bottom:0}
.say ul{margin:0 0 6px;padding-left:18px}
.say code,.me code{font-family:var(--mono);font-size:.9em;background:var(--box);padding:0 4px;border-radius:4px}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.morebtn{color:var(--accent);font-weight:600;font-size:var(--small);min-height:32px}
.tool{display:flex;align-items:center;gap:6px;width:calc(100% + 8px);margin:0 -4px;padding:0 4px;min-height:var(--tool-h);font-size:var(--tool-fs);color:var(--muted);border-radius:6px;text-align:left}
button.tool:active{background:var(--box)}
.tool .tri{width:9px;height:9px;opacity:.8}
.tool .sp{width:9px;flex:none}
.tool svg.ti{width:13px;height:13px}
.tool b{color:var(--fg);font-weight:600;flex:none}
.tool code{font-family:var(--mono);font-size:.95em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .fs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.tool .cnt{flex:none;font-size:var(--small)}
.tool .okm{color:var(--add);display:inline-flex}
.tool .fail{color:var(--del);font-weight:600;flex:none}
.tool .dots{color:var(--muted)}
.detail{margin:0 0 4px 15px;border:1px solid var(--sep);border-radius:8px;background:var(--box);padding:8px;display:flex;flex-direction:column;gap:5px;font-size:var(--small);color:var(--muted)}
.detail pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.dl{font-weight:700;color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.toobig{display:flex;gap:6px;align-items:center;color:var(--wait-fg);font-weight:600}
.loading{display:flex;gap:8px;align-items:center}
.nest{margin:0 0 2px 6px;padding-left:10px;border-left:2px solid var(--sep);display:flex;flex-direction:column;gap:6px}
.slash{display:flex;flex-direction:column;gap:2px;font-size:var(--tool-fs);color:var(--muted)}
.slash code{font-family:var(--mono);color:var(--fg);background:var(--box);border-radius:4px;padding:1px 6px;align-self:flex-start}
.peer{border:1px dashed var(--sep);border-radius:8px;padding:7px 10px;line-height:1.45}
.peer .who{display:flex;align-items:center;gap:4px}
.extra{font-size:var(--small);color:var(--muted);line-height:1.45;padding:2px 0}
.extra .dl{margin-right:6px}
.receipt{display:flex;gap:5px;align-items:center;justify-content:center;font-size:var(--small);color:var(--muted);padding:2px 0}
.receipt svg.i{color:var(--add)}
.errrow{display:flex;gap:7px;align-items:flex-start;border-radius:8px;padding:7px 10px;font-size:var(--small);background:var(--sb);color:var(--sf)}
.errrow svg.i{margin-top:2px;color:var(--sd)}
.working{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:var(--tool-fs);min-height:22px}
.working span{font-variant-numeric:tabular-nums}
.pill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:36px;padding:0 16px;border-radius:18px;background:var(--fg);color:var(--pane);font-size:13px;font-weight:600;box-shadow:0 2px 10px var(--shadow);display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:2}
.codex-note{margin:auto;max-width:28ch;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px}
.codex-note b{color:var(--fg)}

/* dock: prompt card and composer */
.dock{flex:none;background:var(--pane);border-top:1px solid var(--sep);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--sep);border-radius:10px;background:var(--box);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:430px;overflow-y:auto}
.c-head{display:flex;align-items:center;gap:6px;font-size:var(--small);font-weight:700;color:var(--wait-fg);min-height:24px}
.c-head svg.i{color:var(--wait)}
.c-head .hide{margin-left:auto;color:var(--muted);font-weight:500;height:28px;padding:0 4px;display:inline-flex;align-items:center;gap:3px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--sep)}
.steps i.on{background:var(--wait)}

.opt.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.opt.danger{color:var(--err-fg)}
.opt.ghost{color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--sep);border-radius:8px;background:var(--pane);cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.c-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--sep);background:var(--pane);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--err-fg)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.perm-tool{display:flex;gap:6px;align-items:center;font-weight:700}

.perm-target{font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--pane);border:1px solid var(--sep);border-radius:6px;padding:8px;margin:0}
.review{display:flex;flex-direction:column;gap:4px}
.review button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:44px;padding:6px 10px;border-radius:8px;background:var(--pane);border:1px solid var(--sep);text-align:left}

.card-strip{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--sep);background:var(--wait-bg);color:var(--wait-fg);font-weight:600;width:100%}

.mi > svg.i{font-size:18px;color:var(--muted)}

.mi .tick{color:var(--accent);font-size:17px}
.lbl{font-size:var(--small);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 4px 0}
.segc{display:flex;background:var(--box);border-radius:9px;padding:2px;gap:2px;flex:none}
.segc button{flex:1;min-height:36px;border-radius:7px;font-weight:600;color:var(--muted);text-align:center}
.segc button[aria-pressed="true"]{background:var(--pane);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}
.frow{display:flex;flex-direction:column;gap:4px;padding:8px 12px}

.frow input[type=text],.frow input[type=number],.frow select,.frow textarea{width:100%;min-height:40px;border:1px solid var(--sep);border-radius:8px;background:var(--side);padding:8px 10px;font-size:16px}

#panel h1{margin:0;font-size:18px;text-wrap:balance}
#panel > p{margin:0;color:var(--page-muted);line-height:1.45}
#panel h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--page-muted);margin:0 0 6px}
.ix{display:flex;flex-wrap:wrap;gap:4px}
.ix button{padding:5px 9px;border-radius:7px;border:1px solid var(--page-line);color:var(--page-fg);font-size:12.5px;line-height:1.3}

.oprow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.oprow > span{font-weight:600}
.oprow small{color:var(--page-muted)}
.pseg{display:flex;flex-wrap:wrap;border:1px solid var(--page-line);border-radius:8px;padding:2px;gap:2px;align-self:flex-start}

.panel-close{display:none}
.rules{margin:0;padding-left:16px;color:var(--page-muted);line-height:1.5}

  #panel{position:fixed;inset:0;z-index:60;width:auto;max-height:none;top:0;background:var(--page);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

}

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="lnk" role="link" tabindex="0" data-act="link" data-url="$2">$1</span>');
}
function md(src) {
  return src.split(/\n\n+/).map(function (block) {
    var lines = block.split('\n');
    if (lines.every(function (l) { return /^- /.test(l); })) return '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}

var TOOL_IC = { Read: 'eye', Grep: 'search', Glob: 'search', Bash: 'term', Edit: 'pen', Write: 'pen', MultiEdit: 'pen', WebFetch: 'globe' };

function foldHTML(run) {

  });

}

/* ---------- events ---------- */
var A = {

  retry: function () { if (state.laptop === 'acme-studio') { toast('Still offline'); return; } connect(); },
  repo: function (el) { state.collapsed[el.dataset.id] = !state.collapsed[el.dataset.id]; render(); },
  'open-row': function (el) { openRow(el.dataset.id); },

  'model-set': function () { var s = S[state.sid]; setModel(s, (state.sd.other || '').trim() || state.sd.model || s.model); },
  'model-menu': function () { state.modelMenu = !state.modelMenu; state.modelOther = ''; state.profMenu = false; state.profAsk = null; render(); },
  'mm-pick': function (el) { var s = S[state.sid]; if (el.dataset.m === s.model) { state.modelMenu = false; render(); return; } setModel(s, el.dataset.m); },
  'mm-set': function () { var m = (state.modelOther || '').trim(); if (m) setModel(S[state.sid], m); },
  'new-mode': function (el) { state.sd.mode = el.dataset.m; if (el.dataset.m === 'remote' && !state.sd.prov) state.sd.prov = 'acme-cloud'; render(); },
  'new-prov': function (el) { state.sd.prov = el.dataset.id; render(); },
  create: function () {

  'p-pick': function (el) {

function keepPlace() { var keep = state.stick; state.stick = false; render(); state.stick = keep; }
function toggleDetail(id) {
  if (state.open[id]) { state.open[id] = null; keepPlace(); return; }
  state.open[id] = 'loading'; keepPlace();
  setTimeout(function () { if (state.open[id] === 'loading') { state.open[id] = 'open'; keepPlace(); } }, 450);
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (state.lapMenu && !e.target.closest('#panel') && (!el || el.dataset.act !== 'lap-menu')) {
    state.lapMenu = false;
    if (!el || !e.target.closest('.lapdrop')) { e.preventDefault(); render(); return; }
  }
  if (state.profMenu && !e.target.closest('#panel') && !e.target.closest('.profdrop') && (!el || (el.dataset.act !== 'prof-menu' && el.dataset.act !== 'model-menu'))) {
    state.profMenu = false; state.profAsk = null; e.preventDefault(); render(); return;
  }
  if (state.modelMenu && !e.target.closest('#panel') && !e.target.closest('.modeldrop') && (!el || (el.dataset.act !== 'model-menu' && el.dataset.act !== 'prof-menu'))) {
    state.modelMenu = false; state.modelOther = ''; e.preventDefault(); render(); return;
  }
  if (!el || el.disabled) return;
  var fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lnk')) { e.preventDefault(); A.link(e.target); }
});
document.addEventListener('change', function (e) {
  var el = e.target, k = el.dataset.change;
  if (k === 'details') { state.details = el.checked; state.stick = true; render(); }
  if (k === 'p-check') {
    var ps = S[state.sid].ps, i = +el.dataset.i, at2 = ps.checks.indexOf(i);
    if (el.checked && at2 < 0) ps.checks.push(i); if (!el.checked && at2 >= 0) ps.checks.splice(at2, 1);
    var b = document.querySelector('[data-act="p-submit-multi"]');
    if (b) { b.disabled = !ps.checks.length; b.textContent = 'Send ' + (ps.checks.length ? ps.checks.length + ' selected' : 'answer'); }
  }
});
document.addEventListener('input', function (e) {
  var el = e.target, k = el.dataset.in, s = S[state.sid];
  if (k === 'draft') {
    s.draft = el.value; autosize(el);
    var b = document.querySelector('[data-act="send"]'); if (b) b.disabled = !el.value.trim();
    if (s.refusal) { s.refusal = null; var r = document.querySelector('.refusal'); if (r) r.remove(); }
  }
  if (k === 'other') s.ps.otherText = el.value;
  if (k === 'deny') s.ps.denyText = el.value;
  if (k === 'mm-other') {
    state.modelOther = el.value; var mb = document.querySelector('[data-act="mm-set"]'); if (mb) mb.disabled = !el.value.trim();
  }
  if (k === 'model-other') {
    state.sd.other = el.value; var set = document.querySelector('[data-act="model-set"]');
    if (set) set.disabled = false;
    document.querySelectorAll('.sheet .tick').forEach(function (t) { if (el.value.trim()) t.style.visibility = 'hidden'; else t.style.visibility = ''; });
  }
  if (k === 'new-msg') {
    state.sd.msg = el.value; var c = document.querySelector('[data-act="create"]');
    if (c) c.disabled = !(el.value.trim() && state.sd.repo && (state.sd.mode !== 'remote' || state.sd.prov));
  }
});
