name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftlint
        run: brew install swiftlint

      - name: SwiftLint (strict)
        run: swiftlint --strict

  plans-guard:
    name: No committed implementation plans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed implementation plans
        run: scripts/check-no-committed-plans.sh

  test:
    runs-on: macos-26
    # Both test steps below append their `.flaky(issue:)` retry records here
    # (docs/specs/2026-07-24-test-hardening-design.md §7), so one run produces
    # one artifact covering the fast and quiet passes together. Unset locally,
    # where the trait writes nothing.
    #
    # A LITERAL path, not `${{ runner.temp }}`: the `runner` context is not
    # available in a job-level `env:` block, and GitHub resolves an unavailable
    # context to the empty string instead of erroring — so that spelling would
    # silently hand the tests `/retry-metrics.jsonl`, fail to open at the
    # filesystem root, and upload an empty artifact forever. The existing test
    # steps already `tee` to /tmp on these runners.
    env:
      TBD_RETRY_METRICS_PATH: /tmp/retry-metrics.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-restore-mtime needs full history

      # Restore source-file mtimes to their last git commit times BEFORE the
      # cache restore. Without this, fresh checkout writes every source mtime
      # to "now", which looks newer than what llbuild recorded in the cached
      # `.build/`, so it rebuilds from scratch. (PR #82 trimmed `.build/` from
      # the cache under the wrong assumption that fresh-VM inodes were the
      # culprit; SPM actually emits `file-system: device-agnostic` so llbuild
      # zeroes device+inode before equality. mtime drift was the real issue.)
      - name: Restore source mtimes from git commit times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2

      - name: Install tmux
        # macos-26 runners don't ship tmux. The whole TBDDaemonLiveTests target
        # (e.g. WorktreeLifecycleLiveTests.testReconcileRebootParksClaudeAndDeletesShell)
        # drives TmuxManager against a real tmux server on a unique socket.
        run: brew install tmux

      # macos-26 arm64 runner defaults to Xcode 26.5 (Swift 6.3.2). Pin 26.6
      # (Swift 6.3.3) so the toolchain is deterministic rather than drifting
      # with the image default, and matches the swift.org 6.3.3 toolchain
      # used for local validation.
      - name: Select Xcode 26.6 (Swift 6.3.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Capture Swift toolchain version
        run: echo "SWIFT_VERSION=$(xcrun swift --version | head -1)" >> $GITHUB_ENV

      - name: Cache SwiftPM build artifacts and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Primary key changes per source revision so we always know what we
          # restored. restore-keys falls back to a cache with the same dep
          # set (same Package.resolved hash) — without this scoping, restore
          # could pull a cache from before a dep was added, leaving stale
          # `.build/checkouts/` that breaks SPM resolution of binary targets.
          key: spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-src-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-

      # Workaround for swiftlang/swift-package-manager#7715: a cache-restored
      # `.build/` can hold a stale object archive for a first-party library
      # target next to a fresh `.swiftmodule`. Downstream files (incl. test
      # targets) compile happily against the new module interface but the
      # linker fails to resolve the new symbol, producing
      # "Undefined symbols ... <Module>.<NewType>" link-time flakes that
      # disappear on retry. The bug fires whenever a PR adds a new symbol to
      # one of these library targets — it has bitten TBDShared, and the
      # required-checks work bit TBDDaemonLib (new PRStatusManager.CheckContext
      # / checkSignals / mapStateAndReason signatures). Wiping just these
      # library build artifacts forces SPM to re-emit them while keeping the
      # rest of `.build/` warm. Costs a couple min per run (library rebuild +
      # downstream cascade relink) in exchange for never seeing the flake.
      - name: Force-rebuild first-party libraries (workaround SPM #7715)
        run: |
          for module in TBDShared TBDDaemonLib; do
            echo "=== $module artifacts before wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
            rm -rf .build/*/debug/"$module".build .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || true
            echo "=== $module artifacts after wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
          done

      # `-j 2` caps parallel swift-frontend processes on the ~7 GB runner.
      # Historically (Swift 6.2, all-per-file builds) default parallelism
      # OOMed late in the build with a bare `error: fatalError`. Under
      # Swift 6.3 the two big modules build WMO in debug (~1.35 GB peak
      # frontend RSS each, measured), so the cap is likely over-conservative
      # now — kept as safety margin; candidate for re-validation.
      #
      # Two sequential steps, one job (docs/specs/2026-07-24-test-hardening-design.md
      # §4): the tier-3 live suites live in their own target so they can run
      # serially on an otherwise idle machine instead of contending with the
      # parallel pass. A second *job* would draw from the 5-concurrent-macOS-job
      # cap and re-pay the build, so both passes share this one.
      #
      # Floors: the fast pass runs ~3859 tests and the quiet pass ~54 today.
      # The floors sit well below those so ordinary test additions/removals never
      # trip them — they only fire when a pass collapses to near-nothing.
      - name: Test (fast parallel pass — tiers 1 and 2)
        # A tier-1 test can still hang indefinitely: an over-long TestClock
        # advance chain wedged for >10 min and `.clockDriven` did NOT bound it
        # (the hung work sits where the time limit cannot cancel it). Without
        # this the job falls back to the 6 h default.
        #
        # 30, not 10: this step runs the FIRST `swift test`, so it pays the
        # whole test-target compile, not just the ~30 s of test runtime. Three
        # consecutive warm-cache runs on main measured 2m22s / 3m33s / 6m02s —
        # a 10-minute budget is under 2x the observed worst case and a cold
        # cache (Package.resolved change, cache eviction) would blow through it
        # and kill a healthy build. This bounds a hang at 1/12 of the default
        # while staying far above any legitimate run.
        timeout-minutes: 30
        run: |
          set -o pipefail
          swift test --parallel -j 2 --skip '^TBDDaemonLiveTests\.' 2>&1 | tee /tmp/fast-pass.log
          count=$(grep -oE 'Test run with [0-9]+ tests?' /tmp/fast-pass.log | grep -oE '[0-9]+' | head -1)
          # `swift test --filter/--skip` exits GREEN on zero matches, so a bad
          # regex or a renamed target would silently run nothing and pass.
          if [ -z "$count" ] || [ "$count" -lt 3000 ]; then
            echo "::error::Fast pass ran ${count:-no} tests (floor 3000) — the --skip regex likely over-matched."
            exit 1
          fi
          echo "Fast pass executed $count tests."

      - name: Test (quiet pass — tier-3 live suites, serial, idle machine)
        # `--no-parallel` is REQUIRED and is not the same as omitting
        # `--parallel`. SwiftPM's `--parallel` governs XCTest's process-level
        # sharding; Swift Testing parallelizes suites in-process on its own and
        # ignores the absence of the flag. Measured on this target: without
        # `--no-parallel` all 17 suites start simultaneously and the pass
        # finishes in 10 s — i.e. the live suites contend with each other and
        # the step is not quiet at all, defeating its entire purpose. With the
        # flag they run strictly one at a time (24 s). Serial execution on an
        # idle machine IS this step; do not "optimize" the flag away.
        # timeout-minutes so a wedged tmux test can't eat the job's 6 h default.
        timeout-minutes: 15
        run: |
          set -o pipefail
          swift test --filter '^TBDDaemonLiveTests\.' --no-parallel 2>&1 | tee /tmp/quiet-pass.log
          count=$(grep -oE 'Test run with [0-9]+ tests?' /tmp/quiet-pass.log | grep -oE '[0-9]+' | head -1)
          if [ -z "$count" ] || [ "$count" -lt 35 ]; then
            echo "::error::Quiet pass ran ${count:-no} tests (floor 35) — the --filter regex matched nothing or the target was renamed."
            exit 1
          fi
          echo "Quiet pass executed $count tests."

      # `warn`, not `ignore`: an absent file means the metrics wiring broke, and
      # that must be visible rather than silently producing an empty dashboard.
      - name: Upload retry metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-metrics
          path: /tmp/retry-metrics.jsonl
          if-no-files-found: warn

      - name: Build (verify TBDCLI and TBDDaemon executable targets compile)
        run: swift build -j 2
