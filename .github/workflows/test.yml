name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # On-demand runs. The remote verification valve
  # (docs/specs/2026-08-16-remote-verification-valve-design.md) asks for a run
  # on a ref that fires nothing else, so a lane that has queued too long for
  # the machine-global build slot can get its verdict from CI instead.
  #
  # `scope` has one option today and is kept anyway: it pins the input's name
  # and type now, so adding a narrower scope later needs no change at the
  # dispatch site.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which suites to run'
        required: false
        default: full
        type: choice
        options: [full]

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Every job below carries a job-level `timeout-minutes`. GitHub's default is 360
# minutes, so an untimed job that wedges holds its runner for six hours. On the
# two `macos-26` jobs that is expensive rather than merely untidy: GitHub allows
# five concurrent macOS jobs account-wide, a normal run of this workflow spends
# two of them, and the remote verification valve
# (docs/specs/2026-08-16-remote-verification-valve-design.md) dispatches THIS
# workflow so a lane that has queued too long for the machine-global build slot
# can borrow one of those five. `remote_verify.py` bounds only the local dispatch
# ticket (45 minutes) and cancels nothing, so releasing that ticket does not stop
# the GitHub-side job — an abandoned run outlives the lane that asked for it.
# Unbounded, it goes on consuming the scarce resource the valve exists to share:
# the starvation the valve was built to fix, inflicted on every other lane.
#
# Each number below is sized to its own job and none of them is a performance
# budget — a job that legitimately grows past its bound wants the bound raised,
# not the work trimmed.
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    # 20: brew, swiftlint, and harnesses that are pure Python/git/bash — no
    # SwiftPM build at all. Recent runs sit near 1.7 min, and the stall-watchdog
    # harness at the end of the job adds about 1.5 min of deliberate waiting on
    # top, so expect roughly 3 min — still an order of magnitude of headroom on
    # a macOS slot.
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is load-bearing for the migration lint below: its
      # history-is-frozen check needs `git merge-base origin/main HEAD`, and
      # the default shallow checkout has neither the remote-tracking ref nor
      # the history to find a merge base with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install swiftlint
        run: brew install swiftlint

      # Two independent halves. The sources hash catches "sources changed, .a
      # not rebuilt"; the archive hash catches stamp/archive desync (stamp
      # staged without the .a, or a binary merge conflict resolved to the wrong
      # side) which the sources hash alone cannot see. The file list must stay
      # in lockstep with scripts/build-rust.sh — see the comment there.
      - name: Verify committed Rust archive is not stale
        run: |
          set -euo pipefail
          STAMP=rust/comrak-ffi/lib/.build-stamp
          EXPECTED_SRC=$(shasum -a 256 rust/comrak-ffi/src/lib.rs rust/comrak-ffi/Cargo.toml rust/comrak-ffi/Cargo.lock \
            | awk '{print $1}' | shasum -a 256 | awk '{print $1}')
          EXPECTED_LIB=$(shasum -a 256 rust/comrak-ffi/lib/libcomrak_ffi.a | awk '{print $1}')
          ACTUAL_SRC=$(sed -n 1p "$STAMP")
          ACTUAL_LIB=$(sed -n 2p "$STAMP")
          if [ -z "$ACTUAL_LIB" ]; then
            echo "::error::$STAMP is missing its archive-hash line (line 2)."
            echo "Regenerate it with scripts/build-rust.sh and commit the result."
            exit 1
          fi
          if [ "$EXPECTED_SRC" != "$ACTUAL_SRC" ]; then
            echo "::error::rust/comrak-ffi/lib/libcomrak_ffi.a is stale."
            echo "Rust sources changed without regenerating the archive."
            echo "Run scripts/build-rust.sh and commit the result."
            echo "expected $EXPECTED_SRC"
            echo "committed $ACTUAL_SRC"
            exit 1
          fi
          if [ "$EXPECTED_LIB" != "$ACTUAL_LIB" ]; then
            echo "::error::rust/comrak-ffi/lib/libcomrak_ffi.a does not match its stamp."
            echo "The archive and .build-stamp are out of sync (partial commit or bad merge resolution)."
            echo "Run scripts/build-rust.sh and commit both files together."
            echo "expected $EXPECTED_LIB"
            echo "committed $ACTUAL_LIB"
            exit 1
          fi
          echo "archive stamp matches sources and archive"

      - name: SwiftLint (strict)
        run: swiftlint --strict

      # The migration lint and its own harness. Both are pure Python/git/sqlite
      # — no SwiftPM, no compiler — which is the whole point: a PR that adds a
      # migration touches no Swift, and its author must not need a build to
      # learn whether the SQL parses. See
      # docs/specs/2026-08-19-migration-identifier-scheme-design.md.
      - name: Lint SQL migrations
        run: python3 scripts/lint-migrations.py

      # `Migrations/` ships empty, so on this tree every guard but
      # history-frozen has nothing real to act on. This harness is the only
      # exercise they get: one fixture per guard that must fail, plus a
      # mutation that disables the guard and proves its fixture then passes.
      - name: Test the migration lint
        run: bash scripts/lint-migrations.test.sh

      # The fence in `scripts/test.sh` is what stands between the suite and the
      # developer's real ~/tbd, ~/.claude and ~/.codex, and its guards were
      # proven once by hand when they landed — which is not a regression test.
      # This harness drives every one of them against fixture directories with
      # a stub `swift`: no build, no real home touched, ~11 s. It runs HERE
      # rather than in the `test` job so a weakened fence fails fast, before a
      # two-minute build; and on macOS because the guards read BSD `stat -f`.
      - name: Test the test fence
        run: bash scripts/test.test.sh

      # The three installer harnesses, which cannot join the Linux collection
      # in `plans-guard`: the plist writer drives `plutil`, and the bundle
      # assembly hard-links into a `.app` and installs it with `cp -cR`. The
      # update harness could run on Linux for its argument, lock, re-exec and
      # wake cases, but then its install-and-handover cases — the ones that
      # prove a failed handover puts the previous app bundle back — would have
      # to be dropped, and those cover the path where a wrong answer costs an
      # operator their installation. Coverage of that beats the runner.
      #
      # All three build fixture repos in temp directories and put stub
      # codesign/security/open/pkill/pgrep first on PATH, with the library's
      # `TBD_LSREGISTER` seam pointed at a stub as well, so nothing here signs,
      # launches, kills, registers, or writes outside its own scratch
      # directory. The WIP guard harness needs only bash and git and stays on
      # Linux with the rest.
      - name: Test the restart, bundle and update helpers
        run: |
          bash scripts/restart-environment-lib.test.sh
          bash scripts/restart-bundle-lib.test.sh
          bash scripts/update.test.sh

      # The stall watchdog's own harness: fixture directories, a stub
      # `scripts/test.sh` and a stub `sample`, no build, no SwiftPM, no real
      # store touched. It cannot join the Linux collection in `plans-guard`
      # because everything it drives is BSD — `script(1)` takes different
      # arguments on Linux, `ps` there is GNU, and `sample` does not exist at
      # all — the same reason the fence and installer harnesses above it sit
      # here.
      #
      # It is the most expensive step in this job at ~90 s, and almost all of
      # that is waiting rather than working: the script polls in 5-second steps,
      # and the escalation case must sit out the whole 30-second grace window
      # because that window is the thing it measures. Ninety seconds of waiting
      # on a job that builds nothing is far cheaper than ninety seconds on the
      # `test` job's critical path, which is why it runs here.
      #
      # It runs LAST so a bug in it costs the least: every cheap guard in this
      # job has already reported by the time it starts. `!cancelled()` rather
      # than the implicit `success()`, so the harness is still exercised on a
      # run where an earlier guard in this job went red — a failing SwiftLint
      # or a failing fence harness must not also cost this one its coverage,
      # and the author fixing that failure wants both verdicts at once.
      - name: Test the stall watchdog
        if: ${{ !cancelled() }}
        run: /bin/bash scripts/ci/watched-test-pass.test.sh

  plans-guard:
    name: No committed implementation plans
    runs-on: ubuntu-latest
    # 10: a shell guard plus harnesses that build fixture repos in temp dirs and
    # touch no network — 0.2 min median, 0.6 min worst. Linux runners are not
    # rationed against the macOS cap, but an unbounded wedge still occupies one
    # for six hours and leaves this check unreported for the whole of it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed implementation plans
        run: scripts/check-no-committed-plans.sh

      # Every script harness that needs nothing but bash, git and python lives
      # here — a test file no workflow runs is worth nothing, and three of
      # these shipped that way before this step collected them. They are on
      # `ubuntu-latest` because none of them reads a BSD-only tool. The
      # exceptions stay in the macOS `lint` job: the fence harness
      # (`scripts/test.test.sh`), whose guards read BSD `stat -f`, the three
      # installer harnesses, and the stall-watchdog harness
      # (`scripts/ci/watched-test-pass.test.sh`), which drives BSD `ps`,
      # `script(1)` and `sample`.
      #
      # Nothing here touches the network, a real remote, `~/tbd`, or a real
      # `gh`: each harness builds a fixture repo in a temp dir and puts a stub
      # `gh` first on PATH. `test-claude-stub.py` does bind a loopback socket,
      # and where a `claude` binary is on PATH it runs the real CLI against
      # that socket — still no egress, and it self-skips on runners, which
      # have no `claude` installed.
      #
      # `cache-save-policy.test.sh` is the odd one out in what it reads: it
      # extracts two pieces of THIS file — the cache-save decision step's shell
      # and the save step's `if:` — and drives the first against fixture repos.
      # It is here rather than in the `test` job because a wrong answer there
      # has no red symptom anywhere else: too few saves leaves every later run
      # paying a cold build, too many churns main's entry out of a 10 GB store,
      # and neither shows up in a suite.
      #
      # `daemon-footprint-watch.py` is a macOS instrument, but its `--self-test`
      # drives the spike detector, the report and the run-directory sweep over
      # synthetic series and temp directories: it touches no kernel counter, no
      # `log stream` and no process. The only macOS-only calls it can reach are
      # the `ctypes.CDLL` loads behind the process-identity seam, which fail
      # closed on Linux and are caught there, and the libproc leg skips itself
      # off macOS. So it runs here rather than costing a rationed macOS runner.
      - name: Test agent guardrails and the script harnesses
        run: |
          python3 .claude/hooks/guardrails/dispatch.py --self-test
          python3 scripts/test-swift-safe.py
          python3 scripts/test-claude-stub.py
          python3 scripts/test-remote-verify.py
          bash scripts/remote-verify.test.sh
          bash scripts/sweep-preflight-refs.test.sh
          bash scripts/cache-save-policy.test.sh
          bash scripts/nightly-flake-stress.test.sh
          bash scripts/restart-guard-lib.test.sh
          bash scripts/restart-build-lib.test.sh
          bash scripts/ci/first-party-wipe-needed.test.sh
          python3 scripts/diag/daemon-footprint-watch.py --self-test

  review-scripts-tests:
    name: Review scripts tests
    runs-on: ubuntu-latest
    # 10: a pip install and a pytest suite that finishes in seconds — 0.4 min
    # median, 0.6 min worst. Nearly all of the bound is there to absorb a slow
    # package index rather than the tests themselves.
    timeout-minutes: 10
    # Unit tests for the claude-review-v2 bookend scripts (prepare.py /
    # validate.py / render_comment.py) plus the workflow's own post/enforce
    # shell, which a test extracts by step name and runs against a stub `gh`
    # (docs/specs/2026-08-03-pr-review-fanout-design.md §4). That harness needs
    # `jq` and `bash`, both preinstalled on ubuntu-latest — it skips without jq
    # rather than testing a stubbed selector.
    # No paths filter: the suite runs in seconds, and an unconditional run can
    # never leave the check unreported on a PR that happens to touch the
    # scripts indirectly.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install pytest jsonschema pyyaml

      - name: Run review-script tests
        run: python3 -m pytest .github/workflows/claude-review-v2/tests/ -q

  test:
    runs-on: macos-26
    # 100, deliberately NOT sized to this job's 15.3-minute observed worst case
    # (10.7 median). The four test steps below carry `timeout-minutes` of 35, 15,
    # 15 and 15 — an 80-minute step budget — and they exist so that a wedged
    # suite dies on a step that names which pass hung, after that step's own
    # watchdog has captured the stacks. A job bound at or below 80 would pre-empt
    # all four and kill the run with the uninformative message those step bounds
    # were written to avoid. 100 clears the step budget with room for checkout,
    # `brew install tmux`, the cache restore and the final build — none of which
    # is individually timed — while cutting worst-case occupancy of one of the
    # five macOS slots from six hours to about an hour and forty minutes.
    timeout-minutes: 100
    # All four test steps below append their `.flaky(issue:)` retry records
    # here (docs/specs/2026-07-24-test-hardening-design.md §7), so one run
    # produces one artifact covering all three fast passes and the quiet pass
    # together. Unset locally, where the trait writes nothing.
    #
    # A LITERAL path, not `${{ runner.temp }}`: the `runner` context is not
    # available in a job-level `env:` block, and GitHub resolves an unavailable
    # context to the empty string instead of erroring — so that spelling would
    # silently hand the tests `/retry-metrics.jsonl`, fail to open at the
    # filesystem root, and upload an empty artifact forever. The existing test
    # steps already `tee` to /tmp on these runners.
    env:
      TBD_RETRY_METRICS_PATH: /tmp/retry-metrics.jsonl
      # The ~7 GB runner's OOM cap, pinned HERE rather than inherited from
      # `scripts/swift-safe`'s default — see the "Three parallel swift-frontend
      # processes" block below. Job-level so every step gets it: the three
      # `scripts/test.sh` steps through the wrapper, and the bare build at the
      # end of the job by spelling `-j "$TBD_SWIFT_JOBS"`. One cap, one place.
      TBD_SWIFT_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-restore-mtime needs full history

      # Which runs may SAVE the SwiftPM cache is a storage-policy question, and
      # the pull_request half of it needs the diff — so it is answered once here,
      # next to the checkout that makes the diff available, and the save step at
      # the end of the job is left as a single `if:`. `fetch-depth: 0` above is
      # what puts `origin/<base>` in the clone; without it there is no ref to
      # diff against.
      #
      # Only `pull_request` runs ask the question. A `push` run (restricted to
      # main by this workflow's triggers) always saves and a `workflow_dispatch`
      # run never does; both of those follow from the event name alone and are
      # decided in the save step's `if:`.
      - name: Decide whether this run may save the SwiftPM cache
        id: cache_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          decide() {
            echo "library_touched=$1" >> "$GITHUB_OUTPUT"
            echo "library_touched=$1 — $2"
          }
          if [ "$EVENT_NAME" != pull_request ]; then
            decide false "not a pull_request run; the save step decides on the event alone"
            exit 0
          fi
          # A base ref that will not resolve cannot be told apart from "this PR
          # changed nothing", so it resolves to the conservative answer and says
          # so loudly. One PR rebuilding more than it had to is cheap; a wrong
          # `true` spends 1.5 GB of a 10 GB store and evicts main's entry for
          # everyone.
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::warning::origin/$BASE_REF is absent, so this run cannot tell whether it touched a first-party library; it will not save a cache."
            decide false "origin/$BASE_REF absent"
            exit 0
          fi
          # The first-party libraries whose interface changes cascade into every
          # downstream module, plus the package manifests. This list is the same
          # set of paths `WIPE_PATHS` in `scripts/ci/first-party-wipe-needed.sh`
          # compares, and the two MUST stay identical — both answer "did a
          # first-party library move?" and a run that answers them differently
          # is answering one of them wrongly. `scripts/cache-save-policy.test.sh`
          # reddens if they drift, and the wipe script carries the matching note.
          #
          # `Sources/TBDDaemon` is where the TBDDaemonLib *library* lives:
          # `Package.swift` declares that target with `path: "Sources/TBDDaemon"`,
          # the `TBDDaemon` executable target beside it being `main.swift` alone.
          # There is no `Sources/TBDDaemonLib` directory, and naming one here
          # would be silent: a pathspec absent from both sides of a `git diff`
          # exits 0, so every PR touching the library would score as not touching
          # it and never save the cache this decision exists to grant it.
          # `Sources/TBDTerminalSerialization` is TBDDaemonLib's one first-party
          # dependency beyond TBDShared, so a change confined to it still
          # recompiles the library and still cascades downstream.
          #
          # Three-dot: what this PR changed since it forked, not everything that
          # has landed on the base since.
          status=0
          git diff --quiet "origin/$BASE_REF...HEAD" -- \
            Sources/TBDShared Sources/TBDDaemon Sources/TBDTerminalSerialization Package.swift Package.resolved || status=$?
          case "$status" in
            0) decide false "no first-party library or package-manifest change" ;;
            1) decide true "touched a first-party library or the package manifest" ;;
            *) echo "::warning::git diff against origin/$BASE_REF failed ($status); this run will not save a cache."
               decide false "git diff failed" ;;
          esac

      # Restore source-file mtimes to their last git commit times BEFORE the
      # cache restore. Without this, fresh checkout writes every source mtime
      # to "now", which looks newer than what llbuild recorded in the cached
      # `.build/`, so it rebuilds from scratch. (PR #82 trimmed `.build/` from
      # the cache under the wrong assumption that fresh-VM inodes were the
      # culprit; SPM actually emits `file-system: device-agnostic` so llbuild
      # zeroes device+inode before equality. mtime drift was the real issue.)
      - name: Restore source mtimes from git commit times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2

      - name: Install tmux
        # macos-26 runners don't ship tmux. The whole TBDDaemonLiveTests target
        # (e.g. WorktreeLifecycleLiveTests.testReconcileRebootParksClaudeAndDeletesShell)
        # drives TmuxManager against a real tmux server on a unique socket.
        run: brew install tmux

      # macos-26 arm64 runner defaults to Xcode 26.5 (Swift 6.3.2). Pin 26.6
      # (Swift 6.3.3) so the toolchain is deterministic rather than drifting
      # with the image default, and matches the swift.org 6.3.3 toolchain
      # used for local validation.
      - name: Select Xcode 26.6 (Swift 6.3.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Capture Swift toolchain version
        run: echo "SWIFT_VERSION=$(xcrun swift --version | head -1)" >> $GITHUB_ENV

      # Swift's cooperative pool is one thread per core, so the runner's width
      # is what decides how many blocked threads it takes to wedge the whole
      # test process. It was inferred, not measured, the one time that mattered.
      - name: Record runner CPU width
        run: 'echo "runner cores: $(sysctl -n hw.ncpu)"'

      # Restore. Whether this run also SAVES is decided by the last step in
      # this job, and the reason the two are separate is GitHub's cache access
      # scope: a run reads caches created on its own branch, on its base branch,
      # or on the default branch, and among prefix matches it takes the most
      # recently created one. The store is capped at 10 GB and an entry for this
      # package is ~1.56 GB, so it holds about six of them and evicts the least
      # recently used.
      #
      # The measurement that shapes the policy, taken over the 30 days to
      # 2026-09-21: this workflow ran 849 times — 516 on `pull_request`, 195 on
      # `workflow_dispatch`, 138 on `push` to main — and 475 of those runs
      # concluded successfully, which is the set that writes an entry, since
      # `actions/cache` saves under `post-if: success()`. The store held six
      # entries at that moment, 9.4 GB in all: two on `refs/heads/main` and four
      # on `refs/pull/<n>/merge`, every one of them created or last read within
      # the previous hour. The whole store turns over in under an hour. Three
      # consequences follow, and together they are the save policy.
      #
      #  - An entry written by a `workflow_dispatch` run is created on the ref
      #    that run was dispatched against. The remote verification valve
      #    (docs/specs/2026-08-16-remote-verification-valve-design.md) dispatches
      #    this workflow against an inert `preflight/` ref, which is nobody's
      #    branch and nobody's base and which the preflight sweep then deletes,
      #    so no later run can ever read what that entry cost 1.5 GB to store.
      #    That was 77 of the 475.
      #  - A `pull_request` entry is created on that PR's merge ref, so only that
      #    same PR can read it. Those were 317 of the 475, and four of the six
      #    entries in the store — which is what pushes main's entry, the one
      #    entry every branch can read, toward the bottom of the LRU. When it
      #    goes, the next push to main and the next PR's first run restore
      #    nothing and rebuild from scratch — the step comment below puts the
      #    first test step at 1250 s on a cold cache (run 34255164378) against
      #    73-996 s warm, where a warm restore itself costs 30-54 s, measured
      #    across the eight most recent green runs.
      #  - Every save costs the run that makes it 26-49 s of upload, measured
      #    across those same eight runs.
      - name: Restore SwiftPM build artifacts and dependencies
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Primary key changes per source revision so we always know what we
          # restored. restore-keys falls back to a cache with the same dep
          # set (same Package.resolved hash) — without this scoping, restore
          # could pull a cache from before a dep was added, leaving stale
          # `.build/checkouts/` that breaks SPM resolution of binary targets.
          key: spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-src-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-

      # A restored `.build/` can come back with a dependency checkout present but
      # its manifest missing, which fails the job at manifest planning before a
      # single test compiles (run 30557645064, PR #554 — a docs-only diff). The
      # stored cache entry was intact; the rerun restored the same key and
      # passed. Probe the workspace here and re-resolve if it is damaged, so that
      # class of red self-heals instead of costing a rerun. Rationale, and why
      # only checkouts/ and repositories/ are discarded, in the script's header.
      - name: Repair the restored SwiftPM workspace if it is damaged
        run: bash scripts/repair-spm-workspace.sh

      # Workaround for swiftlang/swift-package-manager#7715: a cache-restored
      # `.build/` can hold a stale object archive for a first-party library
      # target next to a fresh `.swiftmodule`. Downstream files (incl. test
      # targets) compile happily against the new module interface but the
      # linker fails to resolve the new symbol, producing
      # "Undefined symbols ... <Module>.<NewType>" link-time flakes that
      # disappear on retry. The bug fires whenever a PR adds a new symbol to
      # one of these library targets — it has bitten TBDShared, and the
      # required-checks work bit TBDDaemonLib (new PRStatusManager.CheckContext
      # / checkSignals / mapStateAndReason signatures). Wiping just these
      # library build artifacts forces SPM to re-emit them while keeping the
      # rest of `.build/` warm.
      #
      # The wipe is not free: measured on a run whose commit touched only
      # `Sources/TBDDaemon` and one test file, it cost about three of the 278
      # seconds the first pass spent compiling — 89 TBDShared files and 265
      # TBDDaemonLib files recompiled, TestSupport and TBDDaemonTests re-emitted
      # on top, and a 38-second relink. Over the last 40 commits on `main`, 18
      # touched neither library's sources nor the manifest and paid it for
      # nothing.
      #
      # The bug's precondition is that a library's SOURCES differ from the
      # sources its cached artifacts were built from, so the wipe is conditional
      # on exactly that. A step at the end of this job, after every compile and
      # just before the cache save, records a fingerprint of those sources — one
      # git object id per compared path — in
      # `.build/tbd-first-party-fingerprint`, which rides the same cache entry
      # as the artifacts it describes; `scripts/ci/first-party-wipe-needed.sh`
      # compares it against the tree being built now and answers `wipe` or
      # `skip`. Every uncertainty answers `wipe` — no marker, an unreadable one,
      # a compared path that no longer resolves, or any difference at all —
      # because skipping wrongly costs a link flake nobody will trace back here
      # while wiping wrongly costs three minutes. `|| echo wipe` keeps even a
      # broken decider on the safe side rather than failing the job.
      #
      # The marker is REMOVED the moment it has been read, and a fresh one is
      # recorded only by that later step. That is what keeps the marker and the
      # artifacts from drifting apart no matter how this run ends: a job that
      # dies anywhere after this step leaves no marker at all, so the next run
      # wipes, while a job that dies before this step leaves the restored marker
      # untouched, still describing the restored artifacts.
      - name: Force-rebuild first-party libraries (workaround SPM #7715)
        run: |
          decision="$(bash scripts/ci/first-party-wipe-needed.sh .build/tbd-first-party-fingerprint || echo wipe)"
          rm -f .build/tbd-first-party-fingerprint
          if [ "$decision" = "skip" ]; then
            echo "Keeping the restored first-party artifacts: nothing either library target is built from changed since these artifacts were built (reason above)."
            exit 0
          fi
          # Adding a module here means adding its sources — and the sources of
          # every first-party target it depends on — to `WIPE_PATHS` in the
          # script above, or its wipe becomes conditional on unrelated files.
          for module in TBDShared TBDDaemonLib; do
            echo "=== $module artifacts before wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
            rm -rf .build/*/debug/"$module".build .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || true
            echo "=== $module artifacts after wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
          done

      # Three parallel swift-frontend processes is the cap on the 3-core,
      # ~7 GB `macos-26` runner. Under Swift 6.3 the two big modules build
      # WMO in debug at ~1.35 GB peak frontend RSS each (measured), so three
      # concurrent frontends leave headroom under the memory ceiling, and the
      # runner has only 3 cores — a fourth job would just contend for CPU
      # without shortening the build. The ceiling is real: with Swift 6.2 and
      # all-per-file builds, default parallelism OOMed late in the build with
      # a bare `error: fatalError`, which is why a cap exists at all.
      #
      # The test steps below do NOT pass `-j` themselves: `scripts/swift-safe`,
      # which `scripts/test.sh` runs SwiftPM through, supplies `--jobs` from
      # TBD_SWIFT_JOBS and refuses a command line above it. That variable is
      # pinned in this job's `env:` block, so the cap above is stated
      # explicitly here instead of riding on the wrapper's default — raising
      # that default would otherwise lift CI past the runner's memory ceiling
      # silently. A developer box, which sets its own TBD_SWIFT_JOBS, is no
      # longer failed or throttled by a hardcoded number. The bare build at the
      # end of the job bypasses the wrapper, so it spells the same variable on
      # its own command line rather than repeating the number — one cap, one
      # place to change it.
      #
      # Four sequential steps, one job (docs/specs/2026-07-24-test-hardening-design.md
      # §4): the tier-3 live suites live in their own target so they can run
      # serially on an otherwise idle machine instead of contending with the
      # parallel passes. A second *job* would draw from the 5-concurrent-macOS-job
      # cap and re-pay the build, so all passes share this one.
      #
      # EVERY ONE OF THEM RUNS THROUGH `scripts/ci/watched-test-pass.sh`. That
      # script gives the pass a pty so its log streams line by line instead of in
      # 16 KB blocks, bounds the run with a stall watchdog that captures every
      # thread's stack of the processes executing the tests before the platform
      # timeout can destroy the evidence, and turns the outcome into a verdict —
      # the pass's own exit status first, untouched, and only then the floor. Why
      # a pty, why lineage rather than names, why the argv match, why the cap of
      # four, why five seconds of `sample`, why 30 seconds of grace, why `tee`
      # dies last, why the status file is validated and why status precedes the
      # floor are all in that script's header, with the design in
      # docs/specs/2026-09-04-quiet-pass-stall-watchdog-design.md. Its harness is
      # `scripts/ci/watched-test-pass.test.sh`, run by the `lint` job.
      #
      # ---------------------------------------------------------------------
      # Why the fast pass is THREE steps instead of one
      #
      # Swift Testing parallelizes every non-serialized test in ONE process with
      # no concurrency cap. All targets compile into that process, so per-test
      # scheduling latency scales with the *total* population, not with the
      # suite you are looking at. Evidence from 9 mined CI runs: p50 per-test
      # reported duration is ~1/3 of total wall time in every run, red AND
      # green — a trivial test "takes" 16–29 s because it is mostly suspended
      # waiting for a turn. Population grew 3013 -> 4536 in three weeks. What
      # flips a run red is whether one of the fixed wall-clock scheduling
      # handshakes (ControlModeInputHealth, ControlModeInputRouter, the archived
      # search debounce) loses a coin flip inside a ~2 s band; the failures are
      # all handshake timeouts, never logic assertions.
      #
      # Halving the in-flight population halves the tail those deadlines must
      # absorb. Measured locally under induced load, arms INTERLEAVED (not run
      # in blocks — an earlier attempt at this comparison was invalidated by
      # load drift on a shared box) and population held constant, means over 5
      # iterations: p90 26.4 s -> 14.6 s, p50 8.8 s -> 7.6 s.
      #
      # The cost is +26 s of wall time (56 s -> 82 s mean), because the second
      # invocation re-pays SPM's no-op build check and process startup. That is
      # the honest figure: a single iteration showed +6 s and it did not hold up
      # across the run. Set against a step that already spends 139-404 s on the
      # compile, it is a good trade for halving the tail. Splitting again pays
      # that startup cost a third time for the same reason.
      #
      # This is NOT the "sharding across runners" that §1 considered and
      # rejected and §2 lists as a non-goal. That rejection was about extra
      # *jobs*: the 5-concurrent-macOS-job cap, and each shard re-paying the
      # ~2 min build. These are three sequential `swift test` invocations in ONE
      # job sharing ONE build — the same shape this file already uses for the
      # fast/quiet split. It pays neither the job cap nor a second build.
      #
      # What forced the third step. On 2026-09-08 nearly every run of this
      # workflow reddened at least once on a test unrelated to the change under
      # review, always in the tail of a fast pass — SocketServerSocketOwnership,
      # AttachReplayOrchestrator, AppearanceDebounce, ArchivedWorktreeSearch,
      # TerminalTeardownReap, BoundedGateWait, BoundedProcessRunner,
      # WorktreeArchiveDeletionQueue, HolderLifecycle, TBDHolder — and one PR
      # needed seven reruns to land. Twelve feature-branch reds classified by
      # step: five in pass 1/2 and seven in pass 2/2, two of the latter
      # 30-minute wedges with no stack at all (runs 34174344530 and
      # 34176996067), where the process went silent about 5 s into the test run
      # with ~1,965 tests started, none finishing, zero issues recorded and no
      # time limit firing — the cooperative-pool wedge signature that
      # `Tests/TestSupport/BoundedGateSupport.swift` describes. Zero reds landed
      # in the quiet pass, which was then the only step with a watchdog; and
      # because a red fast pass skipped the steps after it, a single flake hid
      # the live verdict for the whole run.
      #
      # The populations behind that: pass 1 was running ~5,529 tests and pass 2
      # ~5,269, up from 4,988 and 4,645 on the 2026-09-04 green run of `main`,
      # and from the ~4,350 and ~2,800 the deadline triple was originally
      # derived against. Pass-1 test time was 247 s and 231 s on the red runs
      # against 153 s and 195 s on the green ones, and every hang-catcher in the
      # suite is sized per scheduling hop — `TestDeadlines.saturatedPass` 90 s,
      # `TestGate.deadline` 120 s, the clock guards 45 s, the suite limit
      # 240 s — so the red runs are simply the slow-runner tail of the same
      # distribution. Re-splitting is the remedy that follows from "population
      # is the scheduler" (`Tests/CLAUDE.md`); raising the deadlines instead
      # re-derives four coupled constants and wants a spec first.
      #
      # Why step 1b and step 2 are COMPLEMENTS and not enumerations
      #
      # The four passes must partition the package exhaustively, and that has
      # to hold *by construction* rather than by anyone remembering to update a
      # list. The spec makes exactly this point about the target boundary in §3
      # ("Enforcement mechanism = target boundary"): it is "compiler-enforced,
      # cannot silently zero-match like a `--filter` regex". A fast pass
      # expressed as three `--filter` enumerations gives that
      # property up — `swift test --filter` exits GREEN on zero matches, so a
      # newly added `TBDFooTests` would simply appear in no list, run in NO
      # pass, and nothing would go red.
      #
      # The floors cannot cover that hole, and it is worth being precise about
      # why: adding a target does not *reduce* any listed step's count, so every
      # floor still clears and every step stays green while the new target's
      # tests execute nowhere. Expressing step 2 as "everything except
      # TBDDaemonTests and TBDDaemonLiveTests" closes it — a new target lands
      # in step 2 automatically and runs. Step 1a takes the A–O half of
      # TBDDaemonTests, step 1b takes the REST of TBDDaemonTests as a complement
      # of 1a rather than as a `[P-Z]` enumeration (a suite renamed to start
      # with a digit or an underscore would fall out of both halves otherwise),
      # step 2 takes the complement of steps 1+3, the quiet pass takes
      # TBDDaemonLiveTests: no gap, no overlap, nothing to maintain.
      #
      # Floors: `swift test --list-tests` on 2026-08-28 reports TBDDaemonTests
      # 4354, TBDAppTests 2790, TBDSharedTests 858, TBDCLITests 306,
      # TBDDaemonLiveTests 85 (8393 total). Those numbers are worth reading
      # next to the ones this comment carried when the fast/slow split landed —
      # TBDDaemonTests 2194, 4605 total — because the daemon target alone now
      # runs nearly twice what the whole package ran then, and it is where the
      # tail lives: measured on the 2026-08-28 run of `main`, the undivided
      # daemon pass had a median test reporting an 85.8 s span (p90 112.1 s,
      # max 132.8 s) and 47% of its tests spanned longer than the whole 90 s
      # `ciSafeDeadline` that bounds the handshake waits among them. What
      # actually EXECUTES is slightly lower for step 2 — 3876 on the 2026-08-27
      # green run, the most recent one to reach step 2 at all — because a
      # handful of tests are conditionally skipped at runtime. The floors are
      # set against the executed counts (the summary line these steps grep),
      # which is the only number the check can see; don't "correct" them to the
      # listed totals.
      #
      # The two daemon halves are floored at 1200 and 1500. Where the cut goes
      # is measured, not guessed: the split's first CI run (34305400310) cut at
      # `[A-L]` and executed 1918 and 3703 — a third and two thirds, not the
      # halving the split exists for — with 51 s and 114 s of test time. A local
      # count of `@Test` attributed to the top-level suite that declares it
      # predicted 1919 for that same cut, so that heuristic is worth trusting to
      # within a test; it puts M, N and O at 582 between them, which moves the
      # cut to `[A-O]` for an expected split near 2,500 / 3,120. The floors sit
      # deliberately far below either half and will be recalibrated from the
      # counts this cut's first run prints, which is the only source that
      # measures what actually executes.
      #
      # And the executed count is NOT stable run to run: two CI runs on one PR,
      # on commits differing only in doc comments (zero tests added,
      # `--list-tests` unchanged), executed 2194 and 2204 for the daemon pass.
      # The cause is not established — it is not conditional skips (the only
      # `.enabled(if:)` here is gated on an env var CI does not set) and not
      # parameterization (all `arguments:` are static literals). Left unexplained
      # rather than guessed at. The practical consequence is the point: pin a
      # floor near the exact count and it WILL fire spuriously. Keep the margin.
      # The floors sit well below each step's total
      # so ordinary test additions/removals never trip them. Their job is NOT
      # to catch an unlisted new target (the complement shape already does
      # that) — it is to catch a *collapse or rename* of a target that is
      # named in one of these regexes, where `--filter`/`--skip` would
      # otherwise zero-match or over-skip its way to a green run of nothing.
      #
      # ---------------------------------------------------------------------
      # Why every pass goes through `scripts/test.sh` and not bare `swift test`
      #
      # The wrapper points `TBD_HOME`, `TBD_SOCKET_PATH`,
      # `TBD_CLAUDE_HOST_HOME`, `TBD_TEST_CODEX_HOME` and `TMUX_TMPDIR` at a
      # scratch dir for the run, points `HOME` and `CFFIXED_USER_HOME` at a
      # second one whose `tbd`, `.claude` and `.codex` entries are mode 000 (so
      # code that assembles a path out of the home directory rather than asking
      # fails with EACCES at its own call site) and, as a backstop, fingerprints
      # the real `~/tbd`, `~/.claude`, `~/.codex` and tmux socket directory on
      # either side and fails the step if anything appeared or vanished.
      # `CLAUDE.md` has said "Tests must not touch ~/tbd" all along, and the
      # suite quietly violated it anyway: 18k orphan profile dirs, ~2.9k fake
      # worktrees and ~7,100 dead tmux sockets accumulated on a developer box
      # before anyone noticed. No per-test assertion could have caught it —
      # the invariant belongs to the whole run.
      #
      # THIS JOB IS THE ONLY PLACE THE FINGERPRINT RUNS, and every step below
      # asks for it with an explicit `--fingerprint`. The wrapper's default is
      # gated on `$CI`, which a runner sets — the explicit flag says so in the
      # workflow and survives a runner that does not. The pre-push hook
      # passes `--no-fingerprint` and keeps the fence alone, because a developer
      # box writes to `~/tbd` and `~/.claude` for reasons that have nothing to
      # do with the run under way — a live daemon creating worktree/scratch/
      # notes/channel entries, a sibling worktree's `restart.sh` dropping a
      # `state.db.pre-migration.<ts>`, Claude Code writing its own store — and a
      # guard that reddens for reasons the pusher cannot fix gets disabled. A
      # runner has none of that, which is what makes a red here always real.
      #
      # A CI runner has no `~/tbd` to pollute, so the guard reads as a no-op
      # there. It is not: an empty `~/tbd` makes it MORE sensitive, because the
      # fingerprint goes from "absent" to a listing on the first stray write.
      #
      # ---------------------------------------------------------------------
      # Why every pass also writes xUnit XML
      #
      # A remote run has to tell whoever asked for it WHAT failed, and the job
      # log cannot carry that: a single failed run of this workflow produces
      # 5.3 MB across 32,228 lines, in which every line is prefixed with
      # job/step/timestamp and ANSI codes, several parallel passes interleave,
      # and compiler diagnostics print source context that looks exactly like
      # test output. Two extraction passes over a real failed log both produced
      # wrong answers — one surfaced a deliberate known-issue self-test, the
      # other matched 22 `#require is redundant` warnings displaying source
      # context. An extractor that silently reports the wrong failure is worse
      # than no extractor, so the structured file is the interface:
      # `--xunit-output` writes it and `--experimental-xunit-message-failure`
      # puts the failure messages inside it. `scripts/test.sh` forwards
      # unrecognised arguments straight through to `swift test`.
      # ---------------------------------------------------------------------
      - name: Test (fast parallel pass 1a — TBDDaemonTests A–O)
        id: fast_pass_daemon_a
        # 35, against 15 for its neighbours, because this step runs the FIRST
        # `swift test` and so pays the whole test-target compile on top of its
        # own runtime — and because the cost of that compile is dominated by
        # whether the SwiftPM cache hit.
        #
        # Measured over the 45 most recent concluded runs of this workflow
        # (2026-09-05 to 2026-09-09), the first test step took between 73 s and
        # 1250 s. The three slowest — 1010 s (run 34255127220), 1115 s
        # (34267900663) and 1250 s (34255164378) — are exactly the runs whose
        # SwiftPM cache restore finished in 1–4 s, which is what a cache MISS
        # looks like: a hit spends 25–56 s restoring. So 1250 s is the measured
        # cold-cache figure, and it covers a full 5,529-test daemon pass, more
        # than this step now runs. Warm-cache runs still spread
        # 73–996 s, because every run force-rebuilds TBDShared and TBDDaemonLib
        # and a PR's first run restores only the deps-only fallback key.
        #
        # The 1800 s watchdog budget below is what actually bounds a wedge — 45%
        # above that measured worst case — and this step bound is the platform
        # backstop behind it, sized to clear the budget with room for the
        # sampling and the kill sweep.
        timeout-minutes: 35
        run: |
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-daemon-a --budget-seconds 1800 \
            --floor 1200 \
            --floor-message 'the --filter regex matched nothing or the target was renamed.' \
            -- --fingerprint --parallel --filter '^TBDDaemonTests\.[A-O]' \
               --xunit-output /tmp/xunit-daemon-a.xml --experimental-xunit-message-failure

      - name: Test (fast parallel pass 1b — the rest of TBDDaemonTests)
        id: fast_pass_daemon_b
        # Runs even when 1a went red, but not when the job was cancelled and not
        # when the build or setup never reached 1a at all. Until this landed, a
        # red fast pass skipped every step after it, so one flake in the tail of
        # pass 1 hid the live verdict for the whole run and the next push learned
        # nothing new. The job still fails; the cost is the +2–4 min the later
        # passes take on a run that is already red.
        if: ${{ !cancelled() && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # 15: the compile is already paid, so this is test runtime plus SPM's
        # no-op build check — 128 s of step time on the split's first CI run.
        # The 600 s budget bounds a wedge; this clears it.
        timeout-minutes: 15
        run: |
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-daemon-b --budget-seconds 600 \
            --floor 1500 \
            --floor-message 'the --filter/--skip pair over-matched or the target was renamed.' \
            -- --fingerprint --parallel --filter '^TBDDaemonTests\.' --skip '^TBDDaemonTests\.[A-O]' \
               --xunit-output /tmp/xunit-daemon-b.xml --experimental-xunit-message-failure

      - name: Test (fast parallel pass 2 — everything except TBDDaemonTests and the live target)
        id: fast_pass_app
        # Expressed as a COMPLEMENT, not a list of targets — see the "Why step 1b
        # and step 2 are COMPLEMENTS" block above. A new test target lands here
        # on its own.
        if: ${{ !cancelled() && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # 15. A step bound wide enough for the per-test limits to fire first and
        # attribute a hang to a named test would buy nothing now: the watchdog
        # does that job sooner and with a stack. It bounds the pass at 600 s —
        # against 71 s of step time on the split's first CI run — so the
        # platform bound only has to clear the budget plus the sampling and kill
        # sweep.
        timeout-minutes: 15
        run: |
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-app --budget-seconds 600 \
            --floor 1900 \
            --floor-message 'the --skip regex over-matched or a target was renamed.' \
            -- --fingerprint --parallel --skip '^(TBDDaemonTests|TBDDaemonLiveTests)\.' \
               --xunit-output /tmp/xunit-app.xml --experimental-xunit-message-failure

      - name: Test (quiet pass — tier-3 live suites, serial, idle machine)
        id: quiet_pass
        # Runs on a red fast pass for the same reason 1b and 2 do: the live
        # suites are the ones a fast-pass flake most often hides.
        if: ${{ !cancelled() && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # `--no-parallel` is REQUIRED and is not the same as omitting
        # `--parallel`. SwiftPM's `--parallel` governs XCTest's process-level
        # sharding; Swift Testing parallelizes suites in-process on its own and
        # ignores the absence of the flag. Measured on this target: without
        # `--no-parallel` all 17 suites start simultaneously and the pass
        # finishes in 10 s — i.e. the live suites contend with each other and
        # the step is not quiet at all, defeating its entire purpose. With the
        # flag they run strictly one at a time (24 s). Serial execution on an
        # idle machine IS this step; do not "optimize" the flag away.
        #
        # A healthy pass reports `Test run with 179 tests in 37 suites passed
        # after 116.847 seconds`, so the 720 s budget is six times a normal run
        # and still three minutes short of this bound — room for the sampling and
        # the artifact upload. The whole expiry path was measured at 42 s.
        timeout-minutes: 15
        run: |
          scripts/ci/watched-test-pass.sh \
            --name quiet-pass --budget-seconds 720 \
            --floor 35 \
            --floor-message 'the --filter regex matched nothing or the target was renamed.' \
            -- --fingerprint --filter '^TBDDaemonLiveTests\.' --no-parallel \
               --xunit-output /tmp/xunit-quiet.xml --experimental-xunit-message-failure

      # Every watched pass writes its stall files as `<name>-stall-*.txt`, so one
      # glob collects whichever pass wedged.
      #
      # `ignore`, not the `warn` its neighbours use: a green run deliberately
      # produces no stall files, so absence here is the normal case rather than
      # a sign that the wiring broke.
      - name: Upload stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stall-diagnostics
          path: /tmp/*-stall-*.txt
          if-no-files-found: ignore
          retention-days: 14

      # `warn`, not `ignore`: an absent file means the metrics wiring broke, and
      # that must be visible rather than silently producing an empty dashboard.
      - name: Upload retry metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-metrics
          path: /tmp/retry-metrics.jsonl
          if-no-files-found: warn

      # `if: always()` is the whole point, and both outcomes need the XML. A
      # failing run's is the only machine-readable account of what failed. A
      # passing run's carries the test populations the valve sums to print
      # `Test run with N tests`, which six floor checks require before they will
      # believe a run happened at all — without it a green remote verdict reads
      # as a truncated suite. `warn` on absence, matching the metrics upload
      # above: a missing file means the wiring broke and that must be visible.
      #
      # The glob already covers the fourth file the daemon split added:
      # `scripts/remote_verify.py` discovers results with `rglob("*.xml")` over
      # the unpacked artifact (`result_files`) and sums whatever it finds, so
      # splitting or renaming a pass needs no change there — only that each pass
      # keeps writing its XML under `/tmp/xunit-*.xml`.
      - name: Upload xUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-results
          path: /tmp/xunit-*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build (verify TBDCLI and TBDDaemon executable targets compile)
        run: swift build -j "$TBD_SWIFT_JOBS"

      # Record which sources produced the artifacts now sitting in `.build/`, so
      # the next run that restores this cache can tell whether the SPM #7715
      # wipe above is needed at all. It goes after every compile in the job and
      # immediately before the cache-save step below, and writes inside
      # `.build/` so a saved entry carries the marker with the artifacts it
      # describes.
      #
      # A marker beats reading the cache key: the key is built from
      # `hashFiles(...)` digests, which identify a tree but say nothing that can
      # be compared path by path against another one. Object ids can, and unlike
      # a commit they survive the ephemeral merge commit a `pull_request` run is
      # checked out at.
      #
      # It carries NO condition, so it runs only when every step before it
      # succeeded. A fingerprint of the sources says what `.build/` was built
      # FROM, never that the build finished: a run whose compile was OOM-killed
      # or wedged part way through — shapes this job's comments record as real —
      # would otherwise record a marker over half-written artifacts, and a rerun
      # of the same commit restores that cache by an exact key hit and skips the
      # wipe that used to heal it. Reaching this step is the completion signal,
      # and the step's own position, after every compile in the job, is what
      # makes it one.
      #
      # A run that ends before here therefore records nothing, and that is the
      # safe outcome in every case: the wipe step already removed the marker it
      # read, so the next run to restore this cache finds none and wipes. A run
      # that ended before the wipe step leaves the restored marker untouched,
      # still describing the artifacts it was restored with.
      - name: Record the sources these build artifacts came from
        run: bash scripts/ci/first-party-wipe-needed.sh --record .build/tbd-first-party-fingerprint

      # Saved LAST, after the final writer into `.build`, so the stored entry
      # carries the linked executables as well as the test artifacts. `key:` is
      # the restore step's own resolved primary key rather than a second copy of
      # that expression, so the two cannot drift apart.
      #
      # The conditions, in the order they are written:
      #
      #  - `success()`. A red run stores nothing. That is also what
      #    `actions/cache` does unattended — its `action.yml` declares
      #    `post-if: success()`, so its saving post step does not run on a failed
      #    job — and the build step above, the last step that compiles into
      #    `.build`, is itself skipped on a red run, so there would be nothing
      #    freshly linked to store.
      #  - `cache-hit != 'true'`. An exact hit means this key is already in the
      #    store and the save would be a duplicate of what was just restored.
      #  - The event. A `push` (main, per this workflow's triggers) always saves:
      #    main's entry is the one every branch can read, and it is all that
      #    stands between a fresh PR and a cold build. A `workflow_dispatch`
      #    never saves, because nothing can read what it would write — see the
      #    restore step above.
      #  - For a `pull_request`, whether it touched a first-party library or the
      #    package manifest. The primary key hashes every source file, so a PR's
      #    own entry is restorable by that same PR's later pushes and by nothing
      #    else; it earns 1.5 GB of a 10 GB store only when the next push would
      #    otherwise rebuild nearly everything. Touching TBDShared,
      #    TBDDaemonLib or TBDTerminalSerialization is exactly that case — an
      #    interface change cascades into every downstream module, and this job
      #    wipes and re-emits the libraries on such a run regardless. Touching
      #    Package.resolved moves the dependency set the restore-keys prefix is
      #    scoped to, which leaves main's entry no longer a fallback this PR can
      #    use at all; touching Package.swift re-plans the build graph, which
      #    cascades the way a library change does. A PR that touches
      #    neither rebuilds a small delta on top of main's entry for about what
      #    restoring its own would have cost, so it keeps main's entry alive for
      #    everyone instead of evicting it.
      - name: Save SwiftPM build artifacts and dependencies
        if: ${{ success() && steps.spm-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && steps.cache_policy.outputs.library_touched == 'true')) }}
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
