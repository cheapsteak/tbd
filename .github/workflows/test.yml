name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # On-demand runs. The remote verification valve
  # (docs/specs/2026-08-16-remote-verification-valve-design.md) asks for a run
  # on a ref that fires nothing else, so a lane that has queued too long for
  # the machine-global build slot can get its verdict from CI instead.
  #
  # `scope` has one option today and is kept anyway: it pins the input's name
  # and type now, so adding a narrower scope later needs no change at the
  # dispatch site.
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which suites to run'
        required: false
        default: full
        type: choice
        options: [full]

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Every job below carries a job-level `timeout-minutes`. GitHub's default is 360
# minutes, so an untimed job that wedges holds its runner for six hours. On the
# two `macos-26` jobs that is expensive rather than merely untidy: GitHub allows
# five concurrent macOS jobs account-wide, a normal run of this workflow spends
# two of them, and the remote verification valve
# (docs/specs/2026-08-16-remote-verification-valve-design.md) dispatches THIS
# workflow so a lane that has queued too long for the machine-global build slot
# can borrow one of those five. `remote_verify.py` bounds only the local dispatch
# ticket (45 minutes) and cancels nothing, so releasing that ticket does not stop
# the GitHub-side job — an abandoned run outlives the lane that asked for it.
# Unbounded, it goes on consuming the scarce resource the valve exists to share:
# the starvation the valve was built to fix, inflicted on every other lane.
#
# Each number below is sized to its own job and none of them is a performance
# budget — a job that legitimately grows past its bound wants the bound raised,
# not the work trimmed.
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    # 20: brew, swiftlint, and harnesses that are pure Python/git/bash — no
    # SwiftPM build at all. Recent runs sit near 1.7 min, and the stall-watchdog
    # harness at the end of the job adds about 1.5 min of deliberate waiting on
    # top, so expect roughly 3 min — still an order of magnitude of headroom on
    # a macOS slot.
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is load-bearing for the migration lint below: its
      # history-is-frozen check needs `git merge-base origin/main HEAD`, and
      # the default shallow checkout has neither the remote-tracking ref nor
      # the history to find a merge base with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install swiftlint
        run: brew install swiftlint

      # Two independent halves. The sources hash catches "sources changed, .a
      # not rebuilt"; the archive hash catches stamp/archive desync (stamp
      # staged without the .a, or a binary merge conflict resolved to the wrong
      # side) which the sources hash alone cannot see. The file list must stay
      # in lockstep with scripts/build-rust.sh — see the comment there.
      - name: Verify committed Rust archive is not stale
        run: |
          set -euo pipefail
          STAMP=rust/comrak-ffi/lib/.build-stamp
          EXPECTED_SRC=$(shasum -a 256 rust/comrak-ffi/src/lib.rs rust/comrak-ffi/Cargo.toml rust/comrak-ffi/Cargo.lock \
            | awk '{print $1}' | shasum -a 256 | awk '{print $1}')
          EXPECTED_LIB=$(shasum -a 256 rust/comrak-ffi/lib/libcomrak_ffi.a | awk '{print $1}')
          ACTUAL_SRC=$(sed -n 1p "$STAMP")
          ACTUAL_LIB=$(sed -n 2p "$STAMP")
          if [ -z "$ACTUAL_LIB" ]; then
            echo "::error::$STAMP is missing its archive-hash line (line 2)."
            echo "Regenerate it with scripts/build-rust.sh and commit the result."
            exit 1
          fi
          if [ "$EXPECTED_SRC" != "$ACTUAL_SRC" ]; then
            echo "::error::rust/comrak-ffi/lib/libcomrak_ffi.a is stale."
            echo "Rust sources changed without regenerating the archive."
            echo "Run scripts/build-rust.sh and commit the result."
            echo "expected $EXPECTED_SRC"
            echo "committed $ACTUAL_SRC"
            exit 1
          fi
          if [ "$EXPECTED_LIB" != "$ACTUAL_LIB" ]; then
            echo "::error::rust/comrak-ffi/lib/libcomrak_ffi.a does not match its stamp."
            echo "The archive and .build-stamp are out of sync (partial commit or bad merge resolution)."
            echo "Run scripts/build-rust.sh and commit both files together."
            echo "expected $EXPECTED_LIB"
            echo "committed $ACTUAL_LIB"
            exit 1
          fi
          echo "archive stamp matches sources and archive"

      - name: SwiftLint (strict)
        run: swiftlint --strict

      # The migration lint and its own harness. Both are pure Python/git/sqlite
      # — no SwiftPM, no compiler — which is the whole point: a PR that adds a
      # migration touches no Swift, and its author must not need a build to
      # learn whether the SQL parses. See
      # docs/specs/2026-08-19-migration-identifier-scheme-design.md.
      - name: Lint SQL migrations
        run: python3 scripts/lint-migrations.py

      # `Migrations/` ships empty, so on this tree every guard but
      # history-frozen has nothing real to act on. This harness is the only
      # exercise they get: one fixture per guard that must fail, plus a
      # mutation that disables the guard and proves its fixture then passes.
      - name: Test the migration lint
        run: bash scripts/lint-migrations.test.sh

      # The fence in `scripts/test.sh` is what stands between the suite and the
      # developer's real ~/tbd, ~/.claude and ~/.codex, and its guards were
      # proven once by hand when they landed — which is not a regression test.
      # This harness drives every one of them against fixture directories with
      # a stub `swift`: no build, no real home touched, ~11 s. It runs HERE
      # rather than in the `test` job so a weakened fence fails fast, before a
      # two-minute build; and on macOS because the guards read BSD `stat -f`.
      - name: Test the test fence
        run: bash scripts/test.test.sh

      # The two disk-reclaim harnesses. They run nothing destructive: each
      # builds fixture worktrees and scratchpad dirs in temp directories and
      # drives the scripts through their `ps`, `lsof`, worktree-list and clock
      # seams, so no real worktree, scratchpad or `~/tbd` is read or written.
      # They are here because both read BSD `stat -f` and `date -r`, and
      # because neither script is Swift: no suite anywhere else covers them,
      # and the rails they test are what stand between a sweep and a
      # developer's running binaries or a live session's scratch directory.
      # ~15 s together.
      - name: Test the disk-reclaim rails
        run: |
          bash scripts/reclaim-build.test.sh
          bash scripts/sweep-scratchpads.test.sh

      # The three installer harnesses, which cannot join the Linux collection
      # in `script-harnesses`: the plist writer drives `plutil`, and the bundle
      # assembly hard-links into a `.app` and installs it with `cp -cR`. The
      # update harness could run on Linux for its argument, lock, re-exec and
      # wake cases, but then its install-and-handover cases — the ones that
      # prove a failed handover puts the previous app bundle back — would have
      # to be dropped, and those cover the path where a wrong answer costs an
      # operator their installation. Coverage of that beats the runner.
      #
      # All three build fixture repos in temp directories and put stub
      # codesign/security/open/pkill/pgrep first on PATH, with the library's
      # `TBD_LSREGISTER` seam pointed at a stub as well, so nothing here signs,
      # launches, kills, registers, or writes outside its own scratch
      # directory. The WIP guard harness needs only bash and git and stays on
      # Linux with the rest.
      #
      # The update and build-library harnesses run under `/bin/bash`, macOS's
      # bash 3.2, named explicitly: a plain `bash` can resolve to a Homebrew
      # bash 5 on the runner, and `tbd update` has to work on a machine whose
      # only bash is 3.2. Each harness pins every nested `bash` to its own
      # interpreter, so the whole run stays on 3.2. The build-library harness
      # lives here rather than in `script-harnesses` for the same reason — Linux
      # has no bash 3.2 — and because its SDK cases model an Apple toolchain.
      - name: Test the restart, bundle and update helpers
        run: |
          bash scripts/restart-environment-lib.test.sh
          bash scripts/restart-bundle-lib.test.sh
          /bin/bash scripts/update.test.sh
          /bin/bash scripts/restart-build-lib.test.sh

      # The flake fixer's `fix` job runs on macOS, under the runner's bash 3.2,
      # and the other flake harnesses run on Linux under bash 5, which passed a
      # step 3.2 cannot run. This one reads every macOS `run:` script in
      # flake-fixer.yml and the scripts they run, checks them against 3.2's
      # gaps – including a `case` inside `$( … )`, which `bash -n` cannot see
      # because 3.2 parses a substitution only when it runs it – and runs the
      # steps every later one depends on under 3.2. Here because Linux has no
      # bash 3.2; it fails rather than skips under $CI without one. ~2 s.
      - name: Test the flake fixer's macOS steps under bash 3.2
        run: /bin/bash scripts/flake-bash32.test.sh

      # The daemon layer check (docs/specs/2026-10-30-daemon-layer-order-design.md).
      # It fails when a folder under Sources/TBDDaemon uses one in its own
      # layer or a higher one of scripts/daemon-layers.txt, and when a folder
      # has no layer. Like the migration lint it is build-free Python, about
      # 1 s, so a PR learns about a reference against the order without
      # waiting on a build. Its harness needs only bash and Python and runs in
      # `script-harnesses`.
      # `!cancelled()` so that an earlier red guard in this job, such as
      # SwiftLint, does not cost this one its verdict; and here, among the
      # job's other `!cancelled()` steps, so that a red layer check does not
      # cost the `success()` steps above their verdicts either.
      # `/usr/bin/python3` is macOS's 3.9, the `python3` the pre-push hook
      # finds on a Mac without Homebrew, so syntax newer than 3.9 fails here.
      - name: Check the daemon's layer order
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 scripts/lint-daemon-layers.py

      # The harness for the Swift suite gate (the `changes` job below), and the
      # one check that keeps its skip honest: a drift check that gathers every
      # script the `test` job can reach — the two wrappers, what the job names,
      # a `"scripts/…"` literal in a Swift file, and whatever any of those
      # names or loads in turn — and fails if the gate's list of suite scripts
      # is missing one, or if the job uses a local action. A PR that makes the
      # suite depend on a new script edits one of those files, so it runs the
      # suite and this step reddens until the script is listed. It also pins
      # the `needs:`/`if:` wiring below that makes the gate fail closed. It
      # lives in this job because Lint is never skipped, and under `/bin/bash`
      # because the gate has to stay runnable by hand on a Mac, where it is
      # replayed over merged PRs' file lists. Fixture repos in temp dirs, no
      # build, a few seconds.
      # `!cancelled()` for the same reason as the stall watchdog below: an
      # earlier red guard in this job must not cost this one its verdict.
      # docs/specs/2026-10-25-skip-swift-suite-for-non-code-prs-design.md
      - name: Test the Swift suite gate
        if: ${{ !cancelled() }}
        run: /bin/bash scripts/ci/swift-suite-needed.test.sh

      # The stall watchdog's own harness: fixture directories, a stub
      # `scripts/test.sh` and a stub `sample`, no build, no SwiftPM, no real
      # store touched. It cannot join the Linux collection in `script-harnesses`
      # because everything it drives is BSD — `script(1)` takes different
      # arguments on Linux, `ps` there is GNU, and `sample` does not exist at
      # all — the same reason the fence and installer harnesses above it sit
      # here.
      #
      # It is the most expensive step in this job at ~90 s, and almost all of
      # that is waiting rather than working: the script polls in 5-second steps,
      # and the escalation case must sit out the whole 30-second grace window
      # because that window is the thing it measures. Ninety seconds of waiting
      # on a job that builds nothing is far cheaper than ninety seconds on the
      # `test` job's critical path, which is why it runs here.
      #
      # It runs LAST so a bug in it costs the least: every cheap guard in this
      # job has already reported by the time it starts. `!cancelled()` rather
      # than the implicit `success()`, so the harness is still exercised on a
      # run where an earlier guard in this job went red — a failing SwiftLint
      # or a failing fence harness must not also cost this one its coverage,
      # and the author fixing that failure wants both verdicts at once.
      - name: Test the stall watchdog
        if: ${{ !cancelled() }}
        run: /bin/bash scripts/ci/watched-test-pass.test.sh

  plans-guard:
    name: No committed implementation plans
    runs-on: ubuntu-latest
    # 5: a shallow checkout and one scan of the tracked tree. The scan takes
    # well under a second and the checkout about 3 s, so this is the `changes`
    # job's bound for the same shape of work. Linux runners are not rationed
    # against the macOS cap, but an unbounded wedge still occupies one for six
    # hours and leaves this check unreported for the whole of it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed implementation plans
        run: scripts/check-no-committed-plans.sh

  # Every script harness that needs nothing but bash, git and python runs
  # here or in `flake-harnesses` below — a test file no workflow runs is worth
  # nothing, and three of these have shipped that way. They are on
  # `ubuntu-latest` because none of them reads a BSD-only tool. The exceptions
  # stay in the macOS `lint` job: the fence harness (`scripts/test.test.sh`),
  # whose guards read BSD `stat -f`, the three installer harnesses, the
  # build-library harness (`scripts/restart-build-lib.test.sh`), which must run
  # under bash 3.2, the flake fixer's bash 3.2 harness
  # (`scripts/flake-bash32.test.sh`), the Swift suite gate's harness
  # (`scripts/ci/swift-suite-needed.test.sh`), which runs under bash 3.2, and
  # the stall-watchdog harness (`scripts/ci/watched-test-pass.test.sh`), which
  # drives BSD `ps`, `script(1)` and `sample`.
  #
  # Nothing here touches the network, a real remote, `~/tbd`, or a real `gh`:
  # each harness builds a fixture repo in a temp dir and puts a stub `gh` first
  # on PATH.
  #
  # One step per harness, so a red check names the harness that failed. Every
  # harness step carries `!cancelled()` rather than the implicit `success()`,
  # for the reason the `lint` job's last two steps do: one harness going red
  # must not cost the others their verdicts, and the author fixing it wants
  # every verdict at once.
  script-harnesses:
    name: Script harnesses
    runs-on: ubuntu-latest
    # 10: the harness steps below took about 73 s in all on a green `main` run
    # (job 123819217683, timed from its log timestamps). That run is a slow
    # one: its harnesses, these and the flake bot's together, took about
    # 360 s, the top of the 220 to 364 s range they have taken on `main`. The
    # slowest are `nightly-flake-stress.test.sh` at about 26 s,
    # `test-claude-stub.py` at 14 s and `test-swift-safe.py` at 12 s;
    # `remote-verify.test.sh` and the two sweep harnesses take 5 to 6 s each,
    # `lint-daemon-layers.test.sh` about 15 s on a heavily loaded Mac, and every other
    # step under 2 s. The bound leaves room for a runner
    # several times slower than that one; an unbounded wedge would occupy a
    # Linux runner for six hours and leave this check unreported for the
    # whole of it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test the agent guardrails
        if: ${{ !cancelled() }}
        run: python3 .claude/hooks/guardrails/dispatch.py --self-test

      # The `pr-user-story` check script is stdlib-only and shared with the
      # `pr-user-story` guardrail, whose own tests the self-test above runs
      # against the same file.
      - name: Test the pr-user-story check script
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .github/workflows/pr-user-story/tests

      - name: Test scripts/swift-safe
        if: ${{ !cancelled() }}
        run: python3 scripts/test-swift-safe.py

      # It binds a loopback socket, and where a `claude` binary is on PATH it
      # runs the real CLI against that socket — still no egress, and it
      # self-skips on runners, which have no `claude` installed.
      - name: Test scripts/claude-stub.py
        if: ${{ !cancelled() }}
        run: python3 scripts/test-claude-stub.py

      - name: Test scripts/remote_verify.py
        if: ${{ !cancelled() }}
        run: python3 scripts/test-remote-verify.py

      - name: Test scripts/remote-verify.sh
        if: ${{ !cancelled() }}
        run: bash scripts/remote-verify.test.sh

      - name: Test scripts/sweep-preflight-refs.sh
        if: ${{ !cancelled() }}
        run: bash scripts/sweep-preflight-refs.test.sh

      # This one also needs `jq` (preinstalled on the runner). Its fixtures are
      # real repos with real linked worktrees in a temp dir, and every tool it
      # would otherwise reach — `tbd`, `gh`, `lsof` — is a fake behind a seam,
      # with failing shims first on PATH.
      - name: Test scripts/sweep-foreign-worktrees.sh
        if: ${{ !cancelled() }}
        run: bash scripts/sweep-foreign-worktrees.test.sh

      # It extracts two pieces of THIS file — the cache-save decision step's
      # shell and the save step's `if:` — and drives the first against fixture
      # repos. It is here rather than in the `test` job because a wrong answer
      # there has no red symptom anywhere else: too few saves leaves every later
      # run paying a cold build, too many churns main's entry out of a 10 GB
      # store, and neither shows up in a suite.
      - name: Test the SwiftPM cache-save policy
        if: ${{ !cancelled() }}
        run: bash scripts/cache-save-policy.test.sh

      # It reads THIS file too: it checks its own table of CI passes against
      # the `test` job's four pass invocations, that every step forwarding
      # `--skip-build` is gated on the build step's success, and that every
      # command in the `test` job that reaches SwiftPM carries the CI build
      # flags.
      - name: Test scripts/nightly-flake-stress.sh
        if: ${{ !cancelled() }}
        run: bash scripts/nightly-flake-stress.test.sh

      - name: Test scripts/restart-guard-lib.sh
        if: ${{ !cancelled() }}
        run: bash scripts/restart-guard-lib.test.sh

      - name: Test scripts/dsym-prune-lib.sh
        if: ${{ !cancelled() }}
        run: bash scripts/dsym-prune-lib.test.sh

      - name: Test scripts/ci/first-party-wipe-needed.sh
        if: ${{ !cancelled() }}
        run: bash scripts/ci/first-party-wipe-needed.test.sh

      # `daemon-footprint-watch.py` is a macOS instrument, but its `--self-test`
      # drives the spike detector, the report and the run-directory sweep over
      # synthetic series and temp directories: it touches no kernel counter, no
      # `log stream` and no process. The only macOS-only calls it can reach are
      # the `ctypes.CDLL` loads behind the process-identity seam, which fail
      # closed on Linux and are caught there, and the libproc leg skips itself
      # off macOS. So it runs here rather than costing a rationed macOS runner.
      - name: Self-test scripts/diag/daemon-footprint-watch.py
        if: ${{ !cancelled() }}
        run: python3 scripts/diag/daemon-footprint-watch.py --self-test

      - name: Self-test scripts/diag/terminal-latency-report.py
        if: ${{ !cancelled() }}
        run: python3 scripts/diag/terminal-latency-report.py --self-test

      # The harness for the daemon layer check that the `lint` job runs. Its
      # fixtures are small sample trees of Swift that is scanned, never
      # compiled. It runs here under bash 5 and this runner's python3; the
      # `lint` job holds the check itself to macOS's Python 3.9.
      - name: Test the daemon layer check
        if: ${{ !cancelled() }}
        run: bash scripts/lint-daemon-layers.test.sh

  # The flake bot's four Linux harnesses, one matrix leg each. They are the
  # same shape as the harnesses in `script-harnesses`: pure Python and bash
  # over fixtures cut from real CI artifacts, with a stub `gh` supplied through
  # `FLAKE_GH_CMD`, and nothing reaching the network, a real remote or `~/tbd`.
  # The fifth, `scripts/flake-bash32.test.sh`, is in the macOS `lint` job
  # because Linux has no bash 3.2.
  #
  # They are the slow ones. On the same green `main` run (job 123819217683)
  # `flake-ledger.test.sh` took about 111 s for its 123 cases — 29 s of it in
  # one case, the big watchlist split across comments — `flake-pr.test.sh`
  # about 103 s, `flake-verify.test.sh` about 62 s and `flake-pick.test.sh`
  # about 9 s: 4.7 minutes in sequence. As parallel legs the slowest check is
  # `flake-ledger`'s at about 2 minutes. Linux runners are not rationed
  # against the macOS cap, so the three extra runners cost nothing scarce.
  # `fail-fast: false` keeps one red leg from cancelling the other three, and
  # each leg's check name says which harness it ran.
  flake-harnesses:
    name: Flake bot harness (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # 10: the slowest leg, `flake-ledger`, took about 111 s on that slow run,
    # so the bound is about five times the slowest measured leg. An unbounded
    # wedge would occupy a Linux runner for six hours and leave its check
    # unreported for the whole of it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: flake-ledger
            command: bash scripts/flake-ledger.test.sh
          - harness: flake-pick
            command: bash scripts/flake-pick.test.sh
          - harness: flake-verify
            command: bash scripts/flake-verify.test.sh
          - harness: flake-pr
            command: bash scripts/flake-pr.test.sh
    steps:
      - uses: actions/checkout@v4

      - name: Test ${{ matrix.harness }}
        run: ${{ matrix.command }}

  review-scripts-tests:
    name: Review scripts tests
    runs-on: ubuntu-latest
    # 10: a pip install and a pytest suite that finishes in seconds — 0.4 min
    # median, 0.6 min worst. Nearly all of the bound is there to absorb a slow
    # package index rather than the tests themselves.
    timeout-minutes: 10
    # Unit tests for the claude-review-v2 bookend scripts (prepare.py /
    # validate.py / render_comment.py) plus the workflow's own post/enforce
    # shell, which a test extracts by step name and runs against a stub `gh`
    # (docs/specs/2026-08-03-pr-review-fanout-design.md §4). That harness needs
    # `jq` and `bash`, both preinstalled on ubuntu-latest — it skips without jq
    # rather than testing a stubbed selector.
    # No paths filter: the suite runs in seconds, and an unconditional run can
    # never leave the check unreported on a PR that happens to touch the
    # scripts indirectly.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install pytest jsonschema pyyaml

      - name: Run review-script tests
        run: python3 -m pytest .github/workflows/claude-review-v2/tests/ -q

  session-mod:
    name: Session mod
    runs-on: ubuntu-latest
    # 10: one npm install of the pinned Claude Code, then a validate and a test
    # run over a handful of TypeScript files. Nearly all of the bound is there
    # to absorb a slow package registry rather than the checks themselves.
    timeout-minutes: 10
    # The session mod's TypeScript under SessionMod/ is the source; the daemon
    # ships the copy embedded in Sources/TBDShared/SessionModContent.swift, so
    # the first step fails when that copy is stale. Claude Code is pinned to the
    # release whose plugin API the mod is written against
    # (docs/specs/2026-10-19-tbd-session-mod-design.md).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the embedded copy is current
        run: python3 scripts/gen-session-mod-content.py --check

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.303

      - name: Validate the session mod
        run: claude plugin validate --strict SessionMod

      - name: Test the session mod
        run: claude plugin test SessionMod

  # Whether the `test` job can say anything about this run's changes
  # (docs/specs/2026-10-25-skip-swift-suite-for-non-code-prs-design.md). A PR
  # that changes only specs, skills, review-gate workflows or scripts the suite
  # never reaches would otherwise hold one of the five macOS slots for 10 to 13
  # minutes and learn nothing. `scripts/ci/swift-suite-needed.sh` answers
  # `run=false` only when every file the PR changed matches a skip rule, and
  # `run=true` for every other event and for anything it cannot answer
  # honestly. Its step summary lists each changed file and the rule that
  # decided it. The rule, its list of the suite's own scripts, and the drift
  # check that keeps that list true are in the script and its harness, which
  # the `lint` job runs.
  #
  # On Linux, so deciding never occupies a macOS slot. `fetch-depth: 0` puts
  # `origin/<base>` and the history to find a merge base with in the clone,
  # for the same three-dot diff the cache-policy step in `test` takes.
  changes:
    name: Swift suite gate
    runs-on: ubuntu-latest
    # 5: a full-history checkout and one `git diff`, well under a minute. Kept
    # short because `test` waits for this job, so a wedge here delays the
    # suite by up to this bound.
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run needs the Swift suite
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/swift-suite-needed.sh

  test:
    # Skipped only when the gate above answered an explicit `false`. A job
    # skipped by its own `if:` reports success to branch protection, so the
    # required `test` check passes and a docs-only PR can merge. When the gate
    # fails, is skipped, or ends without writing an answer, its output is
    # empty, `!= 'false'` holds, and the suite runs: a broken gate costs a full
    # run, never a missed one.
    #
    # `!cancelled()` is what lets this job run after a FAILED gate. With no
    # status function in a job's `if:`, GitHub adds an implicit `success()`, so
    # a failed dependency would skip this job — and a skipped `test` passes the
    # required check. `!cancelled()` still skips it when the run itself is
    # cancelled, as a newer push to the branch does through `concurrency`.
    #
    # Do not give this job a `name:`: branch protection matches the required
    # check by the job's name, which is `test`.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-26
    # 135, deliberately NOT sized to this job's 15.3-minute observed worst case
    # (10.7 median). The build step, the cache save and the five test steps
    # below carry `timeout-minutes` of 30, 10, 15, 15, 15, 15 and 15 — a
    # 115-minute step budget — and they exist so that a wedged run dies on a
    # step that names what hung: the compile, the save, or which pass, after
    # that pass's own watchdog has captured the stacks. A job bound at or below
    # 115 would pre-empt them and kill the run with the uninformative message
    # those step bounds were written to avoid. 135 clears the step budget with
    # 20 minutes for checkout, `brew install tmux`, the cache restore and the
    # result uploads — none of which is individually timed — while cutting
    # worst-case occupancy of one of the five macOS slots from six hours to
    # two and a quarter.
    timeout-minutes: 135
    # All five test steps below append their `.flaky(issue:)` retry records
    # here (docs/specs/2026-07-24-test-hardening-design.md §7), so one run
    # produces one artifact covering all four fast passes and the quiet pass
    # together. Unset locally, where the trait writes nothing.
    #
    # A LITERAL path, not `${{ runner.temp }}`: the `runner` context is not
    # available in a job-level `env:` block, and GitHub resolves an unavailable
    # context to the empty string instead of erroring — so that spelling would
    # silently hand the tests `/retry-metrics.jsonl`, fail to open at the
    # filesystem root, and upload an empty artifact forever. The existing test
    # steps already `tee` to /tmp on these runners.
    env:
      TBD_RETRY_METRICS_PATH: /tmp/retry-metrics.jsonl
      # The ~7 GB runner's OOM cap, pinned HERE rather than inherited from
      # `scripts/swift-safe`'s default — see the "Three parallel swift-frontend
      # processes" block below. Job-level so every step gets it: the build step
      # by spelling `-j "$TBD_SWIFT_JOBS"`, and the five `scripts/test.sh` steps
      # through the wrapper. One cap, one place.
      TBD_SWIFT_JOBS: "3"
      # The debug information this job compiles with, lighter than SwiftPM's
      # debug default. `--disable-index-store` stops every compile writing an
      # index store, which nothing on a runner reads. `-Xswiftc
      # -gline-tables-only` keeps function names and line tables and drops
      # type and variable information.
      #
      # What that keeps: crash reports and `sample` stacks still name each
      # frame's function and file:line, and lldb breakpoints and backtraces
      # keep file:line. What it loses: lldb shows shorter function names and
      # no local variables. Nothing in this job needs either loss back. The
      # stall watchdog's `sample` files are read for the function and line a
      # thread is parked in (docs/specs/2026-09-04-quiet-pass-stall-watchdog-design.md),
      # no step runs `atos`, lldb or any other symbolicator, and macOS finds
      # the tests by loading the bundle, not by reading an index.
      #
      # Measured as paired cold builds, both arms on one `macos-26` runner
      # (3 cores, Swift 6.3.3), in both orders: SwiftPM's defaults 795.1 s then
      # these flags 656.1 s (run 40222086540), and these flags 927.5 s then the
      # defaults 1124.8 s (run 40232573803). The ratio is 0.825 in both orders,
      # so building second buys nothing, and only same-runner pairs count: the
      # same build took about 41% longer on the slower of the two runners
      # (795.1 s against 1124.8 s with the defaults, 656.1 s against 927.5 s
      # with these flags). `.build` shrinks from
      # about 4.9 GB to 4.4 GB — the 174 MB index store goes, and the test
      # bundle's dSYM drops from 655 MB to 443 MB. On a typical incremental
      # build (513 s median) the same ratio predicts 85-95 s saved; that figure
      # is inferred, not measured.
      #
      # ONE DEFINITION, SPELLED BY EVERY STEP THAT REACHES SWIFTPM: the build
      # and all five passes. Each reads it with `${CI_SWIFTPM_FLAGS:?…}`, so a
      # step that runs without it fails on its first line instead of building
      # with the defaults, and expands it on its own command line rather than
      # leaving a wrapper to supply it. The passes carry the flags although
      # they compile nothing; see "THE PASSES CARRY THE BUILD'S FLAGS" at the
      # build step.
      # `scripts/nightly-flake-stress.test.sh`, which `script-harnesses` runs, fails
      # when a command in this job runs `scripts/swift-safe`, `scripts/test.sh`
      # or `scripts/ci/watched-test-pass.sh` without them, so a new pass or a
      # retry cannot drop them silently.
      #
      # CI ONLY. `scripts/swift-safe` and `scripts/test.sh` forward the flags
      # untouched and their defaults are unchanged, so a developer's build
      # keeps full debug information for lldb. The cache key carries this
      # value; see the restore step.
      CI_SWIFTPM_FLAGS: "--disable-index-store -Xswiftc -gline-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-restore-mtime needs full history

      # Which runs may SAVE the SwiftPM cache is a storage-policy question, and
      # the pull_request half of it needs the diff — so it is answered once here,
      # next to the checkout that makes the diff available, and the save step
      # after the build is left as a single `if:`. `fetch-depth: 0` above is
      # what puts `origin/<base>` in the clone; without it there is no ref to
      # diff against.
      #
      # Only `pull_request` runs ask the question. A `push` run (restricted to
      # main by this workflow's triggers) always saves and a `workflow_dispatch`
      # run never does; both of those follow from the event name alone and are
      # decided in the save step's `if:`.
      - name: Decide whether this run may save the SwiftPM cache
        id: cache_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          decide() {
            echo "library_touched=$1" >> "$GITHUB_OUTPUT"
            echo "library_touched=$1 — $2"
          }
          if [ "$EVENT_NAME" != pull_request ]; then
            decide false "not a pull_request run; the save step decides on the event alone"
            exit 0
          fi
          # A base ref that will not resolve cannot be told apart from "this PR
          # changed nothing", so it resolves to the conservative answer and says
          # so loudly. One PR rebuilding more than it had to is cheap; a wrong
          # `true` spends 1.5 GB of a 10 GB store and evicts main's entry for
          # everyone.
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::warning::origin/$BASE_REF is absent, so this run cannot tell whether it touched a first-party library; it will not save a cache."
            decide false "origin/$BASE_REF absent"
            exit 0
          fi
          # The first-party libraries whose interface changes cascade into every
          # downstream module, plus the package manifests. This list is the same
          # set of paths `WIPE_PATHS` in `scripts/ci/first-party-wipe-needed.sh`
          # compares, and the two MUST stay identical — both answer "did a
          # first-party library move?" and a run that answers them differently
          # is answering one of them wrongly. `scripts/cache-save-policy.test.sh`
          # reddens if they drift, and the wipe script carries the matching note.
          #
          # `Sources/TBDDaemon` is where the TBDDaemonLib *library* lives:
          # `Package.swift` declares that target with `path: "Sources/TBDDaemon"`,
          # the `TBDDaemon` executable target beside it being `main.swift` alone.
          # There is no `Sources/TBDDaemonLib` directory, and naming one here
          # would be silent: a pathspec absent from both sides of a `git diff`
          # exits 0, so every PR touching the library would score as not touching
          # it and never save the cache this decision exists to grant it.
          # `Sources/TBDKernel` is the library TBDShared depends on, so a symbol
          # added to it is the change #7715 breaks on, and a change confined to
          # it re-emits its own module and recompiles TBDShared and everything
          # above it.
          # `Sources/TBDTerminalSerialization` is a first-party library the #7715
          # wipe removes in its own right, and TBDDaemonLib's one first-party
          # dependency beyond TBDShared and TBDKernel, so a change confined to it
          # re-emits its own module, recompiles TBDDaemonLib and cascades
          # downstream.
          #
          # Three-dot: what this PR changed since it forked, not everything that
          # has landed on the base since.
          status=0
          git diff --quiet "origin/$BASE_REF...HEAD" -- \
            Sources/TBDKernel Sources/TBDShared Sources/TBDDaemon Sources/TBDTerminalSerialization Package.swift Package.resolved || status=$?
          case "$status" in
            0) decide false "no first-party library or package-manifest change" ;;
            1) decide true "touched a first-party library or the package manifest" ;;
            *) echo "::warning::git diff against origin/$BASE_REF failed ($status); this run will not save a cache."
               decide false "git diff failed" ;;
          esac

      # Restore source-file mtimes to their last git commit times BEFORE the
      # cache restore. Without this, fresh checkout writes every source mtime
      # to "now", which looks newer than what llbuild recorded in the cached
      # `.build/`, so it rebuilds from scratch. (PR #82 trimmed `.build/` from
      # the cache under the wrong assumption that fresh-VM inodes were the
      # culprit; SPM actually emits `file-system: device-agnostic` so llbuild
      # zeroes device+inode before equality. mtime drift was the real issue.)
      - name: Restore source mtimes from git commit times
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2

      - name: Install tmux
        # macos-26 runners don't ship tmux. The whole TBDDaemonLiveTests target
        # (e.g. WorktreeLifecycleLiveTests.testReconcileRebootParksClaudeAndDeletesShell)
        # drives TmuxManager against a real tmux server on a unique socket.
        run: brew install tmux

      # macos-26 arm64 runner defaults to Xcode 26.5 (Swift 6.3.2). Pin 26.6
      # (Swift 6.3.3) so the toolchain is deterministic rather than drifting
      # with the image default, and matches the swift.org 6.3.3 toolchain
      # used for local validation.
      - name: Select Xcode 26.6 (Swift 6.3.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Capture Swift toolchain version
        run: echo "SWIFT_VERSION=$(xcrun swift --version | head -1)" >> $GITHUB_ENV

      # Swift's cooperative pool is one thread per core, so the runner's width
      # is what decides how many blocked threads it takes to wedge the whole
      # test process. It was inferred, not measured, the one time that mattered.
      - name: Record runner CPU width
        run: 'echo "runner cores: $(sysctl -n hw.ncpu)"'

      # Restore. Whether this run also SAVES is decided by the save step right
      # after the build, and the reason the two are separate is GitHub's cache
      # access scope: a run reads caches created on its own branch, on its base
      # branch, or on the default branch, and among prefix matches it takes the
      # most recently created one. The store is capped at 10 GB and an entry for
      # this package is ~1.56 GB, so it holds about six of them and evicts the
      # least recently used.
      #
      # The measurement that shapes the policy, taken over the 30 days to
      # 2026-09-21: this workflow ran 849 times — 516 on `pull_request`, 195 on
      # `workflow_dispatch`, 138 on `push` to main — and 475 of those runs
      # concluded successfully. Every one of those built successfully, and a
      # run whose build succeeds may write an entry whether or not its tests
      # then pass or the run is cancelled, so the 475 are a lower bound on the
      # runs the event policy below has to sort. The store held six entries at
      # that moment, 9.4 GB in all: two on `refs/heads/main` and four on
      # `refs/pull/<n>/merge`, every one of them created or last read within
      # the previous hour. The whole store turns over in under an hour. Three
      # consequences follow, and together they are the save policy.
      #
      #  - An entry written by a `workflow_dispatch` run is created on the ref
      #    that run was dispatched against. The remote verification valve
      #    (docs/specs/2026-08-16-remote-verification-valve-design.md) dispatches
      #    this workflow against an inert `preflight/` ref, which is nobody's
      #    branch and nobody's base and which the preflight sweep then deletes,
      #    so no later run can ever read what that entry cost 1.5 GB to store.
      #    That was 77 of the 475.
      #  - A `pull_request` entry is created on that PR's merge ref, so only that
      #    same PR can read it. Those were 317 of the 475, and four of the six
      #    entries in the store — which is what pushes main's entry, the one
      #    entry every branch can read, toward the bottom of the LRU. When it
      #    goes, the next push to main and the next PR's first run restore
      #    nothing and rebuild from scratch — the build step's comment below
      #    records 1250 s for the compile plus the first test pass on a cold
      #    cache (run 34255164378) against 73-996 s warm, where a warm restore
      #    itself costs 30-54 s, measured across the eight most recent green
      #    runs.
      #  - Every save costs the run that makes it 26-49 s of upload, measured
      #    across those same eight runs.
      - name: Restore SwiftPM build artifacts and dependencies
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Primary key changes per source revision so we always know what we
          # restored. restore-keys falls back to a cache with the same dep
          # set (same Package.resolved hash) — without this scoping, restore
          # could pull a cache from before a dep was added, leaving stale
          # `.build/checkouts/` that breaks SPM resolution of binary targets.
          #
          # Both also carry the job's CI_SWIFTPM_FLAGS, so this job restores
          # only artifacts compiled with the flags it compiles with. Every
          # compile command names those flags, so an entry built with others
          # gives back its dependency checkouts and nothing else: the whole
          # package compiles again. An exact-key hit on such an entry would
          # also skip the save below (`cache-hit`), so every later run with the
          # same sources would restore it and pay that compile again. And an
          # index store restored into `.build` would ride along, unread, in
          # every entry built on top of it.
          #
          # The flags sit after the dependency hash, not before it, because the
          # nightly and the flake fixer restore this job's entries through the
          # `…-deps-<hash>-` prefix. They build with SwiftPM's defaults, so what
          # they take from an entry is its dependency checkouts, and those do
          # not depend on the flags.
          key: spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-flags-${{ env.CI_SWIFTPM_FLAGS }}-src-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-flags-${{ env.CI_SWIFTPM_FLAGS }}-

      # A restored `.build/` can come back with a dependency checkout present but
      # its manifest missing, which fails the job at manifest planning before a
      # single test compiles (run 30557645064, PR #554 — a docs-only diff). The
      # stored cache entry was intact; the rerun restored the same key and
      # passed. Probe the workspace here and re-resolve if it is damaged, so that
      # class of red self-heals instead of costing a rerun. Rationale, and why
      # only checkouts/ and repositories/ are discarded, in the script's header.
      - name: Repair the restored SwiftPM workspace if it is damaged
        run: bash scripts/repair-spm-workspace.sh

      # Workaround for swiftlang/swift-package-manager#7715: a cache-restored
      # `.build/` can hold a stale object archive for a first-party library
      # target next to a fresh `.swiftmodule`. Downstream files (incl. test
      # targets) compile happily against the new module interface but the
      # linker fails to resolve the new symbol, producing
      # "Undefined symbols ... <Module>.<NewType>" link-time flakes that
      # disappear on retry. The bug fires whenever a PR adds a new symbol to
      # one of these library targets — it has bitten TBDShared, and the
      # required-checks work bit TBDDaemonLib (new PRStatusManager.CheckContext
      # / checkSignals / mapStateAndReason signatures). Wiping just these
      # library build artifacts forces SPM to re-emit them while keeping the
      # rest of `.build/` warm.
      #
      # The libraries wiped are TBDKernel, TBDShared, TBDDaemonLib and
      # TBDTerminalSerialization: every first-party library target whose
      # sources the decision below compares. TBDTerminalSerialization is
      # exposed in its own right, not only as something TBDDaemonLib imports —
      # TBDDaemonLib and TBDApp both import it, so a symbol added to it is the
      # same shape of change. Comparing a library's sources without removing
      # its artifacts would answer `wipe` on exactly the run that needs it and
      # still leave that library's stale objects in place.
      #
      # The wipe is not free: measured on a run whose commit touched only
      # `Sources/TBDDaemon` and one test file, it cost about three of the 278
      # seconds that run spent compiling — 89 TBDShared files and 265
      # TBDDaemonLib files recompiled, TestSupport and TBDDaemonTests re-emitted
      # on top, and a 38-second relink. Over the last 40 commits on `main`, 18
      # touched none of the compared paths and paid it for nothing.
      # TBDTerminalSerialization adds little to that: it is five
      # files, and every module that imports it already depends on TBDShared,
      # so its wipe brings no new module into the rebuild — only its own files
      # and the few downstream files that import it but not TBDShared or
      # TBDDaemonLib. TBDKernel is ten files, and the modules that import it
      # without TBDShared are the two helpers, their tests and TBDKernelTests,
      # so its wipe can add those to a run's rebuild.
      #
      # The bug's precondition is that a library's SOURCES differ from the
      # sources its cached artifacts were built from, so the wipe is conditional
      # on exactly that. The record step right after the build — the job's only
      # compile — and just before the cache save writes a fingerprint of those
      # sources — one git object id per compared path — in
      # `.build/tbd-first-party-fingerprint`, which rides the same cache entry
      # as the artifacts it describes; `scripts/ci/first-party-wipe-needed.sh`
      # compares it against the tree being built now and answers `wipe` or
      # `skip`. Every uncertainty answers `wipe` — no marker, an unreadable one,
      # a compared path that no longer resolves, or any difference at all —
      # because skipping wrongly costs a link flake nobody will trace back here
      # while wiping wrongly costs three minutes. `|| echo wipe` keeps even a
      # broken decider on the safe side rather than failing the job.
      #
      # The marker is REMOVED the moment it has been read, and a fresh one is
      # recorded only by that later step, which runs only after the build
      # succeeded. That is what keeps the marker and the artifacts from
      # drifting apart no matter how this run ends: a job that dies between
      # here and the record step has no marker in `.build/` and saves nothing,
      # because the save comes after the record, while a job that dies before
      # this step leaves the restored marker untouched, still describing the
      # restored artifacts.
      - name: Force-rebuild first-party libraries (workaround SPM #7715)
        run: |
          decision="$(bash scripts/ci/first-party-wipe-needed.sh .build/tbd-first-party-fingerprint || echo wipe)"
          rm -f .build/tbd-first-party-fingerprint
          if [ "$decision" = "skip" ]; then
            echo "Keeping the restored first-party artifacts: nothing the wiped library targets are built from changed since these artifacts were built (reason above)."
            exit 0
          fi
          # These modules are exactly the library targets whose sources
          # `WIPE_PATHS` in the script above compares. Adding a module here
          # means adding its sources — and the sources of every first-party
          # target it depends on — to that list, or its wipe becomes conditional
          # on unrelated files. A library whose sources are on that list belongs
          # here, or a change confined to it answers `wipe` and still leaves its
          # own stale objects in place. `scripts/ci/first-party-wipe-needed.test.sh`
          # checks each module against its OWN sources, in both directions, and
          # that every source directory on the list is one library target's.
          # It does not check dependencies: that a module's first-party
          # dependencies are on the list is for review to hold.
          for module in TBDKernel TBDShared TBDDaemonLib TBDTerminalSerialization; do
            echo "=== $module artifacts before wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
            rm -rf .build/*/debug/"$module".build .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || true
            echo "=== $module artifacts after wipe ==="
            ls -la .build/*/debug/"$module".build 2>/dev/null || echo "(absent)"
            ls -la .build/*/debug/Modules/"$module".swiftmodule 2>/dev/null || echo "(absent)"
          done

      # Three parallel swift-frontend processes is the cap on the 3-core,
      # ~7 GB `macos-26` runner. Under Swift 6.3 the two big modules build
      # WMO in debug at ~1.35 GB peak frontend RSS each (measured), so three
      # concurrent frontends leave headroom under the memory ceiling, and the
      # runner has only 3 cores — a fourth job would just contend for CPU
      # without shortening the build. The ceiling is real: with Swift 6.2 and
      # all-per-file builds, default parallelism OOMed late in the build with
      # a bare `error: fatalError`, which is why a cap exists at all.
      #
      # Every compile in this job goes through `scripts/swift-safe`, which
      # supplies `--jobs` from TBD_SWIFT_JOBS and refuses a command line
      # above it. That variable is pinned in this job's `env:` block, so the cap
      # above is stated explicitly here instead of riding on the wrapper's
      # default — raising that default would otherwise lift CI past the runner's
      # memory ceiling silently. A developer box, which sets its own
      # TBD_SWIFT_JOBS, is no longer failed or throttled by a hardcoded number.
      # The build step below is the only step that compiles, and it spells the
      # same variable on its own command line rather than repeating the number,
      # so the cap reads off the step that spends it — one cap, one place to
      # change it. The test steps pass no `-j`: they compile nothing, and the
      # wrapper bounds them anyway.
      #
      # ---------------------------------------------------------------------
      # Why the build is its own step
      #
      # This step compiles the package and every test target once, and the four
      # test steps below run against its output with `--skip-build`. A
      # `swift test` that builds for itself re-checks the whole build graph
      # first: run that way, the first pass carries the entire compile inside a
      # test step, and over 96 green runs each later pass spent a median
      # 10–13 s on a check that found nothing to do. The flag reaches SwiftPM
      # untouched: `scripts/ci/watched-test-pass.sh` hands everything after its
      # `--` to `scripts/test.sh`, which consumes only `--fingerprint` and
      # `--no-fingerprint` and forwards the rest to `swift test`.
      #
      # WHAT `--skip-build` SKIPS IS THE BUILD, NOT THE PLANNING. A pass with it
      # compiles and links nothing, but SwiftPM still loads the package and asks
      # for the build description to find the test bundle, and that runs its
      # `PackageStructure` step, whose signature hashes the build parameters and
      # the whole process environment (`PackageStructureCommand` in SwiftPM's
      # `LLBuildCommands.swift`). `scripts/test.sh` gives every run a fresh
      # fenced environment, so every pass re-plans the build graph before it
      # runs a test. Re-planning is part of what the 10–13 s above paid for, so
      # the flag removes llbuild's walk over every compile and link command and
      # keeps the planning; how much of the 10–13 s a pass still spends is for
      # the step timings to show.
      #
      # `--build-tests` builds what the passes would have built for themselves.
      # SwiftPM maps it to the `allIncludingTests` subset, which is the subset
      # `swift test` builds when it is given no `--test-product`
      # (`buildTestsIfNeeded` in SwiftPM's `SwiftTestCommand.swift`), and in a
      # debug build testability is on either way. Of what the passes forward,
      # `--parallel`, `--no-parallel`, `--filter`, `--skip` and the xUnit pair
      # choose which tests run and where the results go, and change nothing that
      # is compiled. The flags that do bear on the build are this step's own:
      # `-j` comes from the same TBD_SWIFT_JOBS through the same wrapper, and
      # every pass spells the same CI_SWIFTPM_FLAGS this step does.
      #
      # IT ALSO BUILDS EVERY EXECUTABLE TARGET, which is why the job has no
      # separate build of TBDCLI and TBDDaemon. A build without `--build-tests`
      # selects the `allExcludingTests` subset (llbuild target `main`), and
      # SwiftPM's manifest builder adds every root non-test module and every
      # non-test product to llbuild target `test` as well as to `main`
      # (`LLBuildManifestBuilder+Swift.swift` and `+Product.swift`), so
      # `allIncludingTests` is a superset. Package.swift alone would not show
      # it: TBDCLI is a test dependency, but no test target depends on the
      # TBDDaemon executable, only on TBDDaemonLib. The field record agrees: a
      # build of `main` run after the first `swift test`, which builds this
      # same subset, was a no-op in 96 of 96 green runs.
      #
      # THE PASSES RUN ONLY ON THIS STEP'S SUCCESS, and each one states it in
      # its own `if:` rather than inheriting it from 1a's skip. `--skip-build`
      # runs whatever test bundle `.build/` holds, and after a failed or killed
      # compile that is the bundle the cache restored, or a half-relinked one —
      # tests of a different tree, which could well pass. So a red build leaves
      # the job red on this step, with the `::error::` line below naming the
      # cause, and every pass is skipped rather than run against the wrong code.
      #
      # THE PASSES CARRY THE BUILD'S FLAGS, the job's CI_SWIFTPM_FLAGS, although
      # they compile nothing. A pass re-plans the build graph (see "WHAT
      # `--skip-build` SKIPS" above) from its own command line, and the test
      # bundle it then looks for sits under `.build/<triple>/debug/` whatever
      # the debug-information flags are, so a pass planned without them would
      # most likely still find the bundle this step linked and run it. "Most
      # likely" is not good enough for a verdict, and identical flags remove the
      # question: every pass plans exactly what this step compiled, and a pass
      # that ever lost `--skip-build` would find the build up to date rather
      # than compile the whole package again with other flags.
      #
      # THE IMPORT CHECK IS THIS STEP'S ALONE. With
      # `--explicit-target-dependency-import-check error`, SwiftPM pre-scans
      # each target's imports before it compiles and fails the build when a
      # target imports a module of the package graph that its dependency tree
      # does not reach. Every module SwiftPM builds lands in one shared search
      # directory, so without the check such an import compiles whenever that
      # module happens to be built first. SwiftPM skips the check for any
      # target whose dependency tree holds a build plugin, and SwiftTerm's
      # library uses one, so the check covers TestSupport but not TBDAppTests or
      # any other target that reaches SwiftTerm. What keeps both TBDAppTests and
      # TestSupport off TBDDaemonLib is the SwiftLint rule
      # no_daemon_import_in_app_tests, in the lint job and the pre-push hook;
      # for TestSupport this check is a second guard. The check also keeps the
      # holder and the peer helper, their tests and TestSupport off TBDShared
      # (docs/specs/2026-10-30-helper-kernel-design.md), since none of them
      # reaches SwiftTerm's plugin. The option changes nothing that is
      # compiled, so it stays out of CI_SWIFTPM_FLAGS, and so out of the cache
      # key that carries that value, and the passes, which run with
      # `--skip-build`, do not spell it. It is best-effort: SwiftPM skips
      # the check without a message when the compiler offers no import
      # pre-scan, stops checking when one target's pre-scan fails, and visits
      # targets in an order that changes from run to run, so a green build does
      # not prove that it ran. See
      # docs/specs/2026-10-26-daemon-test-support-design.md, which also says how
      # to prove that the check bites.
      #
      # 30 minutes, which is 1800 s: 45% above the slowest measured run of a
      # first test step that compiled for itself, and that figure covers the
      # compile AND a full daemon test pass, so the compile alone has more room
      # than 45%. Measured over the 45 most recent concluded runs of this
      # workflow (2026-09-05 to 2026-09-09), such a step took between 73 s and
      # 1250 s. The three slowest — 1010 s (run 34255127220), 1115 s
      # (34267900663) and 1250 s (34255164378) — are exactly the runs whose
      # SwiftPM cache restore finished in 1–4 s, which is what a cache MISS
      # looks like: a hit spends 25–56 s restoring. So 1250 s is the measured
      # cold-cache figure, over a full 5,529-test daemon pass on top of the
      # compile. Warm-cache runs still spread 73–996 s, because the runs
      # measured all force-rebuilt TBDShared and TBDDaemonLib and a PR's first
      # run restores only a fallback entry. Those runs compiled with SwiftPM's
      # default debug information. Paired cold builds put CI_SWIFTPM_FLAGS at
      # about 0.825 of the default's compile time on the same runner; whether
      # these warm and compile-plus-test figures shrink by the same factor is
      # inferred, not measured, so the bound stays sized against them as
      # measured.
      #
      # NO STALL WATCHDOG, unlike the passes. The watchdog exists for one
      # failure: a test process wedged where no time limit can reach it — the
      # cooperative-pool wedge recorded below — whose stacks the platform
      # timeout would destroy. A compile does not fail that way in this job's
      # record. The compile failures it does record end on their own, with the
      # diagnostic in the log: the OOM that surfaces as a bare
      # `error: fatalError`, and the stale-archive link failure the #7715 wipe
      # above defends against. And `scripts/ci/watched-test-pass.sh` is built
      # around a test run — it runs `scripts/test.sh`, fails a run that reports
      # fewer tests than its floor, and picks what to sample by the test
      # runner's argv — so wrapping a build would take a new mode in that script
      # and its harness, for a stall nothing has shown. What this gives up: a
      # compile run inside a watched pass gets its stall sampled, and here
      # `timeout-minutes` ends one with no stacks. The bound still names this
      # step, and so the compile, as what hung; a stall that does turn up here
      # is the evidence for adding a watchdog.
      - name: Build (every target, including the test targets, once for all five passes)
        id: build
        timeout-minutes: 30
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          status=0
          scripts/swift-safe build --build-tests --explicit-target-dependency-import-check error -j "$TBD_SWIFT_JOBS" "${swiftpm_flags[@]}" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The build exited $status, so all four test passes are skipped: they run with --skip-build, and after a failed build that would test whatever stale bundle .build/ still holds instead of this commit."
          fi
          exit "$status"

      # Record which sources produced the artifacts now sitting in `.build/`, so
      # the next run that restores this cache can tell whether the SPM #7715
      # wipe above is needed at all. It goes right after the build step — the
      # job's only compile — and immediately before the cache-save step below,
      # and writes inside `.build/` so a saved entry carries the marker with the
      # artifacts it describes. It has to come before the save: an entry saved
      # without it makes every run that restores that entry wipe.
      #
      # A marker beats reading the cache key: the key is built from
      # `hashFiles(...)` digests, which identify a tree but say nothing that can
      # be compared path by path against another one. Object ids can, and unlike
      # a commit they survive the ephemeral merge commit a `pull_request` run is
      # checked out at.
      #
      # It carries NO condition, so it runs only when every step before it —
      # setup, the wipe and the build — succeeded. A fingerprint of the sources
      # says what `.build/` was built FROM, never that the build finished: a run
      # whose compile was OOM-killed or wedged part way through — shapes this
      # job's comments record as real — would otherwise record a marker over
      # half-written artifacts, and a rerun of the same commit restores that
      # cache by an exact key hit and skips the wipe that used to heal it.
      # Reaching this step is the completion signal, and its position, after
      # the job's only compile, is what makes it one. The test passes that follow
      # it compile nothing (`--skip-build`), so nothing they do can leave the
      # marker describing artifacts other than the ones in `.build/`.
      #
      # A run that ends before here records nothing and, the save coming after
      # this step, saves nothing. A run that ended before the wipe step leaves
      # the restored marker untouched, still describing the artifacts it was
      # restored with.
      - name: Record the sources these build artifacts came from
        run: bash scripts/ci/first-party-wipe-needed.sh --record .build/tbd-first-party-fingerprint

      # Saved RIGHT AFTER THE BUILD, before any test runs, because a run
      # cancelled part way through is otherwise a run that saved nothing.
      # `concurrency` cancels a run in progress when a newer push to its branch
      # arrives, and a run spends most of its life in the test passes. Measured
      # on main: 19 of 49 push runs were cancelled by a newer push and saved
      # nothing, so main's entry lagged main, and 4 of 27 green push runs then
      # compiled a wider cascade than their own commit. A run cancelled during
      # its tests has already saved here.
      #
      # The entry is the one a save at the end of a green run would store. The
      # build step is the only step that writes compiled artifacts into
      # `.build` — every pass runs with `--skip-build`, and the debug-symbol
      # bundles a local test run prunes stay put under `CI`
      # (`scripts/dsym-prune-lib.sh`) — so what the tests add afterwards is a
      # re-plan of the build graph, which the next run's build redoes anyway.
      # A green suite never vouched for the entry; the build and the #7715
      # marker do. The build has to succeed for this step to run, so no entry
      # holds a compile that failed or was killed part way, and the record step
      # above has written the marker the next run's wipe decision reads. A
      # failing test says something about the code, not about whether `.build`
      # matches it.
      #
      # `key:` is the restore step's own resolved primary key rather than a
      # second copy of that expression, so the two cannot drift apart.
      #
      # The conditions, in the order they are written:
      #
      #  - `steps.build.outcome == 'success'`, with no status function, so GitHub
      #    prepends its implicit `success()` as well: the build finished, and so
      #    did every step before this one, the marker recording included.
      #  - `cache-hit != 'true'`. An exact hit means this key is already in the
      #    store and the save would be a duplicate of what was just restored.
      #  - The event. A `push` (main, per this workflow's triggers) always saves:
      #    main's entry is the one every branch can read, and it is all that
      #    stands between a fresh PR and a cold build. A `workflow_dispatch`
      #    never saves, because nothing can read what it would write — see the
      #    restore step above.
      #  - For a `pull_request`, whether it touched a first-party library or the
      #    package manifest. The primary key hashes every source file, so a PR's
      #    own entry is restorable by that same PR's later pushes and by nothing
      #    else; it earns 1.5 GB of a 10 GB store only when the next push would
      #    otherwise rebuild nearly everything. Touching TBDKernel, TBDShared,
      #    TBDDaemonLib or TBDTerminalSerialization is exactly that case — an
      #    interface change cascades into every downstream module, and this job
      #    wipes and re-emits the libraries on such a run regardless. Touching
      #    Package.resolved moves the dependency set the restore-keys prefix is
      #    scoped to, which leaves main's entry no longer a fallback this PR can
      #    use at all; touching Package.swift re-plans the build graph, which
      #    cascades the way a library change does. A PR that touches
      #    neither rebuilds a small delta on top of main's entry for about what
      #    restoring its own would have cost, so it keeps main's entry alive for
      #    everyone instead of evicting it.
      #
      # A pull request's save happens here too, for one policy in one step and
      # because the PR runs it adds are the ones a next push wants most. A
      # library-touching PR whose run went red, or was cancelled by the PR's
      # own next push, is the PR most likely to push again, and that push
      # restores this entry by prefix and builds a small delta instead of the
      # library cascade. The PR saves it adds are only those library-touching
      # runs that built and then went red or were cancelled, each costing the
      # same 1.5 GB of the 10 GB store as any other.
      #
      # The save serves the next run, so it must never cost this one its tests.
      # Pass 1a runs on `!cancelled()` and a successful build, so it still runs
      # after a failed recording, which reddens the job, or a failed save,
      # which only warns: `actions/cache/save@v4` catches every error in the
      # save and logs it as a warning, and its step exits 0.
      #
      # 10 minutes, against 26-49 s of measured upload: the one way left for a
      # save to cost the tests is to stall. It sits before every pass, so a
      # stalled upload would hold the job to its own bound with nothing tested.
      # `continue-on-error` so a save ended by that bound warns like any other
      # failed save rather than reddening a run whose tests then pass.
      - name: Save SwiftPM build artifacts and dependencies
        if: ${{ steps.build.outcome == 'success' && steps.spm-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && steps.cache_policy.outputs.library_touched == 'true')) }}
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      # ---------------------------------------------------------------------
      # Five sequential steps, one job (docs/specs/2026-07-24-test-hardening-design.md
      # §4): the tier-3 live suites live in their own target so they can run
      # serially on an otherwise idle machine instead of contending with the
      # parallel passes. A second *job* would draw from the 5-concurrent-macOS-job
      # cap and re-pay the build, so all passes share this one.
      #
      # EVERY ONE OF THEM RUNS THROUGH `scripts/ci/watched-test-pass.sh`. That
      # script gives the pass a pty so its log streams line by line instead of in
      # 16 KB blocks, bounds the run with a stall watchdog that captures every
      # thread's stack of the processes executing the tests before the platform
      # timeout can destroy the evidence, and turns the outcome into a verdict —
      # the pass's own exit status first, untouched, and only then the floor. Why
      # a pty, why lineage rather than names, why the argv match, why the cap of
      # four, why five seconds of `sample`, why 30 seconds of grace, why `tee`
      # dies last, why the status file is validated and why status precedes the
      # floor are all in that script's header, with the design in
      # docs/specs/2026-09-04-quiet-pass-stall-watchdog-design.md. Its harness is
      # `scripts/ci/watched-test-pass.test.sh`, run by the `lint` job.
      #
      # ---------------------------------------------------------------------
      # Why the fast pass is FOUR steps instead of one
      #
      # Swift Testing parallelizes every non-serialized test in ONE process with
      # no concurrency cap. All targets compile into that process, so per-test
      # scheduling latency scales with the *total* population, not with the
      # suite you are looking at. Evidence from 9 mined CI runs: p50 per-test
      # reported duration is ~1/3 of total wall time in every run, red AND
      # green — a trivial test "takes" 16–29 s because it is mostly suspended
      # waiting for a turn. Population grew 3013 -> 4536 in three weeks. What
      # flips a run red is whether one of the fixed wall-clock scheduling
      # handshakes (ControlModeInputHealth, ControlModeInputRouter, the archived
      # search debounce) loses a coin flip inside a ~2 s band; the failures are
      # all handshake timeouts, never logic assertions.
      #
      # Halving the in-flight population halves the tail those deadlines must
      # absorb. Measured locally under induced load, arms INTERLEAVED (not run
      # in blocks — an earlier attempt at this comparison was invalidated by
      # load drift on a shared box) and population held constant, means over 5
      # iterations: p90 26.4 s -> 14.6 s, p50 8.8 s -> 7.6 s.
      #
      # The cost is +26 s of wall time (56 s -> 82 s mean), because the second
      # invocation re-pays SPM's no-op build check and process startup. That is
      # the honest figure: a single iteration showed +6 s and it did not hold up
      # across the run. Set against a step that already spends 139-404 s on the
      # compile, it is a good trade for halving the tail. Each further split
      # pays that startup cost once more for the same reason. That measurement
      # included SwiftPM's no-op build check. Every pass here runs with
      # `--skip-build` against the build step above, which drops the build
      # half of that check but not the re-planning before it (see "WHAT
      # `--skip-build` SKIPS" above), so each extra invocation re-pays process
      # startup and a re-plan of the build graph.
      #
      # This is NOT the "sharding across runners" that §1 considered and
      # rejected and §2 lists as a non-goal. That rejection was about extra
      # *jobs*: the 5-concurrent-macOS-job cap, and each shard re-paying the
      # ~2 min build. These are four sequential `swift test` invocations in ONE
      # job sharing ONE build — the same shape this file already uses for the
      # fast/quiet split. It pays neither the job cap nor a second build.
      #
      # What forced the third step. On 2026-09-08 nearly every run of this
      # workflow reddened at least once on a test unrelated to the change under
      # review, always in the tail of a fast pass — SocketServerSocketOwnership,
      # AttachReplayOrchestrator, AppearanceDebounce, ArchivedWorktreeSearch,
      # TerminalTeardownReap, BoundedGateWait, BoundedProcessRunner,
      # WorktreeArchiveDeletionQueue, HolderLifecycle, TBDHolder — and one PR
      # needed seven reruns to land. Twelve feature-branch reds classified by
      # step: five in pass 1/2 and seven in pass 2/2, two of the latter
      # 30-minute wedges with no stack at all (runs 34174344530 and
      # 34176996067), where the process went silent about 5 s into the test run
      # with ~1,965 tests started, none finishing, zero issues recorded and no
      # time limit firing — the cooperative-pool wedge signature that
      # `Tests/TestSupport/BoundedGateSupport.swift` describes. Zero reds landed
      # in the quiet pass, which was then the only step with a watchdog; and
      # because a red fast pass skipped the steps after it, a single flake hid
      # the live verdict for the whole run.
      #
      # The populations behind that: pass 1 was running ~5,529 tests and pass 2
      # ~5,269, up from 4,988 and 4,645 on the 2026-09-04 green run of `main`,
      # and from the ~4,350 and ~2,800 the deadline triple was originally
      # derived against. Pass-1 test time was 247 s and 231 s on the red runs
      # against 153 s and 195 s on the green ones, and every hang-catcher in the
      # suite is sized per scheduling hop — `TestDeadlines.saturatedPass` 90 s,
      # `TestGate.deadline` 120 s, the clock guards 45 s, the suite limit
      # 240 s — so the red runs are simply the slow-runner tail of the same
      # distribution. Re-splitting is the remedy that follows from "population
      # is the scheduler" (`Tests/CLAUDE.md`); raising the deadlines instead
      # re-derives four coupled constants and wants a spec first.
      #
      # What forced the fourth step. Pass 2 is bound by the main thread, not by
      # the cooperative pool: its `@MainActor` tests run one at a time, so a
      # test's reported time is mostly the main-actor work queued ahead of it.
      # Measured on five green runs with pass 2 as one step, its slowest test
      # reported 67.2–94.5 s, and the spread follows the runner: one runner
      # finished pass 1a in 52 s and still put 94.5 s on pass 2's slowest test.
      # That is within about 8 s of the ~102 s at which `Tests/CLAUDE.md`
      # ("Population is the scheduler") says to split — `saturatedPass`'s
      # 120 s less its ~18 s margin — and pass 2's timing tests flake in that
      # tail; one failed after 94.2 s. A split does not reduce the main-thread
      # work, and it adds an invocation's startup, ~26 s. What it buys is a
      # shorter tail, because a test queues behind only its own half's
      # main-actor work.
      #
      # Measured on the split's first green run (41352611270): 2a's slowest
      # test reported 41.0 s (p90 34.1 s, p99 40.9 s) and 2b's 37.5 s (p90
      # 29.4 s, p99 36.0 s), against 67.2–94.5 s with one step. The two steps
      # took 61 s and 57 s, 118 s together, against 87–123 s for the single
      # pass-2 step on recent runs of `main`. On that run the split cost no
      # measurable job time: halving the main-thread queue saved about what
      # the extra invocation's startup costs. That is one run.
      #
      # So pass 2's cut is measured too, on the resource that binds it:
      # main-thread time, not test count. Through `P`, TBDAppTests holds 51.6%
      # and 53.6% of pass 2's main-thread samples in two whole-pass profiles,
      # and 52% of its own tests. Step 2a takes `^TBDAppTests\.[A-P]`; step 2b
      # takes everything else outside the daemon targets — TBDAppTests Q–Z,
      # TBDSharedTests, TBDCLITests, TBDKernelTests, TBDHolderTests and
      # TBDPeerHelperTests. A suite-less app test runs in 2b unless its
      # function name starts with an uppercase A–P: its ID is
      # `TBDAppTests.Name()`, which 2a's filter also matches. Swift function
      # names are normally lowercase, so in practice suite-less app tests run
      # in 2b. That is why 2b executed 4,739 tests to 2a's 2,501 on that run
      # while each carries about half the main-thread time.
      #
      # Why steps 1b and 2b are COMPLEMENTS and not enumerations
      #
      # The five passes must partition the package exhaustively, and that has
      # to hold *by construction* rather than by anyone remembering to update a
      # list. The spec makes exactly this point about the target boundary in §3
      # ("Enforcement mechanism = target boundary"): it is "compiler-enforced,
      # cannot silently zero-match like a `--filter` regex". A fast pass
      # expressed as `--filter` enumerations gives that
      # property up — `swift test --filter` exits GREEN on zero matches, so a
      # newly added `TBDFooTests` would simply appear in no list, run in NO
      # pass, and nothing would go red.
      #
      # The floors cannot cover that hole, and it is worth being precise about
      # why: adding a target does not *reduce* any listed step's count, so every
      # floor still clears and every step stays green while the new target's
      # tests execute nowhere. Expressing step 2b as "everything except
      # TBDDaemonTests, TBDDaemonLiveTests and 2a's half of TBDAppTests" closes
      # it — a new target lands in step 2b automatically and runs. Step 1a
      # takes the A–O half of TBDDaemonTests, step 1b takes the REST of
      # TBDDaemonTests as a complement of 1a rather than as a `[P-Z]`
      # enumeration (a suite renamed to start with a digit or an underscore
      # would fall out of both halves otherwise), step 2a takes the A–P half of
      # TBDAppTests, step 2b takes the complement of every other step in ONE
      # `--skip` regex, so nothing can fall between two lists, and the quiet
      # pass takes TBDDaemonLiveTests: no gap, no overlap, nothing to maintain.
      #
      # Floors: `swift test --list-tests` on 2026-08-28 reports TBDDaemonTests
      # 4354, TBDAppTests 2790, TBDSharedTests 858, TBDCLITests 306,
      # TBDDaemonLiveTests 85 (8393 total). Those numbers are worth reading
      # next to the ones this comment carried when the fast/slow split landed —
      # TBDDaemonTests 2194, 4605 total — because the daemon target alone now
      # runs nearly twice what the whole package ran then, and it is where the
      # tail lives: measured on the 2026-08-28 run of `main`, the undivided
      # daemon pass had a median test reporting an 85.8 s span (p90 112.1 s,
      # max 132.8 s) and 47% of its tests spanned longer than the whole 90 s
      # `ciSafeDeadline` that bounds the handshake waits among them. What
      # actually EXECUTES is slightly lower for pass 2 — 3876 on the 2026-08-27
      # green run, the most recent one to reach pass 2 at all — because a
      # handful of tests are conditionally skipped at runtime. The floors are
      # set against the executed counts (the summary line these steps grep),
      # which is the only number the check can see; don't "correct" them to the
      # listed totals.
      #
      # The two daemon halves are floored at 1200 and 1500. Where the cut goes
      # is measured, not guessed: the split's first CI run (34305400310) cut at
      # `[A-L]` and executed 1918 and 3703 — a third and two thirds, not the
      # halving the split exists for — with 51 s and 114 s of test time. A local
      # count of `@Test` attributed to the top-level suite that declares it
      # predicted 1919 for that same cut, so that heuristic is worth trusting to
      # within a test; it puts M, N and O at 582 between them, which moves the
      # cut to `[A-O]` for an expected split near 2,500 / 3,120. The floors sit
      # deliberately far below either half and will be recalibrated from the
      # counts this cut's first run prints, which is the only source that
      # measures what actually executes.
      #
      # The two app halves are floored at 1400 and 3200, against the 2,501 and
      # 4,739 tests they executed on the split's first green run
      # (41352611270). They sit well below either half for the same reasons as
      # the daemon floors: the executed count drifts from run to run, and a
      # floor is there to catch a collapse, not to track the population.
      #
      # 2b's floor is sized against its worst over-skip, not only against
      # zero. TBDAppTests holds about 4,810 tests, about 2,300 of them in 2b,
      # so a 2b `--skip` that over-matched ALL of TBDAppTests would still run
      # about 2,440 tests from the other targets. A floor of 2500 would sit
      # only about 60 above that and could miss it on a run with a few more
      # tests; 3200 catches that over-skip and still sits about 1,500 below
      # the 4,739 2b executed.
      #
      # That rests on one assumption: what such an over-skip would leave 2b
      # running — the targets other than TBDAppTests, plus any suite-less app
      # tests the over-skip spares — stays under 3200. It is about 2,440 on
      # that run. Raise this floor if it grows past about 3,000.
      #
      # No two steps share a floor, so `scripts/nightly-flake-stress.test.sh`
      # catches a change to any one step's floor on its own.
      #
      # And the executed count is NOT stable run to run: two CI runs on one PR,
      # on commits differing only in doc comments (zero tests added,
      # `--list-tests` unchanged), executed 2194 and 2204 for the daemon pass.
      # The cause is not established — it is not conditional skips (the only
      # `.enabled(if:)` here is gated on an env var CI does not set) and not
      # parameterization (all `arguments:` are static literals). Left unexplained
      # rather than guessed at. The practical consequence is the point: pin a
      # floor near the exact count and it WILL fire spuriously. Keep the margin.
      # The floors sit well below each step's total
      # so ordinary test additions/removals never trip them. Their job is NOT
      # to catch an unlisted new target (the complement shape already does
      # that) — it is to catch a *collapse or rename* of a target that is
      # named in one of these regexes, where `--filter`/`--skip` would
      # otherwise zero-match or over-skip its way to a green run of nothing.
      #
      # ---------------------------------------------------------------------
      # Why every pass goes through `scripts/test.sh` and not bare `swift test`
      #
      # The wrapper points `TBD_HOME`, `TBD_SOCKET_PATH`,
      # `TBD_CLAUDE_HOST_HOME`, `TBD_TEST_CODEX_HOME` and `TMUX_TMPDIR` at a
      # scratch dir for the run, points `HOME` and `CFFIXED_USER_HOME` at a
      # second one whose `tbd`, `.claude` and `.codex` entries are mode 000 (so
      # code that assembles a path out of the home directory rather than asking
      # fails with EACCES at its own call site) and, as a backstop, fingerprints
      # the real `~/tbd`, `~/.claude`, `~/.codex`,
      # `~/Library/Logs/TBD/hang-stacks`, tmux socket directory and test-suite
      # plists in `~/Library/Preferences` on either side and fails the step if
      # anything appeared or vanished.
      # `CLAUDE.md` has said "Tests must not touch ~/tbd" all along, and the
      # suite quietly violated it anyway: 18k orphan profile dirs, ~2.9k fake
      # worktrees and ~7,100 dead tmux sockets accumulated on a developer box
      # before anyone noticed. No per-test assertion could have caught it —
      # the invariant belongs to the whole run.
      #
      # THIS JOB IS THE ONLY PLACE THE FINGERPRINT RUNS, and every step below
      # asks for it with an explicit `--fingerprint`. The wrapper's default is
      # gated on `$CI`, which a runner sets — the explicit flag says so in the
      # workflow and survives a runner that does not. The pre-push hook
      # passes `--no-fingerprint` and keeps the fence alone, because a developer
      # box writes to `~/tbd` and `~/.claude` for reasons that have nothing to
      # do with the run under way — a live daemon creating worktree/scratch/
      # notes/channel entries, a sibling worktree's `restart.sh` dropping a
      # `state.db.pre-migration.<ts>`, Claude Code writing its own store — and a
      # guard that reddens for reasons the pusher cannot fix gets disabled. A
      # runner has none of that, which is what makes a red here always real.
      #
      # A CI runner has no `~/tbd` to pollute, so the guard reads as a no-op
      # there. It is not: an empty `~/tbd` makes it MORE sensitive, because the
      # fingerprint goes from "absent" to a listing on the first stray write.
      #
      # ---------------------------------------------------------------------
      # Why every pass also writes xUnit XML
      #
      # A remote run has to tell whoever asked for it WHAT failed, and the job
      # log cannot carry that: a single failed run of this workflow produces
      # 5.3 MB across 32,228 lines, in which every line is prefixed with
      # job/step/timestamp and ANSI codes, several parallel passes interleave,
      # and compiler diagnostics print source context that looks exactly like
      # test output. Two extraction passes over a real failed log both produced
      # wrong answers — one surfaced a deliberate known-issue self-test, the
      # other matched 22 `#require is redundant` warnings displaying source
      # context. An extractor that silently reports the wrong failure is worse
      # than no extractor, so the structured file is the interface:
      # `--xunit-output` writes it and `--experimental-xunit-message-failure`
      # puts the failure messages inside it. `scripts/test.sh` forwards
      # unrecognised arguments straight through to `swift test`.
      # ---------------------------------------------------------------------
      - name: Test (fast parallel pass 1a — TBDDaemonTests A–O)
        id: fast_pass_daemon_a
        # Only on the build step's success — see "THE PASSES RUN ONLY ON THIS
        # STEP'S SUCCESS" above. `!cancelled()` in place of the implicit
        # `success()` because the only steps between the build and here are the
        # marker recording and the cache save, which serve the next run: a
        # failed recording reddens the job and a failed save only warns, and
        # neither may cost this run its tests. Every setup step comes before
        # the build, so a failure there still skips this pass through the build
        # clause.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # 15 and a 600 s budget, the same as 1b: the build step pays the
        # compile, so this pass is a re-plan of the build graph (see "WHAT
        # `--skip-build` SKIPS" above) and then test runtime, over the A–O half
        # of TBDDaemonTests — predicted near 2,500 tests against 1b's 3,120 (see
        # "The two daemon halves" above), and 1b measured 128 s of step time.
        # The watchdog budget bounds a wedge; this step bound is the platform
        # backstop behind it, sized to clear the budget with room for the
        # sampling and the kill sweep.
        timeout-minutes: 15
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-daemon-a --budget-seconds 600 \
            --floor 1200 \
            --floor-message 'the --filter regex matched nothing or the target was renamed.' \
            -- --fingerprint --skip-build "${swiftpm_flags[@]}" --parallel --filter '^TBDDaemonTests\.[A-O]' \
               --xunit-output /tmp/xunit-daemon-a.xml --experimental-xunit-message-failure

      - name: Test (fast parallel pass 1b — the rest of TBDDaemonTests)
        id: fast_pass_daemon_b
        # Runs even when 1a went red, but not when the job was cancelled and not
        # when setup never reached 1a at all. Until this landed, a red fast pass
        # skipped every step after it, so one flake in the tail of pass 1 hid
        # the live verdict for the whole run and the next push learned nothing
        # new. The job still fails; the cost is the +2–4 min the later passes
        # take on a run that is already red. And never after a failed build:
        # 1a's own condition already implies it, and the clause is spelled out
        # here anyway so that no change to 1a's `if:` can ever let a
        # `--skip-build` pass run a stale bundle.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # 15: the build step pays the compile and `--skip-build` skips the
        # build, so this is a re-plan of the build graph (see "WHAT
        # `--skip-build` SKIPS" above) and then test runtime — 128 s of step
        # time on the split's first CI run, a figure that included SwiftPM's
        # whole no-op build check. The 600 s budget bounds a wedge; this clears
        # it.
        timeout-minutes: 15
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-daemon-b --budget-seconds 600 \
            --floor 1500 \
            --floor-message 'the --filter/--skip pair over-matched or the target was renamed.' \
            -- --fingerprint --skip-build "${swiftpm_flags[@]}" --parallel --filter '^TBDDaemonTests\.' --skip '^TBDDaemonTests\.[A-O]' \
               --xunit-output /tmp/xunit-daemon-b.xml --experimental-xunit-message-failure

      - name: Test (fast parallel pass 2a — TBDAppTests A–P)
        id: fast_pass_app_a
        # The A–P half of TBDAppTests, a cut that halves pass 2's main-thread
        # time rather than its test count — see "What forced the fourth step"
        # above. Its `if:` is 1b's, for 1b's reasons.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # 15. A step bound wide enough for the per-test limits to fire first and
        # attribute a hang to a named test would buy nothing now: the watchdog
        # does that job sooner and with a stack. It bounds the pass at 600 s —
        # against 61 s of step time on the split's first green run — so the
        # platform bound only has to clear the budget plus the sampling and
        # kill sweep.
        timeout-minutes: 15
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-app-a --budget-seconds 600 \
            --floor 1400 \
            --floor-message 'the --filter regex matched nothing or the target was renamed.' \
            -- --fingerprint --skip-build "${swiftpm_flags[@]}" --parallel --filter '^TBDAppTests\.[A-P]' \
               --xunit-output /tmp/xunit-app-a.xml --experimental-xunit-message-failure

      - name: Test (fast parallel pass 2b — everything else outside the daemon targets)
        id: fast_pass_app_b
        # Expressed as a COMPLEMENT, not a list of targets, and in ONE `--skip`
        # regex — see the "Why steps 1b and 2b are COMPLEMENTS" block above. A
        # new test target, and any TBDAppTests suite outside `[A-P]`, lands here
        # on its own. Its `if:` is 1b's, for 1b's reasons, so a red 2a does not
        # skip it.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # 15 and a 600 s budget, for 2a's reasons; 57 s of step time on that
        # run.
        timeout-minutes: 15
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          scripts/ci/watched-test-pass.sh \
            --name fast-pass-app-b --budget-seconds 600 \
            --floor 3200 \
            --floor-message 'the --skip regex over-matched or a target was renamed.' \
            -- --fingerprint --skip-build "${swiftpm_flags[@]}" --parallel --skip '^(TBDDaemonTests\.|TBDDaemonLiveTests\.|TBDAppTests\.[A-P])' \
               --xunit-output /tmp/xunit-app-b.xml --experimental-xunit-message-failure

      - name: Test (quiet pass — tier-3 live suites, serial, idle machine)
        id: quiet_pass
        # Runs on a red fast pass for the same reason 1b, 2a and 2b do: the live
        # suites are the ones a fast-pass flake most often hides. Like theirs,
        # its `if:` also names the build step outright.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.fast_pass_daemon_a.outcome == 'success' || steps.fast_pass_daemon_a.outcome == 'failure') }}
        # `--no-parallel` is REQUIRED and is not the same as omitting
        # `--parallel`. SwiftPM's `--parallel` governs XCTest's process-level
        # sharding; Swift Testing parallelizes suites in-process on its own and
        # ignores the absence of the flag. Measured on this target: without
        # `--no-parallel` all 17 suites start simultaneously and the pass
        # finishes in 10 s — i.e. the live suites contend with each other and
        # the step is not quiet at all, defeating its entire purpose. With the
        # flag they run strictly one at a time (24 s). Serial execution on an
        # idle machine IS this step; do not "optimize" the flag away.
        #
        # A healthy pass reports `Test run with 179 tests in 37 suites passed
        # after 116.847 seconds`, so the 720 s budget is six times a normal run
        # and still three minutes short of this bound — room for the sampling and
        # the artifact upload. The whole expiry path was measured at 42 s.
        timeout-minutes: 15
        run: |
          read -r -a swiftpm_flags <<< "${CI_SWIFTPM_FLAGS:?must be set in the test job env block}"
          scripts/ci/watched-test-pass.sh \
            --name quiet-pass --budget-seconds 720 \
            --floor 35 \
            --floor-message 'the --filter regex matched nothing or the target was renamed.' \
            -- --fingerprint --skip-build "${swiftpm_flags[@]}" --filter '^TBDDaemonLiveTests\.' --no-parallel \
               --xunit-output /tmp/xunit-quiet.xml --experimental-xunit-message-failure

      # Every watched pass writes its stall files as `<name>-stall-*.txt`, so one
      # glob collects whichever pass wedged.
      #
      # `ignore`, not the `warn` its neighbours use: a green run deliberately
      # produces no stall files, so absence here is the normal case rather than
      # a sign that the wiring broke.
      - name: Upload stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stall-diagnostics
          path: /tmp/*-stall-*.txt
          if-no-files-found: ignore
          retention-days: 14

      # THROWAWAY STALL DIAGNOSTIC (do not merge): scripts/ci/stall-sampler.py output.
      - name: Upload stall sampler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stall-diag
          path: /tmp/stall-diag/
          if-no-files-found: warn
          retention-days: 7

      # `warn`, not `ignore`: an absent file means the metrics wiring broke, and
      # that must be visible rather than silently producing an empty dashboard.
      - name: Upload retry metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-metrics
          path: /tmp/retry-metrics.jsonl
          if-no-files-found: warn

      # `if: always()` is the whole point, and both outcomes need the XML. A
      # failing run's is the only machine-readable account of what failed. A
      # passing run's carries the test populations the valve sums to print
      # `Test run with N tests`, which every floor check requires before it will
      # believe a run happened at all — without it a green remote verdict reads
      # as a truncated suite. `warn` on absence, matching the metrics upload
      # above: a missing file means the wiring broke and that must be visible.
      #
      # The glob covers every pass's file, the two daemon halves and the two
      # app halves included: `scripts/remote_verify.py` discovers results with
      # `rglob("*.xml")` over the unpacked artifact (`result_files`) and sums
      # whatever it finds, so splitting or renaming a pass needs no change there
      # — only that each pass keeps writing its XML under `/tmp/xunit-*.xml`.
      - name: Upload xUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-results
          path: /tmp/xunit-*.xml
          if-no-files-found: warn
          retention-days: 7

      # A test process that dies on a signal writes its stack only to a crash
      # report, never to the log, which shows a pass that just stops. macOS
      # writes the report under the runner user's real home whatever HOME the
      # fenced pass ran with; each report names its process and time.
      # `ignore`: a healthy run writes none. A process that exits 0 mid-run
      # writes none either; for the main run loop case, see
      # Tests/TestProcessDefaults/MainRunLoopGuard.m.
      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-crash-reports
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore
          retention-days: 14
