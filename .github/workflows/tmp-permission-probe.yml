# TEMPORARY — delete before merging this PR.
#
# Exists only to answer one question that a pull_request_target workflow cannot
# answer from a PR: can the reviewer App token read collaborator permissions?
# `pull_request_target` reads its workflow from the BASE branch, so the new trust
# step in claude-code-review.yml does not run until after merge. A `push` trigger
# reads the workflow from the pushed ref, so this one runs the real code now.
name: TMP permission probe

on:
  push:
    branches: [fork-pr-checkout-gate]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint reviewer app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_APP_PRIVATE_KEY }}

      - name: Probe collaborator permission with the App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for who in zionts octocat; do
            if out="$(gh api "repos/$REPO/collaborators/$who/permission" --jq '.permission' 2>&1)"; then
              echo "APP TOKEN OK  $who -> $out"
            else
              echo "APP TOKEN FAIL $who -> $out"
            fi
          done

      - name: Probe collaborator permission with the default GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if out="$(gh api "repos/$REPO/collaborators/zionts/permission" --jq '.permission' 2>&1)"; then
            echo "GITHUB_TOKEN OK  zionts -> $out"
          else
            echo "GITHUB_TOKEN FAIL zionts -> $out"
          fi
