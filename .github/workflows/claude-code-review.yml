# ⚠️  Before changing this workflow, read docs/pr-review-gate.md — it documents the
# merge-gate design (trust model, verdict token + Stop hook, exact-match enforce) and
# two gotchas that cost real debugging time:
#   • Runs on pull_request_target and MUST pass github_token: the OIDC app-token
#     exchange 401s on this trigger (anthropics/claude-code-action#1017).
#   • Changing the *trigger event* here needs a one-time admin merge — a PR that
#     changes the trigger matches neither the old nor the new event, so no review runs
#     and the required check never reports.
name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Draft PRs are the only skip path (they can't merge, so a skipped==passing
    # required check is harmless). Every *mergeable* trigger runs the job so it
    # always produces a fresh verdict for the head SHA — we never leave a stale
    # check that a later skipped run could supersede. `labeled` is deliberately
    # NOT a trigger: a job-level skip on an unrelated label would emit a
    # skipped==passing check that overwrites an earlier failing verdict.
    if: github.event.pull_request.draft != true

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      checks: read

    steps:
      - name: Determine author trust
        id: trust
        # Trusted = branch pushed to this repo, OR the author is a
        # collaborator/member/owner. Only the string `true`/`false` reaches the
        # shell — no PR-controlled text is interpolated — so this is safe under
        # pull_request_target. Untrusted-fork code is never checked out or run
        # (every step below that touches PR content is gated on trusted == true).
        run: |
          echo "trusted=${{ github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}" >> "$GITHUB_OUTPUT"

      - name: Block untrusted fork
        if: steps.trust.outputs.trusted != 'true'
        run: |
          echo "::error::Claude review is required, but this PR is from an untrusted fork and cannot be auto-reviewed (the review needs repository secrets that are withheld from fork runs). Push the branch to this repository to have it reviewed. No untrusted code is executed here."
          exit 1

      - name: Checkout PR head
        if: steps.trust.outputs.trusted == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Reset any pre-committed verdict file
        if: steps.trust.outputs.trusted == 'true'
        # SECURITY: the verdict file lives in the checked-out (PR-controlled) tree.
        # Delete any copy the PR itself committed so the only file the enforce step
        # and Stop hook can read is one THIS review session wrote. Without this a PR
        # could commit claude-verdict.txt=APPROVE and, if the review session were
        # killed or timed out before writing its own, sail through the gate.
        run: rm -f "$GITHUB_WORKSPACE/claude-verdict.txt"

      - name: Restore review hooks from the base branch
        if: steps.trust.outputs.trusted == 'true'
        # The Stop hook + its settings.json must come from the BASE branch, not the PR
        # head. Two reasons: (1) a PR branch created before the hooks existed doesn't
        # contain them, and the action then hard-errors on a missing `settings:` file
        # (ENOENT) — this blocked pre-existing fork PRs; (2) a PR must not be able to
        # neuter the gate that reviews it. github.event.pull_request.base.ref is the
        # base branch under pull_request_target; FETCH_HEAD is its tip after the fetch.
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          rm -rf "$GITHUB_WORKSPACE/.github/workflows/claude-review-hooks"
          git checkout FETCH_HEAD -- .github/workflows/claude-review-hooks

      - name: Mint reviewer app token
        id: app-token
        if: steps.trust.outputs.trusted == 'true'
        # A dedicated GitHub App whose slug contains "claude" (e.g. tbd-claude-reviewer)
        # so the action's sticky-comment matcher recognizes its own prior comment and
        # updates it in place instead of posting a new one every run. The matcher keys
        # on the Claude App id OR a "Bot" login containing "claude"
        # (create-initial.ts) — github-actions[bot] matches neither, which is why the
        # OIDC-fallback GITHUB_TOKEN produced duplicate comments. See docs/pr-review-gate.md.
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_APP_PRIVATE_KEY }}

      - name: Run Claude Code Review
        if: steps.trust.outputs.trusted == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post GitHub comments as the dedicated claude-named App (see the mint step
          # above) so sticky-comment updating works across runs. We can't use the
          # OIDC->Claude-App token here because that exchange 401s under
          # pull_request_target (anthropics/claude-code-action#1017), and a plain
          # GITHUB_TOKEN (github-actions[bot]) isn't recognized by the sticky matcher.
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Installs a Stop hook that refuses to end the session until a clean,
          # machine-readable verdict (exactly APPROVE or REJECT) has been written
          # to claude-verdict.txt. Keeps the merge gate an exact string match with
          # no regex/intent-guessing over free-form review prose.
          settings: ${{ github.workspace }}/.github/workflows/claude-review-hooks/settings.json
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            IMPORTANT: The repository is checked out locally at the PR's head commit. Use Read, Glob, and Grep tools to inspect source files — do NOT use gh api to fetch file contents. The runner is ubuntu-latest so you cannot build or run this macOS Swift project; focus on static code review only.

            Additional review instructions:

            Do not comment on formatting/linting/style issues. These are handled by CI.

            Do not use `mcp__github_inline_comment__create_inline_comment`. Do not leave inline comments. State file path and line numbers in the primary comment.

            Do not read or review changes in generated files like graphql codegen output.

            TUI screen-scraping is a High-severity defect. REJECT any PR that adds logic parsing captured terminal screen text (tmux capture-pane output, pane text, composer lines) to infer agent state — e.g. matching TUI glyphs like ❯, prompts, placeholder or status strings. Agent state must come from machine interfaces (Claude Code hooks, transcript JSONL, control mode, exit codes). Likewise treat as High severity any file added to the `excluded:` lists of the `no_tui_scraping_literals` or `capture_pane_allowlist` rules in .swiftlint.yml without a compelling justification in the PR description. See the CLAUDE.md section "No TUI screen-scraping".

            INVESTIGATION REQUIREMENTS for guard/safety-shaped changes. Apply this section when the PR adds or modifies a guard, veto, safety check, gate, interceptor, or observer — anything whose purpose is to prevent a bad outcome or to watch an event stream. For such changes the dangerous bug is usually not in the diff: it is a false belief about unchanged code. Verify the premises, not just the logic built on them.

            1. Premise audit: extract every factual claim the PR description or design doc makes about EXISTING code — especially universally quantified ones ("all", "every", "only", "single chokepoint", "already handled", "verified"). Verify each with Grep/Read and cite file:line evidence. A false premise is a High severity finding even when the new code is internally correct. The more thorough and persuasive the PR description, the MORE its factual claims deserve verification — a well-argued writeup pre-frames the reviewer, and errors that survived the author's own careful reasoning live precisely in the premises.
            2. Interception completeness: if the change observes an event at one point in order to cover "all" occurrences, enumerate the other producers of that event codebase-wide (flag-gated alternates, fallback paths, legacy paths, CLI vs GUI splits) and confirm each one actually crosses the instrumented point. Default-off branches are where universal claims fail.
            3. Fail-direction analysis: enumerate every state in which the mechanism's input signal is nil, empty, stale, cleared, or reset, and classify each as fail-open (allows the guarded action) or fail-closed (blocks it). Every fail-open path needs an explicit justification; an unjustified fail-open path is at least Medium severity.
            4. Guard lifecycle / proxy-signal audit: if the guard self-clears, list every cause of clearing and check that each one implies the hazard is actually gone. When condition A stands in for semantic event B ("marker advanced" for "user acted"), list every cause of A and check each implies B.
            5. Claims-vs-tests reconciliation: for each guarantee the PR claims its tests prove ("fails safe", "cannot lose data"), confirm a test exercises the layer where that guarantee could break — a unit test restating the new logic does not prove an end-to-end claim.

            Record the assumption table (claim → verified/refuted → file:line evidence) in your Phase 1 notes file, and carry any refuted premise into the posted review as a finding. If the PR is not guard/safety-shaped, skip this section entirely — do not pad reviews of mechanical changes with it.

            IMPORTANT: You are to execute in three phases. Do not write the review content to your text response during Phases 1 and 2 — save that for Phase 3. Tool calls and brief phase transitions are fine.

            Phase 1: Write out your feedback and comments on the changes in a local txt file in the current working directory (not to GitHub). Use the Write tool to create the file, not shell redirection. Do not write to /tmp/.

            Phase 2: Read each piece of feedback individually, and consider if they're valid. If they are not valid, do not include it in the comment to GitHub. For feedback asking for tests, consider if the test would require too much mocking to be useful, and do not suggest adding tests that would mostly test 3rd party libraries or APIs. Avoid being persnickety. Keep a count of invalid or persnickety feedback filtered out.

            Phase 3: Read your filtered notes from the file, then post the formatted review using `mcp__github_comment__update_claude_comment`. This tool updates the sticky comment on the PR. Output only the review content with no phase narration or process commentary.
            Do NOT use `gh pr comment` — it creates comments outside the sticky comment and they won't be updated on re-review.

            Format:
            - The verdict (e.g. "✅ Approve", or "🧌 Reject" with changes requested) should be up at the very top. Do not approve PRs with unaddressed Medium or High severity issues.
            - Consider whether each item should be considered "high", "medium", or "minor" in severity.
            - High severity should NOT be measured as high relative to other feedback, but should try to use an objective scale.
            - Minor items should be tucked into an html <details><summary>..</summary> ... </details> section.
            - Don't spill ink glazing the PR (Strengths and Highlights should be rarely warranted and extremely succinct).
            - Include a count of invalid feedback not posted.

            VERDICT GATE (required, machine-read): Before you finish, use the Write tool to create the file `claude-verdict.txt` in the repository root containing EXACTLY one uppercase word and nothing else — either `APPROVE` or `REJECT`. Write `REJECT` if the PR has any unaddressed High or Medium severity issue; otherwise write `APPROVE`. This single token drives a required merge gate and is compared exactly, so the file must contain no other text, punctuation, emoji, or explanation (keep all of that in the sticky comment). A stop hook will refuse to let the session end until this file contains exactly APPROVE or REJECT.

            DIAGNOSTICS: At the very end of your comment, add a collapsed section:
            <details><summary>Review diagnostics</summary>
            List any tool calls that failed or were denied (e.g. "Write to /tmp/ blocked", "gh api denied"). If none failed, say so. This helps us tune the workflow permissions and allowedTools over time.
            </details>

            Do NOT submit a formal GitHub review (no `gh pr review`). Your outputs are the sticky comment via `mcp__github_comment__update_claude_comment` and the `claude-verdict.txt` file.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --max-turns 80
            --allowedTools "mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(cat:*),WebSearch,Read,Write,Glob,Grep,Task"

      - name: Enforce review verdict (block merge on Reject)
        if: steps.trust.outputs.trusted == 'true'
        run: |
          verdict_file="$GITHUB_WORKSPACE/claude-verdict.txt"
          if [ ! -f "$verdict_file" ]; then
            echo "::error::Claude review recorded no verdict file — failing closed. Re-run the review."
            exit 1
          fi
          # Whitespace-trimmed exact comparison — NO regex/substring matching, so
          # review prose can never be misread as a verdict. The Stop hook normally
          # guarantees the file is exactly APPROVE or REJECT; because the pre-review
          # reset deleted any PR-committed copy, a killed/timed-out session leaves no
          # file here and this step fails closed rather than trusting stale content.
          verdict="$(tr -d '[:space:]' < "$verdict_file")"
          echo "Recorded verdict: '$verdict'"
          case "$verdict" in
            APPROVE)
              echo "Claude approved — merge gate satisfied." ;;
            REJECT)
              echo "::error::Claude review requested changes. Resolve the flagged High/Medium issues and push again."
              exit 1 ;;
            *)
              echo "::error::Verdict file did not contain exactly APPROVE or REJECT (got '$verdict') — failing closed."
              exit 1 ;;
          esac
