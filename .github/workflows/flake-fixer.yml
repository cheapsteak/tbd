name: Flake fixer

# docs/specs/2026-10-07-flake-autofix-design.md. The spec's jobs share this one
# file (§3):
#   - `ledger` reads per-test results from the nightly and from rerun-erased CI
#     runs and keeps one issue per flaky test (§4);
#   - `ledger-notice` reports a red `ledger` run (§8);
#   - `fix` picks one qualifying test a night, measures a pre-fix baseline, runs
#     a Claude session to fix it, and stress-verifies the result (§5, §6). It
#     holds no write credential and writes nothing to GitHub; its result is an
#     artifact;
#   - `publish` turns that artifact into a branch, a draft PR, a commit status
#     and an attempt record, with the App token, on a runner no model touched
#     (§7);
#   - `promote` joins later.
#
# OFF BY DEFAULT (§10). With FLAKE_LEDGER_ENABLED unset, or anything other than
# 'true', the ledger runs report-only: it computes everything, writes it to the
# job summary, and writes no issue (§4.5). Report-only needs no App token. With
# FLAKE_FIXER_ENABLED 'true' the ledger job first reclaims orphaned flakefix/*
# branches (§11), and `fix` and `publish` run; `fix` refuses, red, while the
# ledger is off.
#
# ONLY THE BOT'S OWN COMMENTS ARE STATE (§4.4). Every ledger write uses the
# tbd-flake-fixer App's token, so its comments are authored by
# `tbd-flake-fixer[bot]`, and the step after minting checks that the App's slug
# names exactly the login the readers trust (`flake_lib.BOT_LOGIN`).
#
# A RED LEDGER RUN IS REPORTED IN EITHER MODE (§8), by `ledger-notice`. Without
# an App token whose login checked out – report-only mode, or a mint that
# failed – it posts with the job token, as github-actions[bot]. That one
# comment on the tracking issue is the only issue write the job token makes,
# and `ledger-notice` is the only job whose token may write issues.
#
# `workflow_run` and `schedule` fire only from this file as it exists on
# `main`, so nothing here runs before merge.

on:
  # §3, §9: one attempt a night, early in the UTC day, so the fix job's
  # timeout ends it before the nightly's 11:00 schedule.
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows: [Nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        required: true
        options: [ledger, fix]
      issue:
        description: 'fix only: the issue number to attempt (optional)'
        type: string
        required: false

permissions: {}

# No workflow-level concurrency: each job carries its own group, so a run
# started by one trigger never queues behind another job's.

jobs:
  ledger:
    name: ledger
    if: >-
      github.repository == 'cheapsteak/tbd' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Nightly') ||
       (github.event_name == 'workflow_dispatch' && inputs.job == 'ledger'))
    runs-on: ubuntu-latest
    # Reads a week of runs and their artifacts, then one write per changed
    # issue; minutes, not tens of them.
    timeout-minutes: 30
    # Two ledger runs must not race to create the same issue (§11).
    concurrency:
      group: flake-ledger-state
      cancel-in-progress: false
    # The job token reads; issue writes use the App token. `contents: write`
    # is for the flakefix/* reclaimer's ref deletions alone.
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    env:
      LEDGER_ENABLED: ${{ vars.FLAKE_LEDGER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim flakefix/* branches no open PR uses
        if: vars.FLAKE_FIXER_ENABLED == 'true'
        # A sweep that keeps or fails to delete a ref exits non-zero; that is
        # the reclaimer's business and must not stop the ledger behind it. Its
        # step stays red in the run for a human to read.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The sweep deletes with `git push`, and the checkout persisted no
          # credential. Grant one for this step only.
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          bash scripts/sweep-preflight-refs.sh --namespace flakefix/ --min-age-seconds 86400 --apply

      - name: Mint the tbd-flake-fixer App token
        id: app-token
        if: vars.FLAKE_LEDGER_ENABLED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLAKE_FIXER_APP_ID }}
          private-key: ${{ secrets.FLAKE_FIXER_APP_PRIVATE_KEY }}

      - name: Check the App token's bot login
        id: bot-login
        if: vars.FLAKE_LEDGER_ENABLED == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if ! python3 scripts/flake_lib.py check-app-slug "$APP_SLUG"; then
            echo "::error::the App token's login is not the one the ledger's readers trust (scripts/flake_lib.py BOT_LOGIN)"
            exit 1
          fi

      - name: Ledger
        env:
          GH_TOKEN: ${{ github.token }}
          FLAKE_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$LEDGER_ENABLED" = "true" ]; then
            python3 scripts/flake-ledger.py run --repo "$GITHUB_REPOSITORY" --work-dir "$RUNNER_TEMP/flake-ledger" --write
          else
            python3 scripts/flake-ledger.py run --repo "$GITHUB_REPOSITORY" --work-dir "$RUNNER_TEMP/flake-ledger"
          fi

  # §8: one comment on the tracking issue for the first red `ledger` run after
  # a green one, and nothing for later consecutive reds. A job of its own so
  # that only it holds `issues: write` on the job token: the `ledger` job, which
  # runs the whole ledger, cannot write an issue with it.
  ledger-notice:
    name: ledger-notice
    needs: ledger
    if: always() && github.repository == 'cheapsteak/tbd' && needs.ledger.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      TRACKING_ISSUE: '519'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # With the ledger on, the comment comes from the bot like every other
      # ledger write. A mint that fails, or a token from the wrong App, falls
      # back to the job token rather than leaving the red run unreported.
      - name: Mint the App token for the notice
        id: notice-app-token
        if: vars.FLAKE_LEDGER_ENABLED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLAKE_FIXER_APP_ID }}
          private-key: ${{ secrets.FLAKE_FIXER_APP_PRIVATE_KEY }}

      - name: Check the notice token's bot login
        id: notice-bot-login
        if: steps.notice-app-token.outcome == 'success'
        continue-on-error: true
        env:
          APP_SLUG: ${{ steps.notice-app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if ! python3 scripts/flake_lib.py check-app-slug "$APP_SLUG"; then
            echo "::warning::the App token's login is not the trusted one; the notice uses the job token"
            exit 1
          fi

      - name: Report the first red ledger run after a green one
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.notice-app-token.outputs.token }}
          USE_APP_TOKEN: ${{ steps.notice-bot-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          # The token is chosen once; the job token always carries --job-token,
          # so its comment says how it was posted.
          if [ "$USE_APP_TOKEN" = "true" ]; then
            token="$APP_TOKEN"; extra=()
          else
            token="$GH_TOKEN"; extra=(--job-token)
          fi
          FLAKE_WRITE_TOKEN="$token" python3 scripts/flake-ledger.py report-red-run \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --issue "$TRACKING_ISSUE" "${extra[@]}"

  # ─────────────────────────────────────────────────────────────────────────────
  # fix: one attempt, on macOS, with no write credential (§6). Its only output
  # is two artifacts: `flakefix-pick`, uploaded the moment the picker chooses so
  # that a run killed later still leaves a record of what it picked, and
  # `flakefix-candidate`, the bundle, notes, baseline and verdict.
  fix:
    name: fix
    if: >-
      vars.FLAKE_FIXER_ENABLED == 'true' && github.repository == 'cheapsteak/tbd' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.job == 'fix'))
    runs-on: macos-26
    # §9: builds (15 warm, 22 cold), the baseline (10), two 60-minute sessions,
    # two verifier runs of 24 each, and 20 for checkouts, ending the
    # session's processes, and the artifacts.  Worst case 235.
    timeout-minutes: 240
    concurrency:
      group: flake-fixer-fix
      cancel-in-progress: false
    # Read scopes only, and no id-token: the session's GITHUB_TOKEN cannot
    # write, and claude-code-action cannot trade OIDC for the Claude App's
    # installation token (§6.1).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      # The verifier copy is fingerprinted (below); a .pyc written into it by a
      # later import would read as tampering.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # §10: the fixer refuses to start without the ledger, on schedule and on
      # dispatch alike. A step rather than a job-level if:, because a skipped
      # job is easy to miss and a red one is not.
      - name: Refuse to run without the ledger
        if: vars.FLAKE_LEDGER_ENABLED != 'true'
        run: |
          echo "The flake fixer is on but the ledger is off: set FLAKE_LEDGER_ENABLED to 'true'. The fixer reads ledger comments that report-only mode never writes." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::FLAKE_FIXER_ENABLED is on but FLAKE_LEDGER_ENABLED is not"
          exit 1

      # The session tree (§6.1): the workspace root, so the SwiftPM cache paths
      # match the ones test.yml saved. Full history for git-restore-mtime.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The verification tree is a second clone at the same SHA, under
      # $RUNNER_TEMP, outside the workspace, which the session is never pointed
      # at. Main's scripts are copied out of it now, before any session runs:
      # every verifier call below runs from that copy ($VS), never from the
      # candidate (§6.4).
      - name: Lay out the attempt, the verification tree, and the verifier copy
        id: layout
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/flakefix"
          VT="$RUNNER_TEMP/flakefix-verify"
          VS="$RUNNER_TEMP/flakefix-verifier-scripts"
          rm -rf "$T" "$VT" "$VS"
          mkdir -p "$T/pick" "$VS"
          {
            echo "T=$T"
            echo "VT=$VT"
            echo "VS=$VS"
            echo "FLAKEFIX_NOTES=$T/flakefix-notes.md"
          } >> "$GITHUB_ENV"
          base="$(git rev-parse HEAD)"
          echo "$base" > "$T/pick/base_sha"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_RUN_ID" > "$T/pick/run_id"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$T/pick/started_at"
          git clone -q --no-hardlinks "file://$GITHUB_WORKSPACE" "$VT"
          git -C "$VT" checkout -q --detach "$base"
          cp -R "$VT/scripts" "$VS/scripts"
          mkdir -p "$VS/.github"
          cp -R "$VT/.github/flake-fixer" "$VS/.github/flake-fixer"

      - name: Pick tonight's target
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -uo pipefail
          rc=0
          python3 "$VS/scripts/flake-pick.py" run --repo "$GITHUB_REPOSITORY" --out-dir "$T/pick" \
            --root "$GITHUB_WORKSPACE" ${ISSUE:+--issue "$ISSUE"} || rc=$?
          if [ "$rc" = 3 ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            echo "No test is eligible for a fix attempt tonight." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          {
            echo "attempted=true"
            echo "issue=$(jq -r .issue "$T/pick/target.json")"
            echo "test_id=$(jq -r .test_id "$T/pick/target.json")"
          } >> "$GITHUB_OUTPUT"
          echo "Picked #$(jq -r .issue "$T/pick/target.json"): \`$(jq -r .test_id "$T/pick/target.json")\`" >> "$GITHUB_STEP_SUMMARY"

      # Persisted before anything slow: `publish` runs on any outcome of this
      # job and records `aborted` from this artifact alone when the candidate
      # never arrives, so a timeout or a cancel cannot leave the picker to
      # choose the same test again on the same evidence (§8).
      - name: Persist the pick
        if: steps.pick.outputs.attempted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flakefix-pick
          path: ${{ env.T }}/pick/
          retention-days: 7

      - name: Restore source mtimes from git commit times
        if: steps.pick.outputs.attempted == 'true'
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2

      - name: Install tmux
        if: steps.pick.outputs.attempted == 'true'
        run: brew install tmux

      - name: Select Xcode 26.6 (Swift 6.3.3)
        if: steps.pick.outputs.attempted == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Capture Swift toolchain version
        if: steps.pick.outputs.attempted == 'true'
        run: echo "SWIFT_VERSION=$(xcrun swift --version | head -1)" >> "$GITHUB_ENV"

      # RESTORE-ONLY, as in the nightly: this job benefits from the cache and
      # never reshapes it.
      - name: Restore SwiftPM build cache (read-only)
        if: steps.pick.outputs.attempted == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-src-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-deps-${{ hashFiles('Package.resolved') }}-

      - name: Repair the restored SwiftPM workspace if it is damaged
        if: steps.pick.outputs.attempted == 'true'
        run: bash scripts/repair-spm-workspace.sh

      - name: Build the session tree (warm)
        if: steps.pick.outputs.attempted == 'true'
        timeout-minutes: 20
        run: scripts/swift-safe build --build-tests

      - name: Build the verification tree (cold)
        if: steps.pick.outputs.attempted == 'true'
        timeout-minutes: 30
        working-directory: ${{ env.VT }}
        run: '"$VS/scripts/swift-safe" build --build-tests'

      # §6.3: 20 test-alone iterations on main, which choose the scope and size
      # N. More than two excluded iterations abort the attempt before any
      # session starts.
      - name: Pre-fix baseline and N (verification tree)
        id: baseline
        if: steps.pick.outputs.attempted == 'true'
        timeout-minutes: 15
        working-directory: ${{ env.VT }}
        env:
          TEST_ID: ${{ steps.pick.outputs.test_id }}
        run: |
          set -uo pipefail
          abort() { echo "$1" > "$T/abort_reason"; echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          rc=0
          bash "$VS/scripts/flake-verify.sh" quarantined --test "$TEST_ID" > "$T/quarantined" || rc=$?
          [ "$rc" = 0 ] || abort "Cannot tell whether $TEST_ID is quarantined ($(cat "$T/quarantined")); the retry check needs to know."
          bash "$VS/scripts/flake-verify.sh" baseline --test "$TEST_ID" --quarantined "$(cat "$T/quarantined")" --out-dir "$T/baseline" || rc=$?
          [ "$rc" = 4 ] && abort "The baseline excluded more than 2 of its 20 iterations, so it is not measuring the test."
          [ "$rc" = 0 ] || abort "The baseline's stress loop failed on main (exit $rc): a build or harness problem, not a flake."
          bash "$VS/scripts/flake-verify.sh" plan-iterations --scope "$(cat "$T/baseline/scope")" \
            --baseline-dir "$T/baseline" --out "$T/plan.json" || abort "Cannot plan the iteration count."
          cat "$T/baseline/baseline.md" >> "$GITHUB_STEP_SUMMARY"
          # Everything the verifier reads after a session, as step outputs,
          # which no session can rewrite. Each "End session" step puts these
          # back over the files before anything reads them.
          delim="FLAKEFIX_MD_$(openssl rand -hex 16)"
          {
            echo "scope=$(cat "$T/baseline/scope")"
            echo "f=$(cat "$T/baseline/f")"
            echo "v=$(cat "$T/baseline/v")"
            echo "quarantined=$(cat "$T/quarantined")"
            echo "plan=$(jq -c . "$T/plan.json")"
            echo "md<<$delim"; cat "$T/baseline/baseline.md"; echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Create the working branch
        if: steps.pick.outputs.attempted == 'true'
        env:
          ISSUE: ${{ steps.pick.outputs.issue }}
        run: |
          set -euo pipefail
          git switch -c "flakefix/issue-$ISSUE"
          git config user.name "tbd-flake-fixer[bot]"
          git config user.email "tbd-flake-fixer[bot]@users.noreply.github.com"

      # The verifier copy's fingerprint, held in a step output the session
      # cannot rewrite: every path in it (so a planted file or symlink shows,
      # such as a json.py Python would import ahead of the standard library),
      # every regular file's contents, and every symlink's target. The
      # function is written out in each step that uses it, never taken from
      # the environment, which a session can extend through $GITHUB_ENV.
      - name: Fingerprint the verifier copy
        if: steps.pick.outputs.attempted == 'true'
        id: vsfp
        run: |
          set -euo pipefail
          fingerprint() { (cd "$1" && { find . -print | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256; find . -type l -print0 | LC_ALL=C sort -z | xargs -0 -n1 readlink 2>/dev/null; } | shasum -a 256 | cut -d' ' -f1); }
          echo "sum=$(fingerprint "$VS")" >> "$GITHUB_OUTPUT"

      # ── Try 1 (§6.6) ─────────────────────────────────────────────────────────
      - name: Snapshot processes before session 1
        id: snap1
        if: steps.pick.outputs.attempted == 'true'
        run: |
          set -euo pipefail
          bash "$VS/scripts/flake-verify.sh" snapshot-processes --out "$T/procs-before-1"
          echo "sum=$(shasum -a 256 < "$T/procs-before-1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Compose the session 1 prompt
        if: steps.pick.outputs.attempted == 'true'
        id: prompt1
        run: |
          set -euo pipefail
          python3 "$VS/scripts/flake-pick.py" compose-prompt --template "$VS/.github/flake-fixer/session-prompt.md" \
            --brief "$T/pick/brief.md" --baseline "$T/baseline/baseline.md" --notes-path "$FLAKEFIX_NOTES" --out "$T/prompt1.txt"
          delim="FLAKEFIX_PROMPT_$(openssl rand -hex 16)"
          { echo "prompt<<$delim"; cat "$T/prompt1.txt"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Fixer session 1
        if: steps.pick.outputs.attempted == 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's read-only token, passed explicitly so the action never
          # attempts the OIDC exchange for the Claude App's token (§6.1).
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt1.outputs.prompt }}
          # §6.1: the build and test scripts, local git, and file reading and
          # editing. No WebFetch, no WebSearch, no gh, no curl, no git push or
          # fetch.
          claude_args: |
            --max-turns 300
            --allowedTools "Bash(scripts/test.sh:*),Bash(scripts/swift-safe:*),Bash(bash scripts/nightly-flake-stress.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*),Bash(git rev-parse:*),Read,Write,Edit,Glob,Grep"

      - name: End session 1, bundle its commits
        if: steps.pick.outputs.attempted == 'true'
        id: c1
        env:
          VS_SUM: ${{ steps.vsfp.outputs.sum }}
          SNAP_SUM: ${{ steps.snap1.outputs.sum }}
          BASE: ${{ steps.layout.outputs.base }}
          SCOPE: ${{ steps.baseline.outputs.scope }}
          BASELINE_F: ${{ steps.baseline.outputs.f }}
          BASELINE_V: ${{ steps.baseline.outputs.v }}
          BASELINE_MD: ${{ steps.baseline.outputs.md }}
          QUARANTINED: ${{ steps.baseline.outputs.quarantined }}
          PLAN: ${{ steps.baseline.outputs.plan }}
        run: |
          set -uo pipefail
          abort() { echo "$1" > "$T/abort_reason"; rm -f "$T/candidate.bundle"; echo "::error::$1"; exit 1; }
          # Only this step decides an abort; a leftover file is the session's.
          rm -f "$T/abort_reason"
          rc=0
          fingerprint() { (cd "$1" && { find . -print | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256; find . -type l -print0 | LC_ALL=C sort -z | xargs -0 -n1 readlink 2>/dev/null; } | shasum -a 256 | cut -d' ' -f1); }
          # The kill runs from a private copy of the verifier and the snapshot,
          # in a directory the session never knew, each checked against the
          # sum taken before the session; the shared copy is checked again
          # once nothing of the session is left to change it back.
          own="$(mktemp -d)"
          cp -R "$VS/." "$own/" || abort "Cannot copy the verifier."
          cp "$T/procs-before-1" "$own/procs-before" || abort "Cannot copy the process snapshot."
          [ "$(fingerprint "$own")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 1."
          [ "$(fingerprint "$VS")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 1."
          [ "$(shasum -a 256 < "$own/procs-before" | cut -d' ' -f1)" = "$SNAP_SUM" ] \
            || abort "The process snapshot changed during session 1."
          bash "$own/scripts/flake-verify.sh" end-session-processes --before "$own/procs-before" || rc=$?
          [ "$rc" = 0 ] || abort "A process session 1 started survived SIGKILL (exit $rc); nothing is verified with one alive."
          [ "$(fingerprint "$VS")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 1."
          # Results the session could have planted: only the verifier writes these.
          rm -rf "$T/verify" "$T/verify-1"
          # The session could reach these files; put back what was measured.
          printf '%s\n' "$SCOPE" > "$T/baseline/scope"; printf '%s\n' "$BASELINE_F" > "$T/baseline/f"
          printf '%s\n' "$BASELINE_V" > "$T/baseline/v"; printf '%s\n' "$BASELINE_MD" > "$T/baseline/baseline.md"
          printf '%s\n' "$QUARANTINED" > "$T/quarantined"; printf '%s\n' "$PLAN" > "$T/plan.json"
          printf '%s\n' "$BASE" > "$T/pick/base_sha"
          base="$BASE"
          n="$(git rev-list --count "$base"..HEAD)" || abort "Cannot count session 1's commits."
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          rm -f "$T/candidate.bundle" "$T/head_sha"
          if [ "$n" != 0 ]; then
            git bundle create -q "$T/candidate.bundle" "$base"..HEAD
            git rev-parse HEAD > "$T/head_sha"
          fi
          echo "Session 1 left $n commit(s)." >> "$GITHUB_STEP_SUMMARY"

      # The stress run may outlive its allotment; the judge, not this step's
      # conclusion, decides, and an incomplete run is judged as truncated.
      - name: Stress try 1 (verification tree)
        if: steps.pick.outputs.attempted == 'true' && steps.c1.outputs.commits != '0'
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ${{ env.VT }}
        env:
          TEST_ID: ${{ steps.pick.outputs.test_id }}
        run: |
          set -uo pipefail
          base="$(cat "$T/pick/base_sha")"
          mkdir -p "$T/verify"
          if ! bash "$VS/scripts/flake-verify.sh" apply-candidate --bundle "$T/candidate.bundle" --base "$base" > "$T/verify/applied"; then
            echo "apply-candidate refused the bundle" > "$T/verify/harness-error"
            exit 1
          fi
          rc=0
          bash "$VS/scripts/flake-verify.sh" protected-touched --base "$base" > "$T/verify/protected.txt" || rc=$?
          [ "$rc" -le 1 ] || { echo "protected-touched failed" > "$T/verify/harness-error"; exit 1; }
          # Whether the target carries .flaky in the CANDIDATE decides which
          # retry records the judge expects (§6.4): a fix that adds a
          # quarantine must still show every run passing on its first try.
          if ! bash "$VS/scripts/flake-verify.sh" quarantined --test "$TEST_ID" > "$T/verify/quarantined"; then
            echo "cannot tell whether the candidate quarantines $TEST_ID: $(cat "$T/verify/quarantined")" > "$T/verify/harness-error"
            exit 1
          fi
          bash "$VS/scripts/flake-verify.sh" stress --scope "$(cat "$T/baseline/scope")" --test "$TEST_ID" \
            --iterations "$(jq -r .n "$T/plan.json")" --out-dir "$T/verify"

      - name: Judge try 1
        if: steps.pick.outputs.attempted == 'true' && steps.c1.outputs.commits != '0'
        id: v1
        env:
          TEST_ID: ${{ steps.pick.outputs.test_id }}
        run: |
          set -uo pipefail
          rc=0
          # The candidate's own quarantine answer. Anything but yes or no
          # comes with a harness-error marker, which fails the run by itself.
          q="$(cat "$T/verify/quarantined" 2>/dev/null)"
          case "$q" in yes|no) ;; *) q=no; [ -f "$T/verify/harness-error" ] || echo "no quarantine answer" > "$T/verify/harness-error" ;; esac
          bash "$VS/scripts/flake-verify.sh" judge --scope "$(cat "$T/baseline/scope")" --test "$TEST_ID" --dir "$T/verify" \
            --iterations "$(jq -r .n "$T/plan.json")" --quarantined "$q" \
            --protected-touched "$T/verify/protected.txt" --plan "$T/plan.json" --baseline-md "$T/baseline/baseline.md" || rc=$?
          [ "$rc" = 2 ] && exit 2
          echo "verdict=$(jq -r .verdict "$T/verify/verdict.json")" >> "$GITHUB_OUTPUT"
          # A harness failure says nothing about the candidate: no second try.
          if [ -f "$T/verify/harness-error" ]; then echo "harness=true" >> "$GITHUB_OUTPUT"; else echo "harness=false" >> "$GITHUB_OUTPUT"; fi
          cat "$T/verify/verdict.md" >> "$GITHUB_STEP_SUMMARY"

      # ── Try 2 (§6.6): only after a failing verdict that measured the
      # candidate. An `ineligible` one (a protected file touched) would not
      # change on a retry, and a harness failure measured nothing. Same scope,
      # same N.
      - name: Prepare try 2
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true'
        run: |
          set -euo pipefail
          mv "$T/verify" "$T/verify-1"
          {
            echo "The verifier failed your first try. Its findings, then your notes from that try:"
            echo
            echo '````text'
            head -200 "$T/verify-1/failing-lines.txt"
            echo '````'
            echo
            cat "$FLAKEFIX_NOTES" 2>/dev/null || echo "(you wrote no notes)"
          } > "$T/prior-try.md"

      - name: Snapshot processes before session 2
        id: snap2
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true'
        run: |
          set -euo pipefail
          bash "$VS/scripts/flake-verify.sh" snapshot-processes --out "$T/procs-before-2"
          echo "sum=$(shasum -a 256 < "$T/procs-before-2" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Compose the session 2 prompt
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true'
        id: prompt2
        run: |
          set -euo pipefail
          python3 "$VS/scripts/flake-pick.py" compose-prompt --template "$VS/.github/flake-fixer/session-prompt.md" \
            --brief "$T/pick/brief.md" --baseline "$T/baseline/baseline.md" --notes-path "$FLAKEFIX_NOTES" \
            --prior-try "$T/prior-try.md" --out "$T/prompt2.txt"
          delim="FLAKEFIX_PROMPT_$(openssl rand -hex 16)"
          { echo "prompt<<$delim"; cat "$T/prompt2.txt"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Fixer session 2
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt2.outputs.prompt }}
          claude_args: |
            --max-turns 300
            --allowedTools "Bash(scripts/test.sh:*),Bash(scripts/swift-safe:*),Bash(bash scripts/nightly-flake-stress.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git add:*),Bash(git commit:*),Bash(git restore:*),Bash(git rev-parse:*),Read,Write,Edit,Glob,Grep"

      - name: End session 2, bundle its commits
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true'
        id: c2
        env:
          VS_SUM: ${{ steps.vsfp.outputs.sum }}
          SNAP_SUM: ${{ steps.snap2.outputs.sum }}
          BASE: ${{ steps.layout.outputs.base }}
          SCOPE: ${{ steps.baseline.outputs.scope }}
          BASELINE_F: ${{ steps.baseline.outputs.f }}
          BASELINE_V: ${{ steps.baseline.outputs.v }}
          BASELINE_MD: ${{ steps.baseline.outputs.md }}
          QUARANTINED: ${{ steps.baseline.outputs.quarantined }}
          PLAN: ${{ steps.baseline.outputs.plan }}
        run: |
          set -uo pipefail
          abort() { echo "$1" > "$T/abort_reason"; rm -f "$T/candidate.bundle"; echo "::error::$1"; exit 1; }
          # Only this step decides an abort; a leftover file is the session's.
          rm -f "$T/abort_reason"
          rc=0
          fingerprint() { (cd "$1" && { find . -print | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256; find . -type l -print0 | LC_ALL=C sort -z | xargs -0 -n1 readlink 2>/dev/null; } | shasum -a 256 | cut -d' ' -f1); }
          # The kill runs from a private copy of the verifier and the snapshot,
          # in a directory the session never knew, each checked against the
          # sum taken before the session; the shared copy is checked again
          # once nothing of the session is left to change it back.
          own="$(mktemp -d)"
          cp -R "$VS/." "$own/" || abort "Cannot copy the verifier."
          cp "$T/procs-before-2" "$own/procs-before" || abort "Cannot copy the process snapshot."
          [ "$(fingerprint "$own")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 2."
          [ "$(fingerprint "$VS")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 2."
          [ "$(shasum -a 256 < "$own/procs-before" | cut -d' ' -f1)" = "$SNAP_SUM" ] \
            || abort "The process snapshot changed during session 2."
          bash "$own/scripts/flake-verify.sh" end-session-processes --before "$own/procs-before" || rc=$?
          [ "$rc" = 0 ] || abort "A process session 2 started survived SIGKILL (exit $rc); nothing is verified with one alive."
          [ "$(fingerprint "$VS")" = "$VS_SUM" ] || abort "The verifier's copy of main's scripts changed during session 2."
          # Results the session could have planted: only the verifier writes these.
          rm -rf "$T/verify"
          # The session could reach these files; put back what was measured.
          printf '%s\n' "$SCOPE" > "$T/baseline/scope"; printf '%s\n' "$BASELINE_F" > "$T/baseline/f"
          printf '%s\n' "$BASELINE_V" > "$T/baseline/v"; printf '%s\n' "$BASELINE_MD" > "$T/baseline/baseline.md"
          printf '%s\n' "$QUARANTINED" > "$T/quarantined"; printf '%s\n' "$PLAN" > "$T/plan.json"
          printf '%s\n' "$BASE" > "$T/pick/base_sha"
          base="$BASE"
          n="$(git rev-list --count "$base"..HEAD)" || abort "Cannot count the sessions' commits."
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          rm -f "$T/candidate.bundle" "$T/head_sha"
          if [ "$n" != 0 ]; then
            git bundle create -q "$T/candidate.bundle" "$base"..HEAD
            git rev-parse HEAD > "$T/head_sha"
          fi
          echo "After session 2 the branch holds $n commit(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Stress try 2 (verification tree)
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true' && steps.c2.outputs.commits != '0'
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ${{ env.VT }}
        env:
          TEST_ID: ${{ steps.pick.outputs.test_id }}
        run: |
          set -uo pipefail
          base="$(cat "$T/pick/base_sha")"
          mkdir -p "$T/verify"
          if ! bash "$VS/scripts/flake-verify.sh" apply-candidate --bundle "$T/candidate.bundle" --base "$base" > "$T/verify/applied"; then
            echo "apply-candidate refused the bundle" > "$T/verify/harness-error"
            exit 1
          fi
          rc=0
          bash "$VS/scripts/flake-verify.sh" protected-touched --base "$base" > "$T/verify/protected.txt" || rc=$?
          [ "$rc" -le 1 ] || { echo "protected-touched failed" > "$T/verify/harness-error"; exit 1; }
          # Whether the target carries .flaky in the CANDIDATE decides which
          # retry records the judge expects (§6.4): a fix that adds a
          # quarantine must still show every run passing on its first try.
          if ! bash "$VS/scripts/flake-verify.sh" quarantined --test "$TEST_ID" > "$T/verify/quarantined"; then
            echo "cannot tell whether the candidate quarantines $TEST_ID: $(cat "$T/verify/quarantined")" > "$T/verify/harness-error"
            exit 1
          fi
          bash "$VS/scripts/flake-verify.sh" stress --scope "$(cat "$T/baseline/scope")" --test "$TEST_ID" \
            --iterations "$(jq -r .n "$T/plan.json")" --out-dir "$T/verify"

      - name: Judge try 2
        if: steps.v1.outputs.verdict == 'fail' && steps.v1.outputs.harness != 'true' && steps.c2.outputs.commits != '0'
        id: v2
        env:
          TEST_ID: ${{ steps.pick.outputs.test_id }}
        run: |
          set -uo pipefail
          rc=0
          # The candidate's own quarantine answer. Anything but yes or no
          # comes with a harness-error marker, which fails the run by itself.
          q="$(cat "$T/verify/quarantined" 2>/dev/null)"
          case "$q" in yes|no) ;; *) q=no; [ -f "$T/verify/harness-error" ] || echo "no quarantine answer" > "$T/verify/harness-error" ;; esac
          bash "$VS/scripts/flake-verify.sh" judge --scope "$(cat "$T/baseline/scope")" --test "$TEST_ID" --dir "$T/verify" \
            --iterations "$(jq -r .n "$T/plan.json")" --quarantined "$q" \
            --protected-touched "$T/verify/protected.txt" --plan "$T/plan.json" --baseline-md "$T/baseline/baseline.md" || rc=$?
          [ "$rc" = 2 ] && exit 2
          echo "verdict=$(jq -r .verdict "$T/verify/verdict.json")" >> "$GITHUB_OUTPUT"
          cat "$T/verify/verdict.md" >> "$GITHUB_STEP_SUMMARY"

      # Data only: the bundle, notes, baseline, plan and verdict. The verifier
      # copy lives outside $T and is not uploaded.
      - name: Package the attempt
        if: always() && steps.pick.outputs.attempted == 'true'
        run: |
          set -uo pipefail
          if [ -f "$T/abort_reason" ]; then
            echo aborted > "$T/outcome"; rm -f "$T/candidate.bundle"
          elif [ ! -f "$T/plan.json" ]; then
            echo "The job ended before the baseline finished (a failed build or step)." > "$T/abort_reason"
            echo aborted > "$T/outcome"
          elif [ -f "$T/candidate.bundle" ]; then
            echo candidate > "$T/outcome"
          else
            echo no-diff > "$T/outcome"
          fi
          echo "Outcome: $(cat "$T/outcome")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate
        if: always() && steps.pick.outputs.attempted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flakefix-candidate
          path: ${{ env.T }}/
          if-no-files-found: ignore
          retention-days: 7  # spec §11

  # ─────────────────────────────────────────────────────────────────────────────
  # publish: every write an attempt makes, with the App token, on ubuntu, after
  # `fix` has ended on its own runner (§7). It runs whatever `fix` concluded —
  # failed, timed out, cancelled — so the `flakefix-pick` artifact alone is
  # enough to record an `aborted` attempt (§8).
  publish:
    name: publish
    needs: fix
    if: always() && vars.FLAKE_FIXER_ENABLED == 'true' && github.repository == 'cheapsteak/tbd' && needs.fix.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The attempt comment sits on the issues the ledger writes; one writer at
    # a time.
    concurrency:
      group: flake-ledger-state
      cancel-in-progress: false
    # The job token reads nothing it needs; every write uses the App token.
    permissions:
      contents: read
    steps:
      - name: Download the pick
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: flakefix-pick
          path: ${{ runner.temp }}/flakefix-pick

      - name: Check whether the fix run picked a target
        id: picked
        run: |
          if [ -f "$RUNNER_TEMP/flakefix-pick/target.json" ]; then
            echo "picked=true" >> "$GITHUB_OUTPUT"
          else
            echo "picked=false" >> "$GITHUB_OUTPUT"
            echo "The fix run picked no target; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The base commit must be here for the bundle to apply on top of it.
      - uses: actions/checkout@v4
        if: steps.picked.outputs.picked == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the candidate
        if: steps.picked.outputs.picked == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: flakefix-candidate
          path: ${{ runner.temp }}/flakefix-candidate

      - name: Mint the tbd-flake-fixer App token
        if: steps.picked.outputs.picked == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLAKE_FIXER_APP_ID }}
          private-key: ${{ secrets.FLAKE_FIXER_APP_PRIVATE_KEY }}

      - name: Check the App token's bot login
        if: steps.picked.outputs.picked == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if ! python3 scripts/flake_lib.py check-app-slug "$APP_SLUG"; then
            echo "::error::the App token's login is not the one the readers trust (scripts/flake_lib.py BOT_LOGIN)"
            exit 1
          fi

      # Runs whether or not the candidate arrived: without it, the attempt is
      # recorded `aborted` from the pick alone.
      - name: Push, open the draft PR, record the attempt
        if: steps.picked.outputs.picked == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flakefix-candidate"
          bash scripts/flake-pr.sh open --pick-dir "$RUNNER_TEMP/flakefix-pick" \
            --attempt-dir "$RUNNER_TEMP/flakefix-candidate" --repo "$GITHUB_REPOSITORY"
